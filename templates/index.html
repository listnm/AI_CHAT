<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI 对话</title>
    <style>
        /* ===== 基础重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                         "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff; color: #1f2328; overflow: hidden;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        /* ===== 布局 ===== */
        .app { display: flex; width: 100%; height: 100vh; height: 100dvh; }

        /* ========== 左侧图标栏（Trae 风格窄边栏） ========== */
        .nav-rail {
            width: 60px; flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid #eef0f3;
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 0 14px;
            gap: 8px;
            z-index: 10;
        }
        .nav-logo {
            width: 36px; height: 36px; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 15px;
            box-shadow: 0 2px 8px rgba(99,102,241,.3);
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .nav-item {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; color: #6b7280; cursor: pointer;
            transition: all .18s ease;
            flex-shrink: 0;
            position: relative;
        }
        .nav-item:hover { background: #f3f4f6; color: #111827; }
        .nav-item.active { background: #eef2ff; color: #6366f1; }
        .nav-item.active::after {
            content: ""; position: absolute; left: -10px; top: 10px; bottom: 10px;
            width: 3px; background: #6366f1; border-radius: 0 3px 3px 0;
        }
        .nav-spacer { flex: 1; }
        .nav-divider {
            width: 24px; height: 1px; background: #e5e7eb; margin: 4px 0;
        }

        /* ========== 侧边栏（对话列表） ========== */
        .sidebar {
            width: 280px; flex-shrink: 0;
            background: #fafbfc;
            border-right: 1px solid #eef0f3;
            display: flex; flex-direction: column; min-height: 0; height: 100%;
            transition: width .22s ease;
        }
        .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }

        .sidebar-header {
            padding: 18px 18px 10px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 13px; font-weight: 600; color: #6b7280;
            letter-spacing: .02em;
        }
        .sidebar-collapse-btn {
            width: 28px; height: 28px; border-radius: 7px;
            border: none; background: transparent; color: #6b7280;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: all .15s ease;
        }
        .sidebar-collapse-btn:hover { background: #eef0f3; color: #111827; }

        .sidebar-new { padding: 0 14px 14px; flex-shrink: 0; }
        .btn-new-chat {
            width: 100%; padding: 11px 14px; border-radius: 11px;
            border: 1px solid #e5e7eb; background: #fff; color: #1f2328;
            font-size: 14px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 9px;
            transition: all .18s cubic-bezier(.2,.8,.2,1);
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,.03);
        }
        .btn-new-chat:hover {
            background: #f9fafb; border-color: #d1d5db;
            box-shadow: 0 2px 6px rgba(0,0,0,.04);
        }
        .btn-new-chat:active { transform: scale(.985); }
        .btn-new-chat .plus {
            width: 18px; height: 18px; border-radius: 5px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-search { padding: 0 14px 12px; flex-shrink: 0; }
        .search-box {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; background: #fff;
            border: 1px solid #e5e7eb; border-radius: 9px;
            transition: all .15s ease;
        }
        .search-box:focus-within { border-color: #c7d2fe; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
        .search-box input {
            border: none; outline: none; background: transparent; flex: 1;
            font-size: 13px; font-family: inherit; color: #1f2328;
        }
        .search-box input::placeholder { color: #9ca3af; }
        .search-box .search-icon { color: #9ca3af; font-size: 13px; flex-shrink: 0; }

        .sidebar-conv-label {
            padding: 6px 18px; font-size: 11px; font-weight: 600; color: #9ca3af;
            letter-spacing: .05em; text-transform: uppercase; flex-shrink: 0;
        }
        .sidebar-convs {
            flex: 1 1 0; overflow-y: auto; overflow-x: hidden;
            padding: 2px 10px 12px;
            -webkit-overflow-scrolling: touch; min-height: 0;
        }
        .sidebar-convs::-webkit-scrollbar { width: 5px; }
        .sidebar-convs::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
        .sidebar-convs:hover::-webkit-scrollbar-thumb { background: #d1d5db; }

        .conv-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 11px; border-radius: 9px; cursor: pointer;
            color: #374151; margin-bottom: 2px;
            transition: background-color .15s ease; position: relative;
        }
        .conv-item:hover { background: #eef0f3; }
        .conv-item.active {
            background: #eef2ff;
            color: #1f2328;
            box-shadow: inset 0 0 0 1px rgba(99,102,241,.15);
        }
        .conv-icon {
            width: 18px; height: 18px; flex-shrink: 0; color: #9ca3af;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; margin-top: 2px;
        }
        .conv-item.active .conv-icon { color: #6366f1; }
        .conv-main { flex: 1; min-width: 0; }
        .conv-title-row { display: flex; align-items: center; gap: 6px; }
        .conv-title {
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            min-width: 0; line-height: 1.35; font-size: 13.5px; font-weight: 450;
        }
        .conv-item.active .conv-title { font-weight: 550; }
        .conv-time {
            font-size: 10.5px; color: #9ca3af; flex-shrink: 0; white-space: nowrap;
        }
        .conv-preview {
            font-size: 12px; color: #9ca3af; line-height: 1.4; margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .conv-del {
            width: 22px; height: 22px; border-radius: 6px; border: none;
            background: transparent; color: #9ca3af; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 14px; transition: all .15s ease;
            margin-top: 1px;
        }
        .conv-item:hover .conv-del { display: flex; }
        .conv-del:hover { background: #fee2e2; color: #dc2626; }

        .sidebar-footer {
            padding: 12px 14px; border-top: 1px solid #eef0f3; flex-shrink: 0;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar-footer-btn {
            flex: 1; padding: 9px 11px; border-radius: 9px; border: none;
            background: transparent; color: #374151; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: background-color .15s ease; font-family: inherit;
        }
        .sidebar-footer-btn:hover { background: #eef0f3; }
        .sf-icon {
            width: 18px; height: 18px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }

        /* 移动端 */
        .sidebar-mobile-toggle {
            display: none; position: fixed; top: 14px; left: 14px; z-index: 55;
            width: 38px; height: 38px; border-radius: 10px;
            background: #fff; border: 1px solid #e5e7eb; color: #374151;
            cursor: pointer; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
        }
        .sidebar-mask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; backdrop-filter: blur(2px); }
        .sidebar-mask.active { display: block; }

        @media (max-width: 900px) {
            .nav-rail { display: none; }
            .sidebar-mobile-toggle { display: flex; }
            .sidebar {
                position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
                transform: translateX(-100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
                box-shadow: 12px 0 40px rgba(0,0,0,.08);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar.collapsed { width: 280px; }
        }

        /* ========== 主区域 ========== */
        .main {
            flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
            background: #ffffff;
        }

        /* ------ 顶部栏 ------ */
        .main-header {
            padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; gap: 12px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            padding-left: calc(28px + env(safe-area-inset-left, 0px));
            padding-right: calc(28px + env(safe-area-inset-right, 0px));
        }
        @media (max-width: 900px) {
            .main-header { padding: 14px 16px 14px 68px; }
        }
        @media (max-width: 640px) {
            .main-header { padding: 12px 14px 12px 64px; }
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .header-model-pill {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 12px 6px 8px; border-radius: 10px;
            background: #f6f8fa; color: #374151; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all .18s ease; white-space: nowrap;
            max-width: 55vw; min-width: 0;
            border: 1px solid transparent;
        }
        .header-model-pill:hover { background: #eef0f3; border-color: #e5e7eb; }
        .header-model-icon {
            width: 22px; height: 22px; border-radius: 6px;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            color: #6366f1;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0;
        }
        .header-model-name {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .header-chev { color: #9ca3af; font-size: 11px; margin-left: 2px; }

        .header-title {
            font-size: 13.5px; color: #6b7280;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; max-width: 28vw; display: none;
            padding-left: 12px; margin-left: 12px;
            border-left: 1px solid #e5e7eb;
        }
        @media (min-width: 900px) { .header-title { display: block; } }

        .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 9px;
            background: transparent; border: none; color: #4b5563;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 17px; transition: all .15s ease;
        }
        .icon-btn:hover { background: #f3f4f6; color: #111827; }
        .icon-btn:active { transform: scale(.955); }

        /* ------ 聊天区容器 ------ */
        .chat-wrap {
            flex: 1 1 0; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch; min-height: 0;
            scroll-behavior: smooth;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,.07), transparent);
        }
        .chat-wrap::-webkit-scrollbar { width: 8px; }
        .chat-wrap::-webkit-scrollbar-track { background: transparent; }
        .chat-wrap::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        .chat-wrap::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        .chat-inner {
            max-width: 840px; margin: 0 auto;
            padding: 36px 32px 48px;
        }
        @media (max-width: 768px) { .chat-inner { padding: 24px 16px 36px; } }

        /* ------ 欢迎界面 ------ */
        .welcome {
            display: flex; flex-direction: column; align-items: center;
            padding: 56px 0 28px; text-align: center;
        }
        @media (max-width: 640px) { .welcome { padding: 36px 0 20px; } }
        .welcome-logo {
            width: 68px; height: 68px; border-radius: 20px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 30px; margin-bottom: 24px;
            box-shadow:
                0 12px 32px rgba(99,102,241,.28),
                0 0 0 1px rgba(255,255,255,.4) inset;
            animation: welcomeIn .5s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes welcomeIn {
            from { opacity: 0; transform: translateY(8px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .welcome-greeting {
            font-size: 13px; color: #6366f1; font-weight: 500;
            margin-bottom: 10px; letter-spacing: .02em;
        }
        .welcome-title {
            font-size: 30px; font-weight: 700; color: #111827;
            letter-spacing: -0.025em; margin-bottom: 10px;
            line-height: 1.2;
        }
        @media (max-width: 640px) { .welcome-title { font-size: 24px; } }
        .welcome-title .accent {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .welcome-sub {
            font-size: 14.5px; color: #6b7280; line-height: 1.7; margin-bottom: 36px;
            max-width: 520px;
        }

        .prompts {
            width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            max-width: 680px;
        }
        @media (max-width: 640px) { .prompts { grid-template-columns: 1fr; } }
        .prompt-card {
            padding: 15px 16px;
            border: 1px solid #eef0f3;
            background: #ffffff;
            border-radius: 13px; cursor: pointer; text-align: left;
            transition: all .2s cubic-bezier(.2,.8,.2,1);
            font-family: inherit;
            position: relative; overflow: hidden;
        }
        .prompt-card::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(99,102,241,.04), rgba(168,85,247,.04));
            opacity: 0; transition: opacity .2s ease;
        }
        .prompt-card:hover {
            border-color: #c7d2fe;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99,102,241,.1), 0 2px 6px rgba(0,0,0,.03);
        }
        .prompt-card:hover::before { opacity: 1; }
        .prompt-card > * { position: relative; }
        .prompt-icon {
            width: 32px; height: 32px; border-radius: 9px;
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            color: #8b5cf6;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; margin-bottom: 10px;
        }
        .prompt-card:nth-child(2) .prompt-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #2563eb; }
        .prompt-card:nth-child(3) .prompt-icon { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #16a34a; }
        .prompt-card:nth-child(4) .prompt-icon { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #d97706; }
        .prompt-title { font-size: 13.5px; font-weight: 600; color: #111827; margin-bottom: 3px; }
        .prompt-desc { font-size: 12.5px; color: #6b7280; line-height: 1.5; }

        /* ------ 消息列表 ------ */
        .msg-row { display: flex; gap: 14px; margin-bottom: 28px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        @media (max-width: 640px) {
            .msg-row { gap: 10px; margin-bottom: 22px; }
        }

        .msg-avatar {
            width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 650;
            transition: transform .2s ease;
        }
        .msg-row:hover .msg-avatar { transform: scale(1.03); }
        .msg-avatar.ai {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 60%, #a855f7 100%);
            color: #fff;
            box-shadow: 0 3px 10px rgba(99,102,241,.25);
        }
        .msg-avatar.usr {
            background: #f3f4f6; color: #374151;
            border: 1px solid #e5e7eb;
        }

        .msg-body { flex: 1; min-width: 0; padding-top: 2px; max-width: calc(100% - 48px); }
        .msg-meta {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
        }
        .msg-author {
            font-size: 12.5px; font-weight: 600; color: #6b7280;
        }
        .msg-badge {
            font-size: 10.5px; padding: 2px 7px; border-radius: 6px;
            background: #f3f4f6; color: #6b7280; font-weight: 500;
        }
        .msg-row.user .msg-meta { justify-content: flex-end; }

        .msg-content {
            font-size: 15px; line-height: 1.75; color: #1f2328;
            word-wrap: break-word; word-break: break-word;
        }
        .msg-row.user .msg-content {
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            color: #1e1b4b;
            padding: 11px 15px;
            border-radius: 14px 14px 4px 14px;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(99,102,241,.06);
            border: 1px solid rgba(99,102,241,.08);
        }
        .msg-row.user .msg-body { text-align: right; }
        .msg-row.user .msg-content { text-align: left; }

        /* Markdown 元素 */
        .msg-content code {
            background: #f3f4f6; padding: 2px 6px; border-radius: 5px;
            font-size: 13px; font-family: "SF Mono", "Fira Code", Consolas, Menlo, monospace;
            color: #be185d;
        }
        .msg-row.user .msg-content code { background: rgba(255,255,255,.6); color: #9d174d; }
        .msg-content pre {
            background: #0f172a; color: #e2e8f0; padding: 16px 18px;
            border-radius: 12px; overflow-x: auto; margin: 12px 0; font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 4px 16px rgba(15,23,42,.25);
            border: 1px solid #1e293b;
        }
        .msg-content pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
        .msg-content p { margin: 0 0 10px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content ul, .msg-content ol { padding-left: 22px; margin: 10px 0; }
        .msg-content li { margin: 5px 0; }
        .msg-content a {
            color: #6366f1; text-decoration: none;
            border-bottom: 1px solid rgba(99,102,241,.25);
            transition: border-color .15s ease;
        }
        .msg-content a:hover { border-bottom-color: #6366f1; }
        .msg-content blockquote {
            border-left: 3px solid #c7d2fe; padding: 6px 14px;
            margin: 10px 0; color: #6b7280; background: #fafbff;
            border-radius: 0 10px 10px 0;
        }
        .msg-content table {
            border-collapse: collapse; margin: 12px 0; font-size: 13.5px;
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 0 1px #e5e7eb;
        }
        .msg-content th, .msg-content td {
            padding: 9px 14px; text-align: left; border-bottom: 1px solid #f3f4f6;
        }
        .msg-content th { background: #f9fafb; font-weight: 600; }
        .msg-content tr:last-child td { border-bottom: none; }
        .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
            margin: 14px 0 8px; font-weight: 650; color: #111827;
            letter-spacing: -0.01em;
        }
        .msg-content h1 { font-size: 20px; }
        .msg-content h2 { font-size: 18px; }
        .msg-content h3 { font-size: 16px; }
        .msg-content h4 { font-size: 15px; }
        .msg-content hr {
            border: none; height: 1px; background: #e5e7eb; margin: 16px 0;
        }

        .msg-error {
            background: #fef2f2; color: #b91c1c; padding: 11px 15px;
            border-radius: 12px; font-size: 14px;
            border: 1px solid #fee2e2;
        }

        .msg-content .msg-image {
            max-width: 100%; border-radius: 12px; margin-top: 10px; display: block;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        .msg-content .msg-file {
            display: inline-flex; align-items: center; gap: 9px;
            padding: 8px 13px; background: #f9fafb; border-radius: 10px;
            font-size: 13px; margin-top: 10px; color: #374151;
            border: 1px solid #e5e7eb;
        }

        /* 加载指示 */
        .msg-loading { display: flex; align-items: center; gap: 5px; padding: 10px 0; }
        .msg-loading .ld {
            width: 7px; height: 7px; border-radius: 50%; background: #9ca3af;
            animation: ld 1.1s ease-in-out infinite;
        }
        .msg-loading .ld:nth-child(1) { animation-delay: 0s; }
        .msg-loading .ld:nth-child(2) { animation-delay: .15s; }
        .msg-loading .ld:nth-child(3) { animation-delay: .3s; }
        @keyframes ld {
            0%, 80%, 100% { transform: scale(0.6); opacity: .4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ------ 输入区 ------ */
        .input-area {
            flex-shrink: 0; padding: 0 32px 28px;
            padding-left: calc(32px + env(safe-area-inset-left, 0px));
            padding-right: calc(32px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(to top, #ffffff 70%, rgba(255,255,255,0));
        }
        @media (max-width: 768px) {

/* ================================================================
 *  工具：HTML 转义
 * ================================================================ */
function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    })[c] || c);
}

/* ================================================================
 *  工具：Markdown 渲染
 * ================================================================ */
function inlineMd(s) {
    let r = escHtml(s);
    r = r.replace(/`([^`]+)`/g, '<code>$1</code>');
    r = r.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    r = r.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    r = r.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return r;
}

function formatMsgContent(text) {
    if (!text) return "";
    const raw = String(text);
    const placeholders = [];
    let src = raw.replace(/```([\s\S]*?)```/g, (_, code) => {
        const idx = placeholders.length;
        const nlIdx = code.indexOf("\n");
        const body = nlIdx >= 0 ? code.slice(nlIdx + 1).replace(/\n$/, "") : "";
        placeholders.push(`<pre><code>${escHtml(body)}</code></pre>`);
        return `\u0000CODE${idx}\u0000`;
    });

    const lines = src.split("\n");
    const html = [];
    let inUl = false, inOl = false;
    let inP = false; let pBuf = "";
    const flushP = () => { if (inP) { html.push(`<p>${inlineMd(pBuf)}</p>`); pBuf = ""; inP = false; } };
    const closeUl = () => { if (inUl) { html.push("</ul>"); inUl = false; } };
    const closeOl = () => { if (inOl) { html.push("</ol>"); inOl = false; } };

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        if (line.trim() === "") { flushP(); closeUl(); closeOl(); continue; }
        if (line.startsWith("\u0000CODE")) {
            flushP(); closeUl(); closeOl();
            const idx = parseInt(line.match(/CODE(\d+)/)[1]);
            html.push(placeholders[idx]);
            continue;
        }
        // 表格
        if (/^\s*\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i+1])) {
            flushP(); closeUl(); closeOl();
            const rows = [];
            while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) { rows.push(lines[i].trim().slice(1,-1).split("|").map(s=>s.trim())); i++; }
            i--;
            const header = rows[0];
            const align = rows.length > 1 ? rows[1].map(c => (c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : c.startsWith(":") ? "left" : "")) : header.map(()=>"");
            const body = rows.slice(2);
            let t = "<table><thead><tr>" + header.map((h,j) => `<th${align[j]?` style="text-align:${align[j]}"`:""}>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
            for (const r of body) t += "<tr>" + r.map((c,j) => `<td${align[j]?` style="text-align:${align[j]}"`:""}>${inlineMd(c)}</td>`).join("") + "</tr>";
            t += "</tbody></table>";
            html.push(t);
            continue;
        }
        // 引用
        if (/^\s*>/.test(line)) {
            flushP(); closeUl(); closeOl();
            const quoted = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) { quoted.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
            i--;
            html.push(`<blockquote>${inlineMd(quoted.join(" "))}</blockquote>`);
            continue;
        }
        // 水平分割
        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
            flushP(); closeUl(); closeOl();
            html.push("<hr>"); continue;
        }
        // 无序列表
        if (/^\s*[-*+]\s+/.test(line)) {
            flushP(); closeOl();
            if (!inUl) { html.push("<ul>"); inUl = true; }
            html.push(`<li>${inlineMd(line.replace(/^\s*[-*+]\s+/, ""))}</li>`);
            continue;
        }
        // 有序列表
        if (/^\s*\d+\.\s+/.test(line)) {
            flushP(); closeUl();
            if (!inOl) { html.push("<ol>"); inOl = true; }
            html.push(`<li>${inlineMd(line.replace(/^\s*\d+\.\s+/, ""))}</li>`);
            continue;
        }
        // 标题
        let m = line.match(/^(#{1,6})\s+(.+)$/);
        if (m) {
            flushP(); closeUl(); closeOl();
            const n = m[1].length;
            html.push(`<h${n}>${inlineMd(m[2])}</h${n}>`);
            continue;
        }
        // 段落
        if (!inP) inP = true;
        if (pBuf) pBuf += " ";
        pBuf += line;
    }
    flushP(); closeUl(); closeOl();
    return html.join("");
}

async function testAccount(id) {
    const acc = accounts.find(a => a.id === id); if (!acc) return;
    settingsMsg.textContent = "正在测试连接..."; settingsMsg.className = "msg-box info";
    try {
        const resp = await fetch("/api/check", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ api_url: acc.api_url, api_key: acc.api_key, model: acc.model })
        });
        const r = await resp.json();
        settingsMsg.textContent = r.message;
        settingsMsg.className = r.ok ? "msg-box ok" : "msg-box err";
        if (r.ok) { acc.latency_ms = r.latency_ms || 50; acc.last_speed_test = new Date().toISOString(); }
        else acc.latency_ms = null;
        saveAccounts(); renderAccountList(); updateModelPicker(); updateModelPill();
    } catch { settingsMsg.textContent = "网络错误，请检查网络连接"; settingsMsg.className = "msg-box err"; }
}
async function deleteAccount(id) {
    if (!confirm("确定要删除这个账号吗？")) return;
    accounts = accounts.filter(a => a.id !== id);
    if (currentAccountId === id) currentAccountId = null;
    saveAccounts(); renderAccountList(); updateModelPicker(); updateModelPill();
    settingsMsg.textContent = "账号已删除"; settingsMsg.className = "msg-box ok";
}

function updateModelPill() {
    if (!accounts.length) {
        curModelName.textContent = "添加账号";
        curModelIcon.textContent = "➕";
        return;
    }
    let acc = currentAccountId ? accounts.find(a => a.id === currentAccountId) : null;
    if (!acc) {
        const valid = accounts.filter(a => a.latency_ms != null);
        acc = valid.length ? valid.reduce((a,b) => a.latency_ms < b.latency_ms ? a : b) : accounts[0];
    }
    if (acc) {
        currentAccountId = acc.id;
        curModelName.textContent = acc.name;
        const valid2 = accounts.filter(a => a.latency_ms != null);
        const isFastest = valid2.length && valid2.reduce((a,b) => a.latency_ms < b.latency_ms ? a : b).id === acc.id;
        curModelIcon.textContent = isFastest ? "⚡" : "✨";
    }
}

        settingsMsg.className = "msg-box ok";

fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    for (const file of files) {
        try {
            const form = new FormData(); form.append("file", file);
            const resp = await fetch("/api/upload", { method: "POST", body: form });
            const r = await resp.json();
            if (r.ok) {
                uploadedFiles.push({ file, type: r.type, filename: r.filename, mime: r.mime, data: r.data });
                addPreviewItem(r);
            } else showToast(r.message || "上传失败");
        } catch { showToast("上传失败"); }
    }
    fileInput.value = "";
};
function addPreviewItem(r) {
    previewBar.classList.add("active");
    const div = document.createElement("div");
    div.className = "preview-item";
    const idx = uploadedFiles.length - 1;
    if (r.type === "image") {
        div.innerHTML = `<img src="data:${r.mime};base64,${r.data}" alt="${escHtml(r.filename)}" />
            <button class="prev-del" data-i="${idx}">×</button>`;
    } else {
        div.innerHTML = `<div class="prev-doc">📄</div>
            <div class="prev-name">${escHtml(r.filename)}</div>
            <button class="prev-del" data-i="${idx}">×</button>`;
    }
    div.querySelector(".prev-del").onclick = () => {
        uploadedFiles.splice(idx, 1); div.remove();
        if (!uploadedFiles.length) previewBar.classList.remove("active");
    };
    previewBar.appendChild(div);
}

function renderConversationList(keyword = "") {
    if (!conversations.length) {
        conversationList.innerHTML = `<div style="padding:28px 14px;text-align:center;color:#9ca3af;font-size:13px;line-height:1.7;">
            暂无对话<br>点击上方「新建对话」开始吧 ✨
        </div>`;
        return;
    }
    const kw = keyword.trim().toLowerCase();
    const list = kw ? conversations.filter(c => (c.title || "").toLowerCase().includes(kw)) : conversations;
    if (!list.length) {
        conversationList.innerHTML = `<div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">未找到匹配对话</div>`;
        return;
    }
    conversationList.innerHTML = list.map(c => {
        const active = c.id === currentConvId;
        let tLabel = "";
        if (c.updated_at || c.created_at) {
            const d = new Date(c.updated_at || c.created_at), n = new Date();
            const sameDay = d.toDateString() === n.toDateString();
            const yesterday = new Date(n); yesterday.setDate(n.getDate() - 1);
            const sameYear = d.getFullYear() === n.getFullYear();
            if (sameDay) tLabel = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
            else if (d.toDateString() === yesterday.toDateString()) tLabel = "昨天";
            else if (sameYear) tLabel = d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" });
            else tLabel = d.toLocaleDateString("zh-CN", { year: "numeric", month: "short", day: "numeric" });
        }
        // 生成最后一条消息预览
        let preview = "";
        const msgs = c.messages || [];
        if (msgs.length) {
            const last = msgs[msgs.length - 1];
            if (last.role === "user") {
                preview = typeof last.content === "string" ? last.content :
                    (last.content.find ? (last.content.find(x => x.type === "text")?.text || "") : "");
                preview = "我: " + preview;
            } else {
                preview = typeof last.content === "string" ? last.content : "";
                preview = "AI: " + preview;
            }
            preview = preview.replace(/[#*`\n\r]/g, " ").trim().slice(0, 40);
        }
        return `<div class="conv-item ${active?'active':''}" data-id="${c.id}">
            <span class="conv-icon">💬</span>
            <div class="conv-main">
                <div class="conv-title-row">
                    <span class="conv-title">${escHtml(c.title || "新对话")}</span>
                    <span class="conv-time">${tLabel}</span>
                </div>
                ${preview ? `<div class="conv-preview">${escHtml(preview)}</div>` : ""}
            </div>
            <span class="conv-del" data-id="${c.id}" title="删除">×</span>
        </div>`;
    }).join("");
    conversationList.querySelectorAll(".conv-item").forEach(el => {
        el.addEventListener("click", (e) => {
            if (e.target.classList.contains("conv-del")) return;
            switchConversation(el.dataset.id);
        });
    });
    conversationList.querySelectorAll(".conv-del").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!confirm("确定删除这个对话？")) return;
            const id = btn.dataset.id;
            conversations = conversations.filter(c => c.id !== id);
            saveConversations();
            if (currentConvId === id) { currentConvId = null; messages = []; clearMessages(); showWelcome(true); headerTitle.textContent = ""; }
            renderConversationList(searchInput.value);
            showToast("对话已删除");
        });
    });
}

searchInput.oninput = (e) => renderConversationList(e.target.value);

convNewBtn.onclick = createNewConversation;

function createNewConversation() {
    if (isStreaming) doStop();
    const now = new Date().toISOString();
    const c = {
        id: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)),
        title: "新对话", messages: [], created_at: now, updated_at: now
    };
    conversations.unshift(c); saveConversations();
    currentConvId = c.id; messages = [];
    clearMessages(); showWelcome(true);
    headerTitle.textContent = "";
    renderConversationList(searchInput.value);
    sidebar.classList.remove("open"); sidebarMask.classList.remove("active");
    showToast("已创建新对话");
    setTimeout(() => messageInput.focus(), 100);
}

function switchConversation(convId) {
    if (isStreaming) doStop();
    const c = conversations.find(x => x.id === convId); if (!c) { showToast("对话不存在"); return; }
    currentConvId = convId; messages = c.messages || [];
    headerTitle.textContent = c.title && c.title !== "新对话" ? c.title : "";
    renderMessages();
    scrollToBottom();
    renderConversationList(searchInput.value);
    sidebar.classList.remove("open"); sidebarMask.classList.remove("active");
}

function saveCurrentConversation(convId, msgs) {
    convId = convId || currentConvId;
    msgs = msgs || messages;
    if (!convId || msgs.length === 0) return;
    const c = conversations.find(x => x.id === convId);
    if (!c) {
        const now = new Date().toISOString();
        const newC = { id: convId, title: "新对话", messages: [], created_at: now, updated_at: now };
        conversations.unshift(newC);
    }
    const cc = conversations.find(x => x.id === convId); if (!cc) return;
    cc.messages = msgs; cc.updated_at = new Date().toISOString();
    for (const m of msgs) {
        if (m.role === "user" && typeof m.content === "string" && m.content.trim()) {
            cc.title = m.content.slice(0, 28);
            if (convId === currentConvId) headerTitle.textContent = cc.title;
            break;
        }
    }
    saveConversations();
    renderConversationList(searchInput.value);
}

/* ================================================================
 *  消息渲染
 * ================================================================ */
function showWelcome(show) {
    if (show) {
        welcomeEl.style.display = "flex";
        messagesContainer.innerHTML = "";
    } else welcomeEl.style.display = "none";
}
function clearMessages() { messagesContainer.innerHTML = ""; }

function renderMessages() {
    clearMessages();
    if (!messages.length) { showWelcome(true); return; }
    showWelcome(false);
    messages.forEach(m => {
        if (m.role === "user") {
            const files = (m._files || []);
            const text = typeof m.content === "string" ? m.content :
                (m.content.find ? m.content.find(x => x.type === "text")?.text || "" : "");
            addUserMessageDOM(text, files, true);
        } else if (m.role === "assistant") {
            const isErr = typeof m.content === "string" && m.content.startsWith("⚠️");
            addAssistantMessageDOM(m.content || "", isErr, true);
        }
    });
}

function addUserMessageDOM(text, files, noScroll) {
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `
        <div class="msg-avatar usr">我</div>
        <div class="msg-body">
            <div class="msg-meta"><span class="msg-author">您</span></div>
            <div class="msg-content">${escHtml(text)}</div>
        </div>`;
    if (files && files.length) {
        const mc = row.querySelector(".msg-content");
        files.forEach(f => {
            if (f.type === "image") {
                const img = document.createElement("img");
                img.className = "msg-image"; img.src = `data:${f.mime};base64,${f.data}`; img.alt = f.filename;
                mc.appendChild(img);
            } else {
                const d = document.createElement("div");
                d.className = "msg-file"; d.textContent = `📄 ${f.filename}`; mc.appendChild(d);
            }
        });
    }
    messagesContainer.appendChild(row);
    if (!noScroll) scrollToBottom();
    return row;
}

function addAssistantMessageDOM(content, isError, noScroll) {
    const row = document.createElement("div");
    row.className = "msg-row";
    row.innerHTML = `
        <div class="msg-avatar ai">AI</div>
        <div class="msg-body">
            <div class="msg-meta">
                <span class="msg-author">AI 助手</span>
                <span class="msg-badge">GPT</span>
            </div>
            <div class="msg-content ${isError ? 'msg-error' : ''}"></div>
        </div>`;
    const mc = row.querySelector(".msg-content");
    if (isError) mc.textContent = content;
    else mc.innerHTML = formatMsgContent(content);
    messagesContainer.appendChild(row);
    if (!noScroll) scrollToBottom();
    return row;
}

function addAssistantLoadingDOM() {
    const row = document.createElement("div");
    row.className = "msg-row";
    row.innerHTML = `
        <div class="msg-avatar ai">AI</div>
        <div class="msg-body">
            <div class="msg-meta">
                <span class="msg-author">AI 助手</span>
                <span class="msg-badge">思考中</span>
            </div>
            <div class="msg-loading"><span class="ld"></span><span class="ld"></span><span class="ld"></span></div>
        </div>`;
    messagesContainer.appendChild(row);
    scrollToBottom();
    return row;
}

function scrollToBottom() {
    requestAnimationFrame(() => { chatWrap.scrollTop = chatWrap.scrollHeight; });
}

/* ================================================================
 *  输入框
 * ================================================================ */
function autoResize() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
}
messageInput.addEventListener("input", autoResize);
messageInput.addEventListener("focus", () => inputBox.classList.add("focused"));
messageInput.addEventListener("blur", () => inputBox.classList.remove("focused"));
messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault(); doSend();
    }
});

function setInputEnabled(enabled) {
    messageInput.disabled = !enabled;
    sendBtn.disabled = !enabled && !isStreaming;
    if (isStreaming) { sendBtn.classList.add("stop"); sendBtn.textContent = "■"; sendBtn.disabled = false; }
    else { sendBtn.classList.remove("stop"); sendBtn.textContent = "➤"; }
}

sendBtn.onclick = () => { if (isStreaming) { doStop(); } else { doSend(); } };

/* ================================================================
 *  停止流式请求
 * ================================================================ */
function doStop() {
    if (currentAbortController) currentAbortController.abort();
}

/* ================================================================
 *  快捷 Prompt 卡片点击
 * ================================================================ */
document.querySelectorAll(".prompt-card").forEach(card => {
    card.addEventListener("click", () => {
        const p = card.dataset.prompt;
        if (p) { messageInput.value = p; autoResize(); messageInput.focus(); }
    });
});

/* ================================================================
 *  发送消息（核心）
 * ================================================================ */
async function doSend() {
    const text = messageInput.value.trim();
    if (!text && uploadedFiles.length === 0) return;
    if (!accounts.length) { showToast("请先添加 API 账号（点击右上角 ⚙️）"); return; }
    if (isStreaming) return;

    if (!currentConvId) {
        const now = new Date().toISOString();
        const c = {
            id: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)),
            title: "新对话", messages: [], created_at: now, updated_at: now
        };
        conversations.unshift(c); saveConversations();
        currentConvId = c.id;
        renderConversationList(searchInput.value);
    }

    const hasFiles = uploadedFiles.length > 0;
    let userMsgContent;
    if (hasFiles) {
        const arr = [];
        if (text) arr.push({ type: "text", text });
        uploadedFiles.forEach(f => {
            if (f.type === "image") arr.push({ type: "image_url", image_url: { url: `data:${f.mime};base64,${f.data}` } });
            else arr.push({ type: "text", text: `[文件: ${f.filename}]\n\n\`\`\`\n${f.data}\n\`\`\`` });
        });
        userMsgContent = arr;
    } else userMsgContent = text;

    const userMsgRecord = { role: "user", content: userMsgContent, _files: hasFiles ? uploadedFiles.slice() : undefined };
    // 捕获发起请求时的对话 ID 和消息数组引用，防止切换对话后串内容
    const sendConvId = currentConvId;
    const sendMessages = messages;
    sendMessages.push(userMsgRecord);
    showWelcome(false);
    const textForUI = typeof userMsgContent === "string" ? userMsgContent :
        (userMsgContent.find ? userMsgContent.find(x => x.type === "text")?.text || "" : "");
    addUserMessageDOM(textForUI, hasFiles ? uploadedFiles.slice() : []);
    // 用户消息发出后立即保存并刷新侧栏（标题、预览、时间）
    saveCurrentConversation(sendConvId, sendMessages);

    messageInput.value = ""; autoResize();
    uploadedFiles = []; previewBar.classList.remove("active"); previewBar.innerHTML = "";

    const loadingRow = addAssistantLoadingDOM();
    isStreaming = true; setInputEnabled(false);
    sendBtn.classList.add("stop"); sendBtn.textContent = "■"; sendBtn.disabled = false;

    const controller = new AbortController(); currentAbortController = controller;
    const tmId = setTimeout(() => controller.abort(), 600 * 1000);

    let selected = currentAccountId ? accounts.find(a => a.id === currentAccountId) : null;
    if (!selected) {
        const valid = accounts.filter(a => a.latency_ms != null);
        selected = valid.length ? valid.reduce((a,b) => a.latency_ms < b.latency_ms ? a : b) : accounts[0];
    }
    if (!selected) { showToast("没有可用账号"); isStreaming = false; setInputEnabled(true); return; }
    currentAccountId = selected.id; updateModelPill();

    const reqBody = {
        api_url: selected.api_url, api_key: selected.api_key, model: selected.model,
        messages: [
            { role: "system", content: "你是一个有帮助的AI助手。" },
            ...sendMessages.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
            { role: "user", content: userMsgContent },
        ],
    };

    let fullContent = "";
    let assistantRow = null;
    let contentEl = null;

    try {
        const resp = await fetch("/chat", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reqBody), signal: controller.signal
        });
        if (!resp.ok) throw new Error(`服务器返回 ${resp.status}`);

        loadingRow.remove();
        assistantRow = document.createElement("div");
        assistantRow.className = "msg-row";
        assistantRow.innerHTML = `
            <div class="msg-avatar ai">AI</div>
            <div class="msg-body">
                <div class="msg-meta">
                    <span class="msg-author">AI 助手</span>
                    <span class="msg-badge">${escHtml(selected.model.slice(0, 12))}</span>
                </div>
                <div class="msg-content"></div>
            </div>`;
        messagesContainer.appendChild(assistantRow);
        contentEl = assistantRow.querySelector(".msg-content");

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let lastSidebarUpdateLen = 0;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
                const t = line.trim(); if (!t) continue;
                if (!t.startsWith("data: ")) continue;
                const dc = t.slice(6);
                if (dc.trim() === "[DONE]") break;
                try {
                    const p = JSON.parse(dc);
                    if (p.error) {
                        const errT = typeof p.error === "string" ? p.error : (p.error.message || JSON.stringify(p.error));
                        fullContent += errT;
                        contentEl.className = "msg-content msg-error";
                        contentEl.textContent = fullContent; scrollToBottom();
                    } else {
                        const d = p.choices?.[0]?.delta?.content || p.choices?.[0]?.text || "";
                        if (d) {
                            fullContent += d;
                            contentEl.innerHTML = formatMsgContent(fullContent);
                            scrollToBottom();
                        }
                    }
                } catch {
                    if (dc.trim()) { fullContent += dc; contentEl.innerHTML = formatMsgContent(fullContent); scrollToBottom(); }
                }
            }
            // 流式过程中节流更新侧栏预览（每新增约 50 字符更新一次，只刷 DOM 不存消息）
            if (fullContent.length - lastSidebarUpdateLen >= 50) {
                lastSidebarUpdateLen = fullContent.length;
                updateConvPreview(sendConvId, "AI: " + fullContent.replace(/[#*`\n\r]/g, " ").trim().slice(0, 40));
            }
        }
        if (buffer.trim() && buffer.trim().startsWith("data: ")) {
            const dc = buffer.trim().slice(6);
            if (dc.trim() !== "[DONE]") {
                try {
                    const p = JSON.parse(dc);
                    if (p.error) {
                        const errT = typeof p.error === "string" ? p.error : (p.error.message || JSON.stringify(p.error));
                        fullContent += errT; contentEl.className = "msg-content msg-error";
                    } else {
                        const d = p.choices?.[0]?.delta?.content || p.choices?.[0]?.text || "";
                        if (d) fullContent += d;
                    }
                } catch { if (dc.trim()) fullContent += dc; }
            }
        }

        if (contentEl) {
            if (!contentEl.classList.contains("msg-error")) contentEl.innerHTML = formatMsgContent(fullContent);
            else contentEl.textContent = fullContent;
        }
        if (fullContent.trim()) sendMessages.push({ role: "assistant", content: fullContent });
        else {
            if (contentEl) { contentEl.textContent = "（未收到有效回复，请检查 API 配置）"; contentEl.className = "msg-content msg-error"; }
            sendMessages.push({ role: "assistant", content: "⚠️ 未收到有效回复，请检查 API 配置" });
        }
        scrollToBottom();
        saveCurrentConversation(sendConvId, sendMessages);
    } catch (err) {
        if (loadingRow && loadingRow.parentNode) loadingRow.remove();
        const errTxt = err.name === "AbortError" ? (fullContent.trim() ? fullContent : "（已停止生成）") : (err.message || "请求失败");
        if (!assistantRow) {
            assistantRow = document.createElement("div");
            assistantRow.className = "msg-row";
            assistantRow.innerHTML = `<div class="msg-avatar ai">AI</div>
                <div class="msg-body">
                    <div class="msg-meta"><span class="msg-author">AI 助手</span><span class="msg-badge">错误</span></div>
                    <div class="msg-content msg-error"></div>
                </div>`;
            messagesContainer.appendChild(assistantRow);
            contentEl = assistantRow.querySelector(".msg-content");
        }
        if (contentEl) {
            if (err.name === "AbortError" && fullContent.trim()) {
                contentEl.className = "msg-content";
                contentEl.innerHTML = formatMsgContent(fullContent);
            } else {
                contentEl.className = "msg-content msg-error";
                contentEl.textContent = "⚠️ " + errTxt;
            }
        }
        if (!(err.name === "AbortError" && !fullContent.trim())) {
            const recorded = err.name === "AbortError" && fullContent.trim() ? fullContent : "⚠️ " + errTxt;
            sendMessages.push({ role: "assistant", content: recorded });
        }
        scrollToBottom();
        if (!(err.name === "AbortError" && !fullContent.trim()) && sendConvId) saveCurrentConversation(sendConvId, sendMessages);
    } finally {
        clearTimeout(tmId);
        isStreaming = false; currentAbortController = null;
        sendBtn.classList.remove("stop"); sendBtn.textContent = "➤";
        setInputEnabled(true);
        messageInput.focus();
    }
}

/* ================================================================
 *  初始化
 * ================================================================ */
function init() {
    loadAccounts();
    loadConversations();
    currentConvId = null; messages = [];
    showWelcome(true); headerTitle.textContent = "";
    autoResize();
    setTimeout(() => messageInput.focus(), 150);
}
init();
</script>
</body>
