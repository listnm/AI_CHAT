<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI 对话</title>
    <style>
        /* ===== 全局重置与基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #e8ecf0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; color: #1c1e21;
        }
        .app-container {
            width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
            background: #fff; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,.08); overflow: hidden; position: relative;
        }
        @media (min-width:520px) { .app-container { border-radius: 24px; height: 90vh; height: 90dvh; } }

        /* ===== 顶部导航栏 ===== */
        .header {
            background: #fff; padding: 16px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #e9edf2; flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
            padding-top: max(16px, env(safe-area-inset-top, 16px));
        }
        .header-title { font-size: 17px; font-weight: 600; color: #1c1e21; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .header-btn {
            background: none; border: none; font-size: 22px; cursor: pointer;
            color: #5f6368; padding: 8px 10px; border-radius: 10px; transition: background .2s; min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .header-btn:hover { background: #f0f2f5; }
        .header-btn:active { background: #e4e6ea; }

        /* ===== 对话气泡区域 ===== */
        .chat-area {
            flex: 1; overflow-y: auto; overflow-y: overlay; padding: 12px 12px 8px; display: flex;
            flex-direction: column; gap: 10px; background: #f5f7fa; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width:520px) { .chat-area { padding: 16px 16px 8px; } }
        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: #c4c9d0; border-radius: 4px; }
        .message {
            max-width: 88%; padding: 10px 14px; border-radius: 18px; font-size: 15px;
            line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; word-break: break-word;
            animation: messageIn .25s ease-out;
        }
        @media (max-width:380px) { .message { max-width: 92%; font-size: 14px; padding: 8px 12px; } }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 6px; }
        .message.assistant { align-self: flex-start; background: #fff; color: #1c1e21; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
        .message.error { align-self: flex-start; background: #fff0f0; color: #d93025; border-bottom-left-radius: 6px; font-size: 14px; }
        .message code { background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "SF Mono","Fira Code",monospace; word-break: break-all; }
        .message.user code { background: rgba(255,255,255,.2); }

        /* ===== 底部输入区 ===== */
        .input-area { padding: 8px 12px max(8px, env(safe-area-inset-bottom, 8px)) 12px; background: #fff; border-top: 1px solid #e9edf2; display: flex; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        @media (min-width:520px) { .input-area { padding: 12px 16px 16px; } }
        .input-wrapper { flex: 1; display: flex; align-items: flex-end; background: #f5f7fa; border-radius: 20px; padding: 4px 4px 4px 14px; border: 1px solid #e9edf2; transition: border-color .2s; }
        .input-wrapper:focus-within { border-color: #007aff; }
        .input-wrapper textarea { flex: 1; border: none; background: transparent; resize: none; padding: 8px 0; font-size: 16px; font-family: inherit; outline: none; line-height: 1.4; max-height: 100px; color: #1c1e21; }
        .input-wrapper textarea::placeholder { color: #8e9399; }
        .send-btn { width: 36px; min-width: 36px; height: 36px; min-height: 36px; border: none; border-radius: 50%; background: #007aff; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s,transform .1s; }
        .send-btn:hover { background: #0062cc; }
        .send-btn:active { transform: scale(.92); }
        .send-btn:disabled { background: #c4c9d0; cursor: not-allowed; transform: none; }

        /* ===== 设置面板遮罩 ===== */
        .settings-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35); z-index: 100; animation: fadeIn .2s ease-out; }
        .settings-overlay.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== 设置面板 ===== */
        .settings-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 20px; padding: 24px; width: calc(100% - 32px); max-width: 420px; max-height: 85vh; max-height: 85dvh; overflow-y: auto; overflow-y: overlay; -webkit-overflow-scrolling: touch; box-shadow: 0 20px 60px rgba(0,0,0,.15); animation: panelIn .25s ease-out; }
        @media (max-width:380px) { .settings-panel { width: calc(100% - 16px); padding: 20px 16px; max-height: 90vh; max-height: 90dvh; border-radius: 16px; } }
        @keyframes panelIn { from { opacity: 0; transform: translate(-50%,-50%) scale(.92); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
        .settings-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1c1e21; }

        /* ===== 账号列表 ===== */
        .account-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .account-card {
            background: #f5f7fa; border-radius: 14px; padding: 14px; border: 1px solid #e9edf2;
            transition: border-color .2s; position: relative;
        }
        .account-card.fastest { border-color: #34c759; background: #f0fff4; }
        .account-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
        .account-name { font-weight: 600; font-size: 14px; color: #1c1e21; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .account-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; flex-shrink: 0;
        }
        .account-badge.fastest { background: #34c759; color: #fff; }
        .account-badge.fail { background: #ff3b30; color: #fff; }
        .account-badge.ok { background: #e8f5e9; color: #1b5e20; }
        .account-meta { font-size: 12px; color: #8e9399; display: flex; flex-wrap: wrap; gap: 4px 8px; }
        .account-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .account-meta span:last-child { min-width: 0; }
        .account-actions { display: flex; gap: 6px; margin-top: 8px; }
        .account-actions button {
            padding: 4px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; transition: background .2s;
        }
        .btn-account-test { background: #e8f2ff; color: #007aff; }
        .btn-account-test:hover { background: #d0e5ff; }
        .btn-account-delete { background: #fff0f0; color: #ff3b30; }
        .btn-account-delete:hover { background: #ffe0e0; }

        /* ===== 添加账号表单 ===== */
        .add-account-form { border-top: 1px solid #e9edf2; padding-top: 16px; margin-bottom: 16px; }
        .add-account-form h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1c1e21; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: #5f6368; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 14px; border: 1px solid #e9edf2; border-radius: 12px; font-size: 14px; background: #f5f7fa; outline: none; color: #1c1e21;
        }
        .form-group input:focus, .form-group select:focus { border-color: #007aff; background: #fff; }
        .form-row { display: flex; gap: 8px; align-items: flex-end; }
        .form-row .form-group { flex: 1; }

        .btn-primary {
            width: 100%; padding: 10px 0; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s;
            background: #007aff; color: #fff;
        }
        .btn-primary:hover { background: #0062cc; }
        .btn-primary:disabled { background: #c4c9d0; cursor: not-allowed; }
        .btn-secondary {
            width: 100%; padding: 10px 0; border: 1px solid #007aff; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s,color .2s;
            background: #fff; color: #007aff; margin-bottom: 8px;
        }
        .btn-secondary:hover { background: #e8f2ff; }
        .btn-secondary:disabled { border-color: #c4c9d0; color: #c4c9d0; cursor: not-allowed; background: #f5f7fa; }
        .btn-secondary.loading { color: transparent; position: relative; }
        .btn-secondary.loading::after {
            content: ""; position: absolute; width: 18px; height: 18px; top: 50%; left: 50%;
            margin: -9px 0 0 -9px; border: 2px solid #007aff; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-close-panel {
            width: 100%; padding: 10px 0; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s;
            background: #f0f2f5; color: #5f6368;
        }
        .btn-close-panel:hover { background: #e4e6ea; }

        .settings-msg { font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none; line-height: 1.4; }
        .settings-msg.success { display: block; background: #e8f5e9; color: #1b5e20; }
        .settings-msg.fail { display: block; background: #fff0f0; color: #c62828; }
        .settings-msg.info { display: block; background: #e8f2ff; color: #004999; }

        /* ===== 空状态 & 加载 ===== */
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e9399; font-size: 15px; gap: 12px; user-select: none; padding: 20px; }
        .empty-state-icon { font-size: 48px; opacity: .5; }
        .empty-state-text { text-align: center; line-height: 1.5; }
        .empty-state-hint { font-size: 13px; opacity: .7; text-align: center; }
        .loading-indicator { align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 12px 16px; background: #fff; border-radius: 18px; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
        .loading-dot { width: 8px; height: 8px; background: #8e9399; border-radius: 50%; animation: dotBounce 1.2s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: .2s; }
        .loading-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }

        /* ===== Toast ===== */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .3s ease; pointer-events: none; max-width: calc(100% - 40px); text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        .toast.show { opacity: 1; }

        /* ===== 文件上传按钮 ===== */
        .file-upload-btn {
            width: 36px; min-width: 36px; height: 36px; min-height: 36px; border: none; border-radius: 50%; background: transparent;
            color: #5f6368; font-size: 18px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; transition: background .2s;
        }
        .file-upload-btn:hover { background: #f0f2f5; }
        .file-upload-btn:active { background: #e4e6ea; }
        .file-input-hidden { display: none; }

        /* ===== 图片预览条 ===== */
        .preview-bar {
            display: none; align-items: center; gap: 8px; padding: 4px 12px 0 12px;
            background: #fff; flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        @media (min-width:520px) { .preview-bar { padding: 4px 16px 0 16px; } }
        .preview-bar.active { display: flex; }
        .preview-item {
            position: relative; width: 48px; height: 48px; border-radius: 8px; overflow: hidden;
            flex-shrink: 0; border: 1px solid #e9edf2;
        }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .preview-remove {
            position: absolute; top: -4px; right: -4px; width: 18px; height: 18px;
            border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none;
            font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .preview-item .preview-name {
            font-size: 10px; color: #fff; background: rgba(0,0,0,.5);
            position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
            padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== 消息中的图片 ===== */
        .message .msg-image { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
        .message .msg-file {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: rgba(0,0,0,.06); border-radius: 8px; font-size: 13px; margin-top: 4px;
        }
        .message.user .msg-file { background: rgba(255,255,255,.15); }

        /* ===== 对话管理面板 ===== */
        .conversation-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35); z-index: 100; animation: fadeIn .2s ease-out; }
        .conversation-overlay.active { display: block; }
        .conversation-panel {
            position: absolute; top: 0; left: 0; bottom: 0; width: 300px; max-width: 85%;
            background: #fff; display: flex; flex-direction: column; animation: slideIn .25s ease-out;
            box-shadow: 2px 0 20px rgba(0,0,0,.1); -webkit-overflow-scrolling: touch;
        }
        @media (max-width:380px) { .conversation-panel { max-width: 88%; } }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .conversation-header {
            padding: max(16px, env(safe-area-inset-top, 16px)) 16px 12px; border-bottom: 1px solid #e9edf2; display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0; gap: 8px;
        }
        .conversation-header h2 { font-size: 17px; font-weight: 600; color: #1c1e21; margin: 0; flex-shrink: 0; }
        .conversation-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .conversation-actions button {
            padding: 6px 12px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer;
            transition: background .2s; min-height: 36px;
        }
        .btn-conv-new { background: #007aff; color: #fff; white-space: nowrap; }
        .btn-conv-new:hover { background: #0062cc; }
        .btn-conv-close { background: #f0f2f5; color: #5f6368; }
        .btn-conv-close:hover { background: #e4e6ea; }
        .conversation-list { flex: 1; overflow-y: auto; overflow-y: overlay; -webkit-overflow-scrolling: touch; padding: 8px; }
        .conversation-item {
            display: flex; align-items: center; padding: 12px 12px; border-radius: 10px;
            cursor: pointer; transition: background .2s; margin-bottom: 2px; gap: 8px; min-height: 44px;
        }
        .conversation-item:hover { background: #f5f7fa; }
        .conversation-item.active { background: #e8f2ff; }
        .conversation-item .conv-title { flex: 1; font-size: 14px; color: #1c1e21; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .conversation-item .conv-time { font-size: 11px; color: #8e9399; white-space: nowrap; }
        .conversation-item .conv-delete {
            width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent;
            color: #8e9399; font-size: 14px; cursor: pointer; display: none; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .conversation-item:hover .conv-delete { display: flex; }
        .conversation-item .conv-delete:hover { background: #fff0f0; color: #ff3b30; }
        .conv-auto-cleanup {
            font-size: 11px; color: #8e9399; padding: 8px 16px; border-top: 1px solid #e9edf2; flex-shrink: 0; text-align: center;
        }

        /* ===== 编辑账号弹窗 ===== */
        .edit-modal { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35); z-index: 110; animation: fadeIn .2s ease-out; }
        .edit-modal.active { display: block; }
        .edit-modal-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: #fff; border-radius: 20px; padding: 24px; width: calc(100% - 32px);
            max-width: 420px; max-height: 85vh; max-height: 85dvh; overflow-y: auto; overflow-y: overlay; -webkit-overflow-scrolling: touch; box-shadow: 0 20px 60px rgba(0,0,0,.15);
            animation: panelIn .25s ease-out;
        }
        @media (max-width:380px) { .edit-modal-content { width: calc(100% - 16px); padding: 20px 16px; } }
        .edit-modal-content h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1c1e21; }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="header">
    <button class="header-btn" id="conversationBtn" title="对话列表" aria-label="对话列表">☰</button>
    <span class="header-title" id="headerTitle">AI 对话</span>
    <div style="display:flex;align-items:center;gap:4px;">
        <button class="header-btn" id="settingsBtn" title="账号管理" aria-label="打开设置">⚙️</button>
    </div>
</div>
    <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-text">开始一段新的对话</div>
            <div class="empty-state-hint">点击左上角 ☰ 新建对话，然后添加 API 账号即可开始</div>
        </div>
    </div>
    <div class="preview-bar" id="previewBar"></div>
    <div class="input-area">
        <button class="file-upload-btn" id="fileUploadBtn" title="上传文件" aria-label="上传文件">📎</button>
        <input type="file" id="fileInput" class="file-input-hidden" multiple />
        <div class="input-wrapper">
            <textarea id="messageInput" rows="1" placeholder="输入消息..." aria-label="输入消息"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="发送">➤</button>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel" id="settingsPanel">
            <h2>账号管理</h2>
            <div id="settingsMsg" class="settings-msg"></div>
            <!-- 账号列表 -->
            <div id="accountList" class="account-list"></div>
            <!-- 批量操作 -->
            <button class="btn-secondary" id="speedTestBtn">🚀 全部测速</button>
            <!-- 添加账号表单 -->
            <div class="add-account-form">
                <h3>添加新账号</h3>
                <div class="form-group">
                    <label for="accName">账号名称（自定义）</label>
                    <input type="text" id="accName" placeholder="如：AIHub、OpenAI、中转1" />
                </div>
                <div class="form-group">
                    <label for="accUrl">API 地址</label>
                    <input type="url" id="accUrl" placeholder="https://aihub.top" />
                </div>
                <div class="form-group">
                    <label for="accKey">API Key</label>
                    <input type="password" id="accKey" placeholder="sk-..." />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="accModel">模型名称</label>
                        <select id="accModel"><option value="">— 先填上面信息再点右侧刷新 —</option></select>
                    </div>
                    <button class="btn-refresh-model" id="accRefreshModels" title="刷新模型列表" style="width:40px;height:40px;border:1px solid #e9edf2;border-radius:12px;background:#f5f7fa;font-size:18px;cursor:pointer;flex-shrink:0;margin-bottom:10px;">↻</button>
                </div>
                <button class="btn-primary" id="addAccountBtn">添加账号</button>
            </div>
            <button class="btn-close-panel" id="settingsCloseBtn">关闭</button>
        </div>
    </div>
</div>
    <!-- 对话管理面板 -->
    <div class="conversation-overlay" id="conversationOverlay">
        <div class="conversation-panel" id="conversationPanel">
            <div class="conversation-header">
                <h2>对话列表</h2>
                <div class="conversation-actions">
                    <button class="btn-conv-new" id="convNewBtn">＋ 新建</button>
                    <button class="btn-conv-close" id="convCloseBtn">关闭</button>
                </div>
            </div>
            <div class="conversation-list" id="conversationList"></div>
            <div class="conv-auto-cleanup">⏰ 超过 24 小时的对话将自动删除</div>
        </div>
    </div>

    <!-- 编辑账号弹窗 -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <h2>编辑账号</h2>
            <div id="editMsg" class="settings-msg"></div>
            <div class="form-group">
                <label for="editName">账号名称</label>
                <input type="text" id="editName" placeholder="如：AIHub、OpenAI" />
            </div>
            <div class="form-group">
                <label for="editUrl">API 地址</label>
                <input type="url" id="editUrl" placeholder="https://aihub.top" />
            </div>
            <div class="form-group">
                <label for="editKey">API Key（留空不修改）</label>
                <input type="password" id="editKey" placeholder="留空则不修改" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="editModel">模型名称</label>
                    <select id="editModel"><option value="">— 先填信息再刷新 —</option></select>
                </div>
                <button class="btn-refresh-model" id="editRefreshModels" title="刷新模型列表" style="width:40px;height:40px;border:1px solid #e9edf2;border-radius:12px;background:#f5f7fa;font-size:18px;cursor:pointer;flex-shrink:0;margin-bottom:10px;">↻</button>
            </div>
            <button class="btn-primary" id="editSaveBtn">保存修改</button>
            <button class="btn-close-panel" id="editCancelBtn" style="margin-top:8px;">取消</button>
        </div>
    </div>
<div class="toast" id="toast"></div>

<script>
// ================================================================
//  DOM 引用
// ================================================================
const chatArea = document.getElementById("chatArea");
const emptyState = document.getElementById("emptyState");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const settingsBtn = document.getElementById("settingsBtn");
const settingsOverlay = document.getElementById("settingsOverlay");
const settingsCloseBtn = document.getElementById("settingsCloseBtn");
const settingsMsg = document.getElementById("settingsMsg");
const accountList = document.getElementById("accountList");
const speedTestBtn = document.getElementById("speedTestBtn");
const addAccountBtn = document.getElementById("addAccountBtn");
const accName = document.getElementById("accName");
const accUrl = document.getElementById("accUrl");
const accKey = document.getElementById("accKey");
const accModel = document.getElementById("accModel");
const accRefreshModels = document.getElementById("accRefreshModels");
const toastEl = document.getElementById("toast");

// 新功能 DOM 引用
const fileUploadBtn = document.getElementById("fileUploadBtn");
const fileInput = document.getElementById("fileInput");
const previewBar = document.getElementById("previewBar");
const conversationBtn = document.getElementById("conversationBtn");
const conversationOverlay = document.getElementById("conversationOverlay");
const conversationList = document.getElementById("conversationList");
const convNewBtn = document.getElementById("convNewBtn");
const convCloseBtn = document.getElementById("convCloseBtn");
const headerTitle = document.getElementById("headerTitle");
const editModal = document.getElementById("editModal");
const editName = document.getElementById("editName");
const editUrl = document.getElementById("editUrl");
const editKey = document.getElementById("editKey");
const editModel = document.getElementById("editModel");
const editRefreshModels = document.getElementById("editRefreshModels");
const editSaveBtn = document.getElementById("editSaveBtn");
const editCancelBtn = document.getElementById("editCancelBtn");
const editMsg = document.getElementById("editMsg");

// ================================================================
//  状态
// ================================================================
let messages = [];
let isStreaming = false;
let currentAbortController = null;
let accounts = [];
let uploadedFiles = []; // {file, type, filename, mime, data}
let conversations = [];
let currentConvId = null;

// ================================================================
//  Toast
// ================================================================
let toastTimer = null;
function showToast(text) {
    toastEl.textContent = text; toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
}

// ================================================================
//  设置面板消息
// ================================================================
function setSettingsMsg(text, type = "info") {
    settingsMsg.textContent = text;
    settingsMsg.className = `settings-msg ${type}`;
}

// ================================================================
//  账号管理（localStorage 存储，每人独立）
// ================================================================

function loadAccounts() {
    accounts = JSON.parse(localStorage.getItem("accounts") || "[]");
    renderAccountList();
    // 更新空状态提示
    const hint = emptyState.querySelector(".empty-state-hint");
    if (hint) {
        if (accounts.length > 0) {
            hint.textContent = "点击左上角 ☰ 新建对话即可开始";
        } else {
            hint.textContent = "点击右上角 ⚙️ 添加 API 账号，然后新建对话";
        }
    }
}

function saveAccounts() {
    localStorage.setItem("accounts", JSON.stringify(accounts));
}

function renderAccountList() {
    if (accounts.length === 0) {
        accountList.innerHTML = '<div style="text-align:center;padding:16px;color:#8e9399;font-size:14px;">暂无账号，请添加一个</div>';
        return;
    }
    // 找到延迟最低的
    const valid = accounts.filter(a => a.latency_ms != null);
    const fastestId = valid.length > 0 ? valid.reduce((a, b) => (a.latency_ms < b.latency_ms ? a : b)).id : null;

    accountList.innerHTML = accounts.map(acc => {
        const isFastest = acc.id === fastestId;
        let badge = "";
        if (isFastest) badge = '<span class="account-badge fastest">最快</span>';
        else if (acc.latency_ms != null) badge = '<span class="account-badge ok">可用</span>';
        else badge = '<span class="account-badge fail">未测速</span>';

        const latency = acc.latency_ms != null ? `${acc.latency_ms}ms` : "—";
        const keyPreview = acc.api_key ? acc.api_key.slice(0, 12) + "..." : "";
        return `<div class="account-card ${isFastest ? 'fastest' : ''}">
            <div class="account-card-header">
                <span class="account-name">${escHtml(acc.name)}</span>
                ${badge}
            </div>
            <div class="account-meta">
                <span>📍 ${escHtml(acc.api_url)}</span>
                <span>🤖 ${escHtml(acc.model)}</span>
                <span>⚡ ${latency}</span>
                <span>🔑 ${escHtml(keyPreview)}</span>
            </div>
            <div class="account-actions">
                <button class="btn-account-test" onclick="testAccount('${acc.id}')">测试</button>
                <button class="btn-account-edit" onclick="editAccount('${acc.id}')" style="padding:4px 12px;border-radius:8px;font-size:12px;border:none;cursor:pointer;background:#f0f2f5;color:#5f6368;transition:background .2s;">编辑</button>
                <button class="btn-account-delete" onclick="deleteAccount('${acc.id}')">删除</button>
            </div>
        </div>`;
    }).join("");
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c] || c); }

async function testAccount(id) {
    const acc = accounts.find(a => a.id === id);
    if (!acc) return;
    setSettingsMsg("正在测试...", "info");
    try {
        const resp = await fetch("/api/check", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ api_url: acc.api_url, api_key: acc.api_key, model: acc.model }),
        });
        const result = await resp.json();
        setSettingsMsg(result.message, result.ok ? "success" : "fail");
        // 更新延迟记录
        if (result.ok) {
            acc.latency_ms = result.latency_ms || 50;
            acc.last_speed_test = new Date().toISOString();
        } else {
            acc.latency_ms = null;
        }
        saveAccounts();
        renderAccountList();
    } catch (e) {
        setSettingsMsg("测试请求失败", "fail");
    }
}

async function deleteAccount(id) {
    if (!confirm("确定要删除这个账号吗？")) return;
    accounts = accounts.filter(a => a.id !== id);
    saveAccounts();
    renderAccountList();
    setSettingsMsg("账号已删除", "success");
}

// ================================================================
//  编辑账号
// ================================================================
let editingAccountId = null;

async function editAccount(id) {
    editingAccountId = id;
    const acc = accounts.find(a => a.id === id);
    if (!acc) return;
    editName.value = acc.name || "";
    editUrl.value = acc.api_url || "";
    editKey.value = "";
    editModel.innerHTML = `<option value="${escHtml(acc.model)}">${escHtml(acc.model)}</option>`;
    editModel.value = acc.model;
    editMsg.className = "settings-msg";
    editModal.classList.add("active");
}

editCancelBtn.addEventListener("click", () => {
    editModal.classList.remove("active");
    editingAccountId = null;
});

editModal.addEventListener("click", (e) => {
    if (e.target === editModal) {
        editModal.classList.remove("active");
        editingAccountId = null;
    }
});

editRefreshModels.addEventListener("click", async () => {
    if (!editingAccountId) return;
    const acc = accounts.find(a => a.id === editingAccountId);
    if (!acc) return;
    const currentModel = editModel.value;
    editRefreshModels.disabled = true;
    editRefreshModels.textContent = "⏳";
    editModel.innerHTML = '<option value="">加载中...</option>';

    try {
        const resp = await fetch("/api/models", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ api_url: acc.api_url, api_key: acc.api_key }),
        });
        const result = await resp.json();
        editModel.innerHTML = "";
        if (result.ok && result.models.length > 0) {
            result.models.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m; opt.textContent = m;
                editModel.appendChild(opt);
            });
            // 尝试恢复当前选中的模型
            if (currentModel && [...editModel.options].some(o => o.value === currentModel)) {
                editModel.value = currentModel;
            }
            editMsg.textContent = `已加载 ${result.models.length} 个模型`;
            editMsg.className = "settings-msg success";
        } else {
            editModel.innerHTML = '<option value="">未获取到模型</option>';
            editMsg.textContent = result.message || "未获取到模型";
            editMsg.className = "settings-msg fail";
        }
    } catch (e) {
        editModel.innerHTML = '<option value="">加载失败</option>';
        editMsg.textContent = "网络错误";
        editMsg.className = "settings-msg fail";
    } finally {
        editRefreshModels.disabled = false;
        editRefreshModels.textContent = "↻";
    }
});

editSaveBtn.addEventListener("click", () => {
    const name = editName.value.trim();
    const url = editUrl.value.trim();
    const key = editKey.value.trim();
    const model = editModel.value;

    if (!name) { editMsg.textContent = "请输入账号名称"; editMsg.className = "settings-msg fail"; return; }
    if (!url) { editMsg.textContent = "请输入 API 地址"; editMsg.className = "settings-msg fail"; return; }
    if (!model) { editMsg.textContent = "请选择模型"; editMsg.className = "settings-msg fail"; return; }

    const acc = accounts.find(a => a.id === editingAccountId);
    if (!acc) { editMsg.textContent = "账号不存在"; editMsg.className = "settings-msg fail"; return; }

    acc.name = name;
    acc.api_url = url;
    acc.model = model;
    if (key) acc.api_key = key;
    acc.latency_ms = null;
    acc.last_speed_test = null;
    saveAccounts();

    editModal.classList.remove("active");
    editingAccountId = null;
    setSettingsMsg("账号已更新", "success");
    loadAccounts();
});

// ================================================================
//  全部测速
// ================================================================
speedTestBtn.addEventListener("click", async () => {
    speedTestBtn.disabled = true;
    speedTestBtn.classList.add("loading");
    speedTestBtn.textContent = "测速中";
    setSettingsMsg("正在测试所有账号...", "info");

    // 逐个测试所有账号
    for (const acc of accounts) {
        try {
            const start = Date.now();
            const resp = await fetch("/api/check", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ api_url: acc.api_url, api_key: acc.api_key, model: acc.model }),
            });
            const result = await resp.json();
            if (result.ok) {
                acc.latency_ms = Date.now() - start;
                acc.last_speed_test = new Date().toISOString();
            } else {
                acc.latency_ms = null;
            }
        } catch (e) {
            acc.latency_ms = null;
        }
    }
    saveAccounts();
    renderAccountList();

    const ok = accounts.filter(a => a.latency_ms != null);
    if (ok.length > 0) {
        const fastest = ok.reduce((a, b) => (a.latency_ms < b.latency_ms ? a : b));
        setSettingsMsg(`测速完成！最快的是「${fastest.name}」(${fastest.latency_ms}ms)`, "success");
    } else {
        setSettingsMsg("所有账号均不可用，请检查", "fail");
    }

    speedTestBtn.disabled = false;
    speedTestBtn.classList.remove("loading");
    speedTestBtn.textContent = "🚀 全部测速";
});

// ================================================================
//  文件上传
// ================================================================
fileUploadBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    for (const file of files) {
        try {
            const formData = new FormData();
            formData.append("file", file);
            const resp = await fetch("/api/upload", { method: "POST", body: formData });
            const result = await resp.json();
            if (result.ok) {
                uploadedFiles.push({
                    file: file,
                    type: result.type,
                    filename: result.filename,
                    mime: result.mime,
                    data: result.data,
                });
                addPreviewItem(result);
            } else {
                showToast(result.message || "上传失败");
            }
        } catch (err) {
            showToast("上传失败: " + (err.message || "网络错误"));
        }
    }
    fileInput.value = "";
});

function addPreviewItem(result) {
    previewBar.classList.add("active");
    const div = document.createElement("div");
    div.className = "preview-item";
    const idx = uploadedFiles.length - 1;
    if (result.type === "image") {
        div.innerHTML = `<img src="data:${result.mime};base64,${result.data}" alt="${escHtml(result.filename)}" />
            <button class="preview-remove" data-idx="${idx}">✕</button>`;
    } else {
        div.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-size:20px;">📄</div>
            <div class="preview-name">${escHtml(result.filename)}</div>
            <button class="preview-remove" data-idx="${idx}">✕</button>`;
    }
    div.querySelector(".preview-remove").addEventListener("click", () => {
        uploadedFiles.splice(idx, 1);
        div.remove();
        if (uploadedFiles.length === 0) previewBar.classList.remove("active");
    });
    previewBar.appendChild(div);
}

// ================================================================
//  对话管理（localStorage 存储，每人独立）
// ================================================================

function loadConversations() {
    conversations = JSON.parse(localStorage.getItem("conversations") || "[]");
    // 清理超过24小时的对话
    const now = Date.now();
    const before = conversations.length;
    conversations = conversations.filter(c => now - new Date(c.updated_at).getTime() < 24 * 60 * 60 * 1000);
    if (conversations.length !== before) {
        saveConversations();
    }
    renderConversationList();
}

function saveConversations() {
    localStorage.setItem("conversations", JSON.stringify(conversations));
}

function renderConversationList() {
    if (conversations.length === 0) {
        conversationList.innerHTML = '<div style="text-align:center;padding:20px;color:#8e9399;font-size:14px;">暂无对话，点击「新建」开始</div>';
        return;
    }
    conversationList.innerHTML = conversations.map(c => {
        const isActive = c.id === currentConvId;
        let timeLabel = "";
        if (c.updated_at) {
            const d = new Date(c.updated_at);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            timeLabel = isToday ? d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" });
        }
        return `<div class="conversation-item ${isActive ? 'active' : ''}" data-id="${c.id}">
            <span class="conv-title">${escHtml(c.title || "新对话")}</span>
            <span class="conv-time">${timeLabel}</span>
            <button class="conv-delete" data-id="${c.id}" title="删除">✕</button>
        </div>`;
    }).join("");

    // 点击切换对话
    conversationList.querySelectorAll(".conversation-item").forEach(el => {
        el.addEventListener("click", (e) => {
            if (e.target.closest(".conv-delete")) return;
            switchConversation(el.dataset.id);
        });
    });

    // 删除对话
    conversationList.querySelectorAll(".conv-delete").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!confirm("确定要删除这个对话吗？")) return;
            const id = btn.dataset.id;
            conversations = conversations.filter(c => c.id !== id);
            saveConversations();
            if (currentConvId === id) {
                currentConvId = null;
                messages = [];
                chatArea.innerHTML = "";
                chatArea.appendChild(emptyState);
                headerTitle.textContent = "AI 对话";
            }
            renderConversationList();
            showToast("对话已删除");
        });
    });
}

function createNewConversation() {
    const now = new Date().toISOString();
    const conv = {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
        title: "新对话",
        messages: [],
        created_at: now,
        updated_at: now,
    };
    conversations.unshift(conv);
    saveConversations();
    currentConvId = conv.id;
    messages = [];
    chatArea.innerHTML = "";
    chatArea.appendChild(emptyState);
    headerTitle.textContent = "新对话";
    renderConversationList();
    conversationOverlay.classList.remove("active");
    showToast("已创建新对话");
}

function switchConversation(convId) {
    const conv = conversations.find(c => c.id === convId);
    if (!conv) { showToast("对话不存在"); return; }
    currentConvId = convId;
    messages = conv.messages || [];
    headerTitle.textContent = conv.title || "AI 对话";
    // 重新渲染对话区域
    chatArea.innerHTML = "";
    if (messages.length === 0) {
        chatArea.appendChild(emptyState);
    } else {
        messages.forEach(m => {
            if (m.role === "user") {
                const bubble = document.createElement("div");
                bubble.className = "message user";
                bubble.textContent = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
                chatArea.appendChild(bubble);
            } else if (m.role === "assistant") {
                const bubble = document.createElement("div");
                bubble.className = m.content && m.content.startsWith("⚠️") ? "message error" : "message assistant";
                bubble.textContent = m.content || "";
                chatArea.appendChild(bubble);
            }
        });
    }
    scrollToBottom();
    renderConversationList();
    conversationOverlay.classList.remove("active");
}

function saveCurrentConversation() {
    if (!currentConvId) return;
    if (messages.length === 0) return;
    const conv = conversations.find(c => c.id === currentConvId);
    if (!conv) return;
    conv.messages = messages;
    conv.updated_at = new Date().toISOString();
    // 更新标题
    for (const m of messages) {
        if (m.role === "user" && typeof m.content === "string") {
            conv.title = m.content.slice(0, 30);
            break;
        }
    }
    saveConversations();
}

// 打开/关闭对话面板
conversationBtn.addEventListener("click", () => {
    conversationOverlay.classList.add("active");
    loadConversations();
});
convCloseBtn.addEventListener("click", () => conversationOverlay.classList.remove("active"));
conversationOverlay.addEventListener("click", (e) => {
    if (e.target === conversationOverlay) conversationOverlay.classList.remove("active");
});
convNewBtn.addEventListener("click", createNewConversation);

// 初始化：只加载对话列表，不自动创建/加载对话
function initConversation() {
    currentConvId = null;
    messages = [];
    headerTitle.textContent = "AI 对话";
    chatArea.innerHTML = "";
    chatArea.appendChild(emptyState);
    loadConversations();
}

// ================================================================
//  添加账号
// ================================================================
addAccountBtn.addEventListener("click", () => {
    const name = accName.value.trim();
    const url = accUrl.value.trim();
    const key = accKey.value.trim();
    const model = accModel.value;

    if (!name) { setSettingsMsg("请输入账号名称", "fail"); return; }
    if (!url) { setSettingsMsg("请输入 API 地址", "fail"); return; }
    if (!key) { setSettingsMsg("请输入 API Key", "fail"); return; }
    if (!model) { setSettingsMsg("请选择模型名称", "fail"); return; }

    accounts.push({
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
        name,
        api_url: url,
        api_key: key,
        model,
        latency_ms: null,
        last_speed_test: null,
    });
    saveAccounts();
    // 清空表单
    accName.value = ""; accUrl.value = ""; accKey.value = "";
    accModel.innerHTML = '<option value="">— 刷新加载模型 —</option>';
    loadAccounts();
    setSettingsMsg(`账号「${name}」添加成功`, "success");
});

// ================================================================
//  刷新模型列表（添加表单中）
// ================================================================
accRefreshModels.addEventListener("click", async () => {
    const url = accUrl.value.trim();
    const key = accKey.value.trim();
    if (!url || !key) { setSettingsMsg("请先填写 API 地址和 Key", "fail"); return; }

    accRefreshModels.disabled = true;
    accRefreshModels.textContent = "⏳";
    accModel.innerHTML = '<option value="">加载中...</option>';

    try {
        const resp = await fetch("/api/models", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ api_url: url, api_key: key }),
        });
        const result = await resp.json();
        accModel.innerHTML = "";
        if (result.ok && result.models.length > 0) {
            result.models.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m; opt.textContent = m;
                accModel.appendChild(opt);
            });
            setSettingsMsg(`已加载 ${result.models.length} 个模型`, "success");
        } else {
            accModel.innerHTML = '<option value="">未获取到模型</option>';
            setSettingsMsg(result.message || "未获取到模型", "fail");
        }
    } catch (e) {
        accModel.innerHTML = '<option value="">加载失败</option>';
        setSettingsMsg("网络错误", "fail");
    } finally {
        accRefreshModels.disabled = false;
        accRefreshModels.textContent = "↻";
    }
});

// ================================================================
//  Chat 发送（使用最快账号，支持文件上传）
// ================================================================
async function sendMessage(userContent) {
    // 检查是否有可用账号
    if (accounts.length === 0) {
        showToast("请先点击右上角 ⚙️ 添加 API 账号");
        return;
    }

    // 如果没有当前对话，先自动创建一个
    if (!currentConvId) {
        try {
            const resp = await fetch("/api/conversations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: "新对话" }),
            });
            const result = await resp.json();
            if (!result.ok) {
                showToast("创建对话失败，请重试");
                return;
            }
            currentConvId = result.conversation.id;
            messages = [];
            headerTitle.textContent = "新对话";
            chatArea.innerHTML = "";
            await loadConversations();
        } catch (e) {
            showToast("创建对话失败，请重试");
            return;
        }
    }

    // 构建消息内容（支持多模态）
    const hasFiles = uploadedFiles.length > 0;
    let userMsgContent;
    if (hasFiles) {
        // 多模态消息：content 为数组
        const contentArray = [];
        if (userContent) contentArray.push({ type: "text", text: userContent });
        uploadedFiles.forEach(f => {
            if (f.type === "image") {
                contentArray.push({ type: "image_url", image_url: { url: `data:${f.mime};base64,${f.data}` } });
            } else {
                contentArray.push({ type: "text", text: `[文件: ${f.filename}]\n\`\`\`\n${f.data}\n\`\`\`` });
            }
        });
        userMsgContent = contentArray;
    } else {
        userMsgContent = userContent;
    }

    // 显示用户消息（带文件预览）
    addUserMessage(userContent, hasFiles ? uploadedFiles.slice() : []);

    // 如果有文件附件，在消息气泡中显示文件信息
    if (hasFiles) {
        const lastBubble = chatArea.querySelector(".message.user:last-child");
        if (lastBubble) {
            uploadedFiles.forEach(f => {
                if (f.type === "image") {
                    const img = document.createElement("img");
                    img.className = "msg-image";
                    img.src = `data:${f.mime};base64,${f.data}`;
                    img.alt = f.filename;
                    lastBubble.appendChild(img);
                } else {
                    const fileDiv = document.createElement("div");
                    fileDiv.className = "msg-file";
                    fileDiv.textContent = `📄 ${f.filename}`;
                    lastBubble.appendChild(fileDiv);
                }
            });
        }
    }

    const assistantBubble = addAssistantBubble();
    let fullContent = "";
    showLoading();
    setInputEnabled(false);
    isStreaming = true;

    const controller = new AbortController();
    currentAbortController = controller;
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    try {
        // 选择最快或第一个可用账号
        const valid = accounts.filter(a => a.latency_ms != null);
        let selected = accounts[0];
        if (valid.length > 0) {
            selected = valid.reduce((a, b) => (a.latency_ms < b.latency_ms ? a : b));
        }
        const requestBody = {
            api_url: selected.api_url,
            api_key: selected.api_key,
            model: selected.model,
            messages: [
                { role: "system", content: "你是一个有帮助的AI助手。" },
                ...messages.slice(0, -1),
                { role: "user", content: userMsgContent },
            ],
        };

        // 发送后清除文件预览
        uploadedFiles = [];
        previewBar.classList.remove("active");
        previewBar.innerHTML = "";

        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody),
            signal: controller.signal,
        });

        if (!response.ok) throw new Error(`服务器返回状态码 ${response.status}`);

        hideLoading();
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                if (trimmed.startsWith("data: ")) {
                    const dataContent = trimmed.slice(6);
                    if (dataContent.trim() === "[DONE]") break;
                    try {
                        const parsed = JSON.parse(dataContent);
                        if (parsed.error) {
                            const errText = typeof parsed.error === "string" ? parsed.error : (parsed.error.message || JSON.stringify(parsed.error));
                            fullContent += errText;
                            assistantBubble.textContent = fullContent;
                            assistantBubble.className = "message error";
                            scrollToBottom();
                        } else {
                            const delta = parsed.choices?.[0]?.delta?.content || parsed.choices?.[0]?.text || "";
                            if (delta) { fullContent += delta; assistantBubble.textContent = fullContent; scrollToBottom(); }
                        }
                    } catch (e) {
                        if (dataContent.trim()) { fullContent += dataContent; assistantBubble.textContent = fullContent; scrollToBottom(); }
                    }
                }
            }
        }

        // buffer 剩余
        if (buffer.trim() && buffer.trim().startsWith("data: ")) {
            const dc = buffer.trim().slice(6);
            if (dc.trim() !== "[DONE]") {
                try {
                    const parsed = JSON.parse(dc);
                    if (parsed.error) {
                        fullContent += typeof parsed.error === "string" ? parsed.error : (parsed.error.message || JSON.stringify(parsed.error));
                        assistantBubble.className = "message error";
                    } else {
                        const delta = parsed.choices?.[0]?.delta?.content || parsed.choices?.[0]?.text || "";
                        if (delta) fullContent += delta;
                    }
                } catch (e) { if (dc.trim()) fullContent += dc; }
            }
        }

        assistantBubble.textContent = fullContent;
        if (fullContent.trim()) {
            messages.push({ role: "assistant", content: fullContent });
        } else {
            assistantBubble.textContent = "（未收到有效回复，请检查 API 设置）";
            assistantBubble.className = "message error";
            messages.push({ role: "assistant", content: "（未收到有效回复，请检查 API 设置）" });
        }
        scrollToBottom();

        // 保存对话到服务器
        if (currentConvId) {
            // 更新标题
            for (const m of messages) {
                if (m.role === "user" && typeof m.content === "string") {
                    headerTitle.textContent = m.content.slice(0, 30);
                    break;
                }
            }
            await saveCurrentConversation();
        }
    } catch (err) {
        hideLoading();
        if (assistantBubble.parentNode) assistantBubble.parentNode.removeChild(assistantBubble);
        let errorMsg = err.name === "AbortError" ? "请求超时，请检查网络" : (err.message || "请求失败");
        showToast(errorMsg);
        if (emptyState.parentNode) emptyState.remove();
        const eb = document.createElement("div");
        eb.className = "message error";
        eb.textContent = "⚠️ " + errorMsg;
        chatArea.appendChild(eb);
        scrollToBottom();
        messages.push({ role: "assistant", content: "⚠️ " + errorMsg });
    } finally {
        clearTimeout(timeoutId);
        isStreaming = false;
        currentAbortController = null;
        setInputEnabled(true);
        messageInput.focus();
    }
}

// ================================================================
//  辅助函数
// ================================================================
function setInputEnabled(enabled) {
    messageInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    sendBtn.textContent = enabled ? "➤" : "⋯";
}

function autoResizeTextarea() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
}

function addUserMessage(content, files) {
    // 对于多模态消息，content 可能是数组，取文本部分
    const textContent = typeof content === "string" ? content : (content.find(c => c.type === "text")?.text || "");
    messages.push({ role: "user", content: typeof content === "string" ? content : content });
    if (emptyState.parentNode) emptyState.remove();
    const bubble = document.createElement("div");
    bubble.className = "message user";
    bubble.textContent = textContent;
    if (files && files.length > 0) {
        files.forEach(f => {
            if (f.type === "image") {
                const img = document.createElement("img");
                img.className = "msg-image";
                img.src = `data:${f.mime};base64,${f.data}`;
                img.alt = f.filename;
                bubble.appendChild(img);
            } else {
                const fileDiv = document.createElement("div");
                fileDiv.className = "msg-file";
                fileDiv.textContent = `📄 ${f.filename}`;
                bubble.appendChild(fileDiv);
            }
        });
    }
    chatArea.appendChild(bubble);
    scrollToBottom();
}

function addAssistantBubble() {
    if (emptyState.parentNode) emptyState.remove();
    const div = document.createElement("div");
    div.className = "message assistant";
    div.textContent = "";
    chatArea.appendChild(div);
    scrollToBottom();
    return div;
}

let loadingIndicator = null;
function showLoading() {
    if (loadingIndicator) return;
    if (emptyState.parentNode) emptyState.remove();
    loadingIndicator = document.createElement("div");
    loadingIndicator.className = "loading-indicator";
    loadingIndicator.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
    chatArea.appendChild(loadingIndicator);
    scrollToBottom();
}
function hideLoading() {
    if (loadingIndicator && loadingIndicator.parentNode) loadingIndicator.parentNode.removeChild(loadingIndicator);
    loadingIndicator = null;
}

function scrollToBottom() { requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; }); }

// ================================================================
//  事件绑定
// ================================================================
sendBtn.addEventListener("click", () => {
    const text = messageInput.value.trim();
    if (!text || isStreaming) return;
    messageInput.value = "";
    messageInput.style.height = "auto";
    sendMessage(text);
});

messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
messageInput.addEventListener("input", autoResizeTextarea);

// 设置面板
settingsBtn.addEventListener("click", () => {
    settingsOverlay.classList.add("active");
    settingsMsg.className = "settings-msg";
    loadAccounts();
});
settingsCloseBtn.addEventListener("click", () => settingsOverlay.classList.remove("active"));
settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove("active"); });

// ================================================================
//  初始化
// ================================================================
loadAccounts();
initConversation();
messageInput.focus();
console.log("AI 对话应用已启动！");
</script>
</body>
</html>
