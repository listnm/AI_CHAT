<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 中转站管理池</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo"><span class="icon icon-bolt">✦</span></div>
    <h1>中转站管理池</h1>
    <div class="sub">登录以访问管理后台与游乐场</div>
    <form method="post" action="/login">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="输入管理密码" autofocus required>
      <button class="btn primary" type="submit">登 录</button>
    </form>
  </div>
</div>
</body>
</html>
