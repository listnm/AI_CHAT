<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground - 中转站管理池</title>
<style>
:root {
  --pg-bg: #f8fafc;
  --pg-surface: #ffffff;
  --pg-surface2: #f1f5f9;
  --pg-border: #e2e8f0;
  --pg-text: #0f172a;
  --pg-text2: #475569;
  --pg-text3: #94a3b8;
  --pg-primary: #3b82f6;
  --pg-primary-hover: #2563eb;
  --pg-danger: #ef4444;
  --pg-radius: 12px;
  --pg-shadow: 0 10px 30px rgba(15,23,42,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--pg-bg); color: var(--pg-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  font-size: 14px; line-height: 1.6;
}
::selection { background: rgba(59,130,246,.2); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

.pg-app { display: flex; flex-direction: column; height: 100vh; }

/* 顶栏 */
.pg-header {
  display: flex; align-items: center; justify-content: center;
  padding: 12px 20px; border-bottom: 1px solid var(--pg-border);
  background: var(--pg-surface); flex-shrink: 0;
}
.pg-brand { display: flex; align-items: center; gap: 10px; }
.pg-brand .logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff; font-weight: 700;
}
.pg-brand h1 { font-size: 15px; font-weight: 700; color: var(--pg-text); }

/* 对话区 */
.pg-chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.pg-chat-inner {
  width: 100%; max-width: 760px; margin: 0 auto;
  padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;
}

/* 空状态 */
.pg-empty { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 300px; }
.pg-empty-card { text-align: center; max-width: 440px; padding: 32px 24px; }
.pg-empty-icon {
  width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px;
  background: var(--pg-surface2); display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--pg-text2);
}
.pg-empty-card h2 { font-size: 17px; font-weight: 600; color: var(--pg-text); margin-bottom: 4px; }
.pg-empty-card p { font-size: 13px; color: var(--pg-text3); margin-bottom: 20px; }
.pg-prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pg-prompt-btn {
  padding: 10px 14px; border-radius: 10px; border: 1px solid var(--pg-border);
  background: var(--pg-surface); color: var(--pg-text2); font-size: 12.5px;
  cursor: pointer; transition: all .15s; text-align: left; line-height: 1.5;
}
.pg-prompt-btn:hover { border-color: var(--pg-primary); color: var(--pg-text); background: rgba(59,130,246,.04); }

/* 消息 */
.pg-msg { display: flex; gap: 10px; max-width: 100%; animation: fadeIn .2s ease; }
.pg-msg.user { flex-direction: row-reverse; }
.pg-msg-avatar {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px;
}
.pg-msg.user .pg-msg-avatar { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
.pg-msg.asst .pg-msg-avatar { background: var(--pg-surface2); color: var(--pg-text2); }
.pg-msg-content { min-width: 0; max-width: 85%; }
.pg-msg-bubble {
  padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.7;
  overflow-wrap: break-word; word-break: break-word;
}
.pg-msg.user .pg-msg-bubble {
  background: var(--pg-primary); color: #fff; border-top-right-radius: 4px;
}
.pg-msg.asst .pg-msg-bubble {
  background: var(--pg-surface); border: 1px solid var(--pg-border);
  border-top-left-radius: 4px; color: var(--pg-text);
}
.pg-msg-actions {
  display: flex; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity .15s;
}
.pg-msg:hover .pg-msg-actions { opacity: 1; }
.pg-msg-action {
  padding: 3px 8px; border-radius: 6px; border: none; background: none;
  color: var(--pg-text3); font-size: 11.5px; cursor: pointer; transition: all .12s;
}
.pg-msg-action:hover { background: var(--pg-surface2); color: var(--pg-text); }
.pg-msg-error { color: var(--pg-danger); font-size: 13px; padding: 8px 12px;
  background: rgba(239,68,68,.06); border-radius: 8px; border: 1px solid rgba(239,68,68,.15); }
.pg-cursor { display: inline-block; width: 7px; height: 15px; background: var(--pg-primary);
  border-radius: 2px; margin-left: 2px; vertical-align: -2px; animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

/* Markdown */
.md p { margin: 3px 0; }
.md h2,.md h3,.md h4 { margin: 8px 0 4px; color: var(--pg-text); font-weight: 600; }
.md h2 { font-size: 15px; } .md h3 { font-size: 14px; }
.md pre { background: var(--pg-surface2); border: 1px solid var(--pg-border); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 6px 0; font-size: 12.5px; }
.md pre code { font-family: "JetBrains Mono", Consolas, monospace; color: #334155; background: none; }
.md code { background: var(--pg-surface2); color: #2563eb; border-radius: 4px;
  padding: 1px 5px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; }
.md ul { margin: 4px 0 4px 18px; } .md li { margin: 2px 0; }
.md blockquote { border-left: 3px solid var(--pg-primary); background: rgba(59,130,246,.04);
  padding: 6px 12px; border-radius: 0 8px 8px 0; margin: 6px 0; color: var(--pg-text2); }
.md a { color: var(--pg-primary); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md-gap { height: 6px; }

/* 输入区 */
.pg-input-wrap { flex-shrink: 0; padding: 0 20px 20px; }
.pg-input-box {
  max-width: 760px; margin: 0 auto; border-radius: var(--pg-radius);
  border: 1px solid var(--pg-border); background: var(--pg-surface);
  box-shadow: var(--pg-shadow); overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.pg-input-box:focus-within {
  border-color: rgba(59,130,246,.35);
  box-shadow: 0 0 0 3px rgba(59,130,246,.08);
}
.pg-textarea {
  width: 100%; min-height: 44px; max-height: 180px; padding: 12px 16px 8px;
  border: none; background: none; color: var(--pg-text); font-size: 14px;
  font-family: inherit; line-height: 1.6; resize: none; outline: none;
}
.pg-textarea::placeholder { color: var(--pg-text3); }
.pg-input-footer {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 6px 10px; border-top: 1px solid var(--pg-border);
}
.pg-send-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 16px; border-radius: 8px; border: none;
  background: var(--pg-primary); color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.pg-send-btn:hover { background: var(--pg-primary-hover); }
.pg-send-btn:disabled { opacity: .45; cursor: not-allowed; }
.pg-send-btn.stop { background: var(--pg-danger); }
.pg-send-btn.stop:hover { background: #dc2626; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
  background: var(--pg-surface); border: 1px solid var(--pg-border); color: var(--pg-text);
  padding: 10px 18px; border-radius: 10px; font-size: 13px;
  box-shadow: 0 8px 24px rgba(15,23,42,.1); opacity: 0; pointer-events: none;
  transition: all .2s ease; z-index: 99; max-width: 80vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: rgba(59,130,246,.4); }
#toast.err { border-color: rgba(239,68,68,.4); }

/* 手机端 */
@media (max-width: 768px) {
  .pg-header { padding: 10px 14px; }
  .pg-brand .logo { width: 28px; height: 28px; font-size: 14px; }
  .pg-brand h1 { font-size: 14px; }
  .pg-chat-inner { padding: 16px 12px; gap: 16px; }
  .pg-msg-content { max-width: 88%; }
  .pg-input-wrap { padding: 0 10px 12px; }
  .pg-prompts { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .pg-header { padding: 8px 10px; }
  .pg-brand .logo { width: 24px; height: 24px; font-size: 12px; border-radius: 6px; }
  .pg-brand h1 { font-size: 13px; }
  .pg-chat-inner { padding: 12px 8px; }
  .pg-input-wrap { padding: 0 6px 8px; }
  .pg-textarea { padding: 10px 12px 6px; font-size: 13px; min-height: 38px; }
  .pg-msg-avatar { width: 24px; height: 24px; font-size: 10px; border-radius: 6px; }
  .pg-msg-bubble { padding: 8px 10px; font-size: 13px; }
  .pg-send-btn { padding: 5px 12px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="pg-app">
  <div class="pg-header">
    <div class="pg-brand">
      <div class="logo">✦</div>
      <h1>Playground</h1>
    </div>
  </div>

  <div class="pg-chat" id="pg-chat">
    <div class="pg-empty" id="pg-empty">
      <div class="pg-empty-card">
        <div class="pg-empty-icon">💬</div>
        <h2>开始对话</h2>
        <p>直接输入消息，自动使用后台配置的模型</p>
        <div class="pg-prompts">
          <button class="pg-prompt-btn" onclick="pgSend('帮我分析一段数据并给出可视化建议')">📊 分析数据</button>
          <button class="pg-prompt-btn" onclick="pgSend('请帮我总结以下内容的核心要点：')">📝 总结文本</button>
          <button class="pg-prompt-btn" onclick="pgSend('用 Python 写一个快速排序算法')">💻 写代码</button>
          <button class="pg-prompt-btn" onclick="pgSend('给我一些关于人工智能发展趋势的建议')">💡 获取建议</button>
        </div>
      </div>
    </div>
    <div class="pg-chat-inner" id="pg-messages" style="display:none"></div>
  </div>

  <div class="pg-input-wrap">
    <div class="pg-input-box">
      <textarea class="pg-textarea" id="pg-input" placeholder="输入消息…" rows="1"></textarea>
      <div class="pg-input-footer">
        <button class="pg-send-btn" id="pg-send" onclick="pgSend()">发送</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let pgHistory = [];
let pgBusy = false;
let pgStreamEl = null;
let pgAbortCtrl = null;

function esc(s) {
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'show' + (ok ? ' ok' : ' err');
  setTimeout(()=>{ t.className = ''; }, 2800);
}

function pgSend(text) {
  if (pgBusy) { pgAbort(); return; }
  const input = $('pg-input');
  const msg = (text || input.value).trim();
  if (!msg) return;
  if (!text) input.value = '';
  autoResize();
  pgGo(msg);
}

function pgGo(msg) {
  pgHistory.push({role:'user', content:msg});
  $('pg-empty').style.display = 'none';
  $('pg-messages').style.display = '';
  appendMsg('user', msg);
  pgStreamEl = appendMsg('assistant', '');
  pgBusy = true;
  setSendBtn(true);

  pgStream(pgHistory.slice()).catch(()=>{});
}

async function pgStream(msgs) {
  let ctrl = null;
  try {
    ctrl = new AbortController();
    pgAbortCtrl = ctrl;
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({station_id:'', model:'', messages:msgs}),
      signal: ctrl.signal,
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', errMsg = null, done = false;
    while (!done) {
      const {done:d, value} = await reader.read();
      if (d) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx+1);
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') { done = true; break; }
        let evt;
        try { evt = JSON.parse(payload); } catch(e) { continue; }
        if (evt.error) { errMsg = evt.error.message || '未知错误'; done = true; break; }
        const delta = evt.choices && evt.choices[0] && evt.choices[0].delta && evt.choices[0].delta.content;
        if (delta) { full += delta; renderStream(full, false); }
      }
    }
    if (errMsg) {
      pgStreamEl.innerHTML = `<div class="pg-msg-error">⚠ ${esc(errMsg)}</div>`;
    } else {
      pgHistory.push({role:'assistant', content:full});
      renderStream(full, true);
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      pgStreamEl.innerHTML = '<div class="pg-msg-error">⚠ 请求失败，请检查后台中转站配置</div>';
    }
  }
  pgBusy = false; setSendBtn(false); pgStreamEl = null;
  pgAbortCtrl = null; scrollChat();
}

function pgAbort() { if (pgAbortCtrl) pgAbortCtrl.abort(); }
function setSendBtn(busy) {
  const btn = $('pg-send');
  btn.textContent = busy ? '停止' : '发送';
  btn.className = busy ? 'pg-send-btn stop' : 'pg-send-btn';
}
function appendMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'pg-msg ' + role;
  if (role === 'user') {
    div.innerHTML = `<div class="pg-msg-avatar">我</div><div class="pg-msg-content"><div class="pg-msg-bubble">${esc(content)}</div></div>`;
  } else {
    div.innerHTML = `<div class="pg-msg-avatar">AI</div><div class="pg-msg-content"><div class="pg-msg-bubble md"></div>
      <div class="pg-msg-actions">
        <button class="pg-msg-action" onclick="pgCopyMsg(this)">复制</button>
        <button class="pg-msg-action" onclick="pgRedo()">重新生成</button>
      </div></div>`;
    if (content) div.querySelector('.pg-msg-bubble').innerHTML = md(content);
  }
  $('pg-messages').appendChild(div);
  scrollChat();
  return role === 'assistant' ? div.querySelector('.pg-msg-bubble') : null;
}
function renderStream(text, done) {
  if (!pgStreamEl) return;
  pgStreamEl.innerHTML = md(text) + (done ? '' : '<span class="pg-cursor"></span>');
  scrollChat();
}
function pgCopyMsg(btn) {
  const bubble = btn.closest('.pg-msg-content').querySelector('.pg-msg-bubble');
  navigator.clipboard.writeText(bubble.textContent).then(()=>toast('已复制',true));
}
function pgRedo() {
  if (pgBusy || pgHistory.length < 2) return;
  pgHistory.pop();
  const msgs = $('pg-messages').children;
  if (msgs.length) msgs[msgs.length - 1].remove();
  pgStream(pgHistory.slice()).catch(()=>{});
}
function scrollChat() { const c = $('pg-chat'); c.scrollTop = c.scrollHeight; }
function autoResize() {
  const el = $('pg-input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}
$('pg-input').addEventListener('input', autoResize);
$('pg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); pgSend(); }
});

/* Markdown */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = String(src).split('\n');
  let out = '', listBuf = [];
  const flushList = () => { if (listBuf.length) { out += '<ul>' + listBuf.join('') + '</ul>'; listBuf = []; } };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushList(); const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; continue;
    }
    if (/^\s*[-*] /.test(line)) { listBuf.push('<li>' + inline(line.replace(/^\s*[-*] /, '')) + '</li>'); i++; continue; }
    flushList();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out += '<h'+(h[1].length+1)+'>'+inline(h[2])+'</h'+(h[1].length+1)+'>'; i++; continue; }
    if (/^>\s?/.test(line)) { out += '<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>'; i++; continue; }
    if (!line.trim()) { out += '<div class="md-gap"></div>'; i++; continue; }
    out += '<p>'+inline(line)+'</p>'; i++;
  }
  flushList(); return out;
}
</script>
</body>
</html>
