<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游乐场 - AI 中转站管理池</title>
    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch(e) {}
        })();
    </script>
    <style>
        /* ================================================================
         * 主题变量：所有颜色一律走变量，两套主题完整定义
         * ================================================================ */
        :root {
            --primary: #4f6ef7;
            --primary-hover: #3d5cf0;
            --primary-light: #eef2fe;
            --primary-soft: rgba(79, 110, 247, 0.09);
            --primary-text: #3f5cd9;
            --success: #30a46c;
            --danger: #e5484d;
            --danger-light: #fdeeee;
            --warning: #f5a623;
            --text: #1b1f24;
            --text-secondary: #5b6470;
            --text-muted: #98a1ac;
            --border: #e3e7ec;
            --border-light: #edf0f3;
            --border-glow: rgba(79, 110, 247, 0.22);
            --bg: #f6f7f9;
            --bg-secondary: #f0f2f5;
            --bg-hover: #e9ecf0;
            --card: #ffffff;
            --input-bg: #ffffff;
            --user-bubble: #4f6ef7;
            --user-bubble-text: #ffffff;
            --scroll-thumb: rgba(15, 23, 42, 0.16);
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
            --shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12);
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
            color-scheme: light;
        }
        [data-theme="dark"] {
            --primary: #2dd4a8;
            --primary-hover: #22bd96;
            --primary-light: rgba(45, 212, 168, 0.13);
            --primary-soft: rgba(45, 212, 168, 0.10);
            --primary-text: #5fe0bc;
            --success: #3dd68c;
            --danger: #f07178;
            --danger-light: rgba(240, 113, 120, 0.12);
            --warning: #f5b93c;
            --text: #e7ecf3;
            --text-secondary: #9aa5b4;
            --text-muted: #5d6876;
            --border: #27303c;
            --border-light: #1f2731;
            --border-glow: rgba(45, 212, 168, 0.25);
            --bg: #0f1216;
            --bg-secondary: #13181f;
            --bg-hover: #1c242e;
            --card: #171c23;
            --input-bg: #141920;
            --user-bubble: #0d8573;
            --user-bubble-text: #eefcf8;
            --scroll-thumb: rgba(255, 255, 255, 0.14);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; cursor: pointer; color: inherit; }
        svg { flex-shrink: 0; }

        /* ===== 顶部导航（扁平样式） ===== */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
        }
        .topbar-inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 700; }
        .brand-mark {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .topnav { display: flex; align-items: center; gap: 4px; }
        .topnav a, .topnav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 7px 12px;
            border-radius: 8px;
            display: flex; align-items: center; gap: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .topnav a:hover, .topnav button:hover { background: var(--bg-hover); color: var(--text); }
        .topnav a.active { background: var(--primary-light); color: var(--primary-text); font-weight: 600; }

        /* ===== 主区域 ===== */
        .pg-main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

        /* 聊天区 */
        .pg-chat { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 20px 12px; scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
        .pg-chat::-webkit-scrollbar { width: 10px; }
        .pg-chat::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
        .pg-chat::-webkit-scrollbar-track { background: transparent; }
        .pg-chat-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

        /* 空状态 */
        .pg-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 11vh 16px 0; }
        .pg-empty-icon {
            width: 62px; height: 62px;
            border-radius: 18px;
            background: var(--primary-light);
            color: var(--primary-text);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
        }
        .pg-empty-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
        .pg-empty-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.6; }
        .pg-empty-desc a { color: var(--primary-text); font-weight: 600; text-decoration: none; }
        .pg-empty-desc a:hover { text-decoration: underline; }
        .pg-empty-prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 540px; }
        .pg-prompt {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 14px;
            text-align: left;
            font-size: 13px;
            color: var(--text);
            display: flex;
            gap: 11px;
            align-items: flex-start;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        .pg-prompt:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-1px); }
        .pg-prompt-icon {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: var(--primary-soft);
            color: var(--primary-text);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pg-prompt-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
        .pg-prompt-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        /* 消息 */
        .msg-row { display: flex; flex-direction: column; }
        .msg-row.user { align-items: flex-end; }
        .msg-row.ai { align-items: flex-start; }
        .msg-bubble {
            max-width: min(760px, 88%);
            padding: 10px 15px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .msg-row.user .msg-bubble {
            background: var(--user-bubble);
            color: var(--user-bubble-text);
            border-bottom-right-radius: 5px;
        }
        .msg-row.ai .msg-bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
            box-shadow: var(--shadow-sm);
        }
        .msg-row.ai .msg-bubble.error-bubble {
            background: var(--danger-light);
            border-color: rgba(229, 72, 77, 0.3);
        }
        .msg-error-title { color: var(--danger); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .msg-row.user .msg-bubble .msg-bubble-content a { color: #dfe7ff; }

        /* 元数据 + 操作 */
        .msg-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            padding: 0 4px;
            min-height: 24px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .msg-row.user .msg-foot { flex-direction: row-reverse; }
        .msg-actions { display: flex; align-items: center; gap: 1px; opacity: 0; transition: opacity 0.15s; }
        .msg-row:hover .msg-actions { opacity: 1; }
        .icon-btn-sm {
            background: none;
            border: none;
            width: 26px; height: 26px;
            border-radius: 7px;
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .icon-btn-sm:hover { background: var(--bg-hover); color: var(--text); }
        .icon-btn-sm.danger:hover { background: var(--danger-light); color: var(--danger); }

        /* 思维链 */
        .reasoning-block {
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--bg-secondary);
            overflow: hidden;
            margin-bottom: 7px;
            max-width: min(760px, 88%);
        }
        .reasoning-toggle {
            width: 100%;
            background: none;
            border: none;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: left;
        }
        .reasoning-toggle:hover { background: var(--bg-hover); }
        .reasoning-toggle .rt-dur { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .reasoning-content {
            padding: 0 12px 10px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .thinking-spinner {
            width: 12px; height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Markdown */
        .msg-bubble-content pre {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
            margin: 6px 0;
        }
        .msg-bubble-content code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; }
        .msg-bubble-content pre code { background: none; padding: 0; }
        .msg-bubble-content p { margin: 4px 0; }
        .msg-bubble-content h1, h2, h3, h4, h5, h6 { margin: 10px 0 4px; line-height: 1.4; }
        .msg-bubble-content h1 { font-size: 18px; } .msg-bubble-content h2 { font-size: 16px; }
        .msg-bubble-content h3 { font-size: 15px; } .msg-bubble-content h4, h5, h6 { font-size: 14px; }
        .msg-bubble-content ul, .msg-bubble-content ol { margin: 4px 0; padding-left: 22px; }
        .msg-bubble-content li { margin: 2px 0; }
        .msg-bubble-content a { color: var(--primary-text); text-decoration: none; }
        .msg-bubble-content a:hover { text-decoration: underline; }
        .msg-bubble-content table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 13px; }
        .msg-bubble-content th, .msg-bubble-content td { border: 1px solid var(--border); padding: 5px 9px; }
        .msg-bubble-content th { background: var(--bg-secondary); }
        .msg-bubble-content blockquote { border-left: 3px solid var(--primary); background: var(--bg-secondary); margin: 6px 0; padding: 6px 12px; border-radius: 0 8px 8px 0; color: var(--text-secondary); }
        .msg-bubble-content hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
        .msg-bubble-content .stream-cursor::after { content: "▋"; color: var(--primary); animation: blink 1s step-end infinite; margin-left: 1px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 编辑框 */
        .msg-editor { max-width: min(760px, 88%); }
        .msg-editor textarea {
            width: 100%;
            min-height: 140px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            resize: vertical;
            outline: none;
        }
        .msg-editor textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--border-glow); }
        .msg-editor-actions { display: flex; gap: 8px; margin-top: 8px; }

        /* 通用按钮 */
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger-light); border-color: rgba(229,72,77,0.3); color: var(--danger); }
        .btn-danger:hover { background: rgba(229,72,77,0.16); }

        /* ===== 输入区 ===== */
        .pg-input-wrap { flex-shrink: 0; padding: 6px 20px 14px; }
        .pg-input-inner { max-width: 800px; margin: 0 auto; }
        .pg-input-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 12px 14px 9px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .pg-input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--border-glow); }
        .pg-input-textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            min-height: 24px;
            max-height: 200px;
            padding: 2px 4px;
        }
        .pg-input-textarea::placeholder { color: var(--text-muted); }
        .pg-input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid var(--border-light);
        }
        .pg-input-left, .pg-input-right { display: flex; align-items: center; gap: 4px; }

        .acct-trigger {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 13px;
            color: var(--text);
            max-width: 340px;
            transition: border-color 0.15s, background 0.15s;
        }
        .acct-trigger:hover { background: var(--bg-hover); border-color: var(--primary); }
        .acct-trigger .at-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .acct-trigger .at-model {
            background: var(--primary-soft);
            color: var(--primary-text);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 999px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }
        .acct-trigger .at-chev { color: var(--text-muted); }

        .icon-btn {
            background: none;
            border: none;
            width: 32px; height: 32px;
            border-radius: 9px;
            color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
        .icon-btn .badge {
            position: absolute;
            top: -3px; right: -3px;
            min-width: 15px; height: 15px;
            padding: 0 3px;
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, opacity 0.15s;
        }
        .send-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .send-btn.stop { background: var(--danger); }
        .send-btn.stop:hover { background: var(--danger); }
        .pg-input-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }

        /* ===== 弹层 ===== */
        .popover-mask { position: fixed; inset: 0; z-index: 90; }
        .popover {
            position: fixed;
            z-index: 100;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .acct-pop { width: 320px; max-width: calc(100vw - 24px); max-height: 420px; overflow-y: auto; padding: 8px; }
        .pop-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px 4px; }
        .acct-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: none;
            border: none;
            border-radius: 10px;
            padding: 8px 9px;
            font-size: 13px;
            color: var(--text);
            text-align: left;
            transition: background 0.12s;
        }
        .acct-item:hover { background: var(--bg-hover); }
        .acct-item.active { background: var(--primary-light); }
        .acct-item .ai-icon {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: var(--primary-soft);
            color: var(--primary-text);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .acct-item .ai-main { flex: 1; min-width: 0; }
        .acct-item .ai-name { font-weight: 600; display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .acct-item .ai-model { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
        .acct-item .ai-right { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
        .acct-item .ai-check { color: var(--primary-text); }
        .acct-item .ai-default { color: var(--warning); }

        /* 参数面板 */
        .params-pop { width: 360px; max-width: calc(100vw - 24px); max-height: 480px; overflow-y: auto; padding: 14px; }
        .params-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .params-title { font-size: 14px; font-weight: 700; }
        .params-sub { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }
        .param-card {
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 10px 11px;
            margin-bottom: 9px;
            background: var(--bg-secondary);
            transition: opacity 0.15s;
        }
        .param-card.disabled { opacity: 0.5; }
        .param-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .param-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .param-value {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--primary-text);
            background: var(--primary-soft);
            padding: 1px 7px;
            border-radius: 999px;
        }
        .param-desc { font-size: 11.5px; color: var(--text-muted); margin-bottom: 7px; }
        .param-control { display: flex; align-items: center; gap: 8px; }
        .param-control input[type="range"] { flex: 1; accent-color: var(--primary); }
        .param-control input[type="number"] {
            width: 110px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 4px 8px;
            font-size: 12.5px;
            color: var(--text);
            font-family: var(--font-mono);
            outline: none;
        }
        .param-control input[type="number"]:focus { border-color: var(--primary); }
        .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute; inset: 0;
            background: var(--border);
            border-radius: 999px;
            transition: background 0.2s;
        }
        .switch .slider::before {
            content: "";
            position: absolute;
            width: 15px; height: 15px;
            left: 2px; top: 2px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .switch input:checked + .slider { background: var(--primary); }
        .switch input:checked + .slider::before { transform: translateX(15px); }

        /* 确认弹窗 */
        .confirm-mask {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .confirm-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            width: 360px;
            max-width: 100%;
            padding: 20px;
        }
        .confirm-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

/* ================================================================
 *  工具函数
 * ================================================================ */
function $(id) { return document.getElementById(id); }
function icon(name, size) {
    var svg = ICONS[name] || '';
    if (size && svg) svg = svg.replace(/width="\d+"/, 'width="' + size + '"').replace(/height="\d+"/, 'height="' + size + '"');
    return svg;
}

function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] || c;
    });
}

function inlineMd(s) {
    var r = escHtml(s);
    r = r.replace(/`([^`]+)`/g, '<code>$1</code>');
    r = r.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    r = r.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    r = r.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return r;
}

function formatMsgContent(text) {
    if (!text) return "";
    var raw = String(text);
    var placeholders = [];
    var src = raw.replace(/```([\s\S]*?)```/g, function (_, code) {
        var idx = placeholders.length;
        var nlIdx = code.indexOf("\n");
        var body = nlIdx >= 0 ? code.slice(nlIdx + 1).replace(/\n$/, "") : "";
        placeholders.push('<pre><code>' + escHtml(body) + '</code></pre>');
        return "\u0000CODE" + idx + "\u0000";
    });

    var lines = src.split("\n");
    var html = [];
    var inUl = false, inOl = false, inP = false, pBuf = "";
    function flushP() { if (inP) { html.push('<p>' + inlineMd(pBuf) + '</p>'); pBuf = ""; inP = false; } }
    function closeUl() { if (inUl) { html.push('</ul>'); inUl = false; } }
    function closeOl() { if (inOl) { html.push('</ol>'); inOl = false; } }

    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.trim() === "") { flushP(); closeUl(); closeOl(); continue; }
        if (line.indexOf("\u0000CODE") === 0) {
            flushP(); closeUl(); closeOl();
            var idx = parseInt(line.match(/CODE(\d+)/)[1]);
            html.push(placeholders[idx]);
            continue;
        }
        if (/^\s*\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i + 1])) {
            flushP(); closeUl(); closeOl();
            var rows = [];
            while (i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])) { rows.push(lines[i].trim().slice(1, -1).split("|").map(function (s) { return s.trim(); })); i++; }
            i--;
            var header = rows[0];
            var align = rows.length > 1 ? rows[1].map(function (c) { return (c.indexOf(":") === 0 && c.slice(-1) === ":") ? "center" : c.slice(-1) === ":" ? "right" : c.indexOf(":") === 0 ? "left" : ""; }) : header.map(function () { return ""; });
            var body = rows.slice(2);
            var t = '<table><thead><tr>' + header.map(function (h, j) { return '<th' + (align[j] ? ' style="text-align:' + align[j] + '"' : '') + '>' + inlineMd(h) + '</th>'; }).join("") + '</tr></thead><tbody>';
            for (var r of body) t += '<tr>' + r.map(function (c, j) { return '<td' + (align[j] ? ' style="text-align:' + align[j] + '"' : '') + '>' + inlineMd(c) + '</td>'; }).join("") + '</tr>';
            t += '</tbody></table>';
            html.push(t);
            continue;
        }
        if (/^\s*>/.test(line)) {
            flushP(); closeUl(); closeOl();
            var quoted = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) { quoted.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
            i--;
            html.push('<blockquote>' + inlineMd(quoted.join(" ")) + '</blockquote>');
            continue;
        }
        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushP(); closeUl(); closeOl(); html.push('<hr>'); continue; }
        if (/^\s*[-*+]\s+/.test(line)) {
            flushP(); closeOl();
            if (!inUl) { html.push('<ul>'); inUl = true; }
            html.push('<li>' + inlineMd(line.replace(/^\s*[-*+]\s+/, "")) + '</li>');
            continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
            flushP(); closeUl();
            if (!inOl) { html.push('<ol>'); inOl = true; }
            html.push('<li>' + inlineMd(line.replace(/^\s*\d+\.\s+/, "")) + '</li>');
            continue;
        }
        var m = line.match(/^(#{1,6})\s+(.+)$/);
        if (m) {
            flushP(); closeUl(); closeOl();
            var n = m[1].length;
            html.push('<h' + n + '>' + inlineMd(m[2]) + '</h' + n + '>');
            continue;
        }
        if (!inP) inP = true;
        if (pBuf) pBuf += " ";
        pBuf += line;
    }
    flushP(); closeUl(); closeOl();
    return html.join("");
}

function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}

function uuid() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function fmtTime(iso) {
    var d = new Date(iso);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function fmtDuration(ms) {
    if (ms == null) return "";
    return ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(2) + "s";
}

/* ================================================================
 *  localStorage 持久化（{version, data} 信封）
 * ================================================================ */
function readStorage(key, fallback) {
    try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        var env = JSON.parse(raw);
        if (env && env.version === 1 && env.data !== undefined) return env.data;
        return fallback;
    } catch (e) { return fallback; }
}
function writeStorage(key, data) {
    try {
        localStorage.setItem(key, JSON.stringify({ version: 1, data: data }));
    } catch (e) {}
}
var messagesSaveTimer = null;
function saveMessagesSoon() {
    clearTimeout(messagesSaveTimer);
    messagesSaveTimer = setTimeout(function () {
        writeStorage(STORAGE_KEYS.MESSAGES, messages);
    }, 500);
}
function saveConfigSoon() { writeStorage(STORAGE_KEYS.CONFIG, config); }
function saveParamsSoon() { writeStorage(STORAGE_KEYS.PARAMS, paramEnabled); }

function sanitizeMessagesOnLoad(list) {
    if (!Array.isArray(list)) return [];
    var out = [];
    for (var i = 0; i < list.length; i++) {
        var m = list[i];
        if (!m || (m.from !== 'user' && m.from !== 'assistant')) continue;
        if (!m.versions || !m.versions.length) continue;
        if (m.status === 'loading' || m.status === 'streaming') {
            var last = m.versions[m.versions.length - 1].content || "";
            m.status = last ? 'complete' : 'error';
            if (!last) m.versions[0].content = "⚠️ 请求被中断，请重试。";
            m.errorCode = last ? null : 'interrupted';
        }
        if (m.from === 'user' && !m.versions[m.versions.length - 1].content) continue;
        out.push(m);
    }
    if (out.length > 100) out = out.slice(-100);
    return out;
}

/* ================================================================
 *  账号加载（模型直接用后台配置，无需前端选择）
 * ================================================================ */
function loadAccounts() {
    return fetch('/api/accounts')
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (!res.ok) throw new Error(res.message || '获取账号失败');
            accounts = res.accounts || [];
            return accounts;
        })
        .catch(function (e) {
            accounts = [];
            showToast('加载账号失败：' + e.message);
            return [];
        });
}

function fetchModels(accountId) {
    // 仅当账号未配置模型时兜底：取上游模型列表第一个
    return fetch('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account_id: accountId })
    })
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (res.ok && Array.isArray(res.models) && res.models.length) return res.models[0];
            return '';
        })
        .catch(function () { return ''; });
}

function selectAccount(accountId) {
    var acc = accounts.find(function (a) { return a.id === accountId; });
    if (!acc) return;
    config.accountId = acc.id;
    config.model = (acc.model || '').split(/[,，]/)[0].trim() || '';
    saveConfigSoon();
    updateAcctTrigger();
    // 后台未配置模型时兜底取第一个可用模型
    if (!config.model) {
        fetchModels(acc.id).then(function (m) {
            if (m) {
                config.model = m;
                saveConfigSoon();
                updateAcctTrigger();
            } else {
                showToast('该账号未配置模型，请先在管理后台设置');
            }
        });
    }
}

function getDefaultAccount() {
    var def = accounts.find(function (a) { return a.is_default; });
    if (def) return def;
    var valid = accounts.filter(function (a) { return a.latency_ms != null; });
    if (valid.length) {
        valid.sort(function (a, b) { return a.latency_ms - b.latency_ms; });
        return valid[0];
    }
    return accounts[0] || null;
}

function initAccounts() {
    loadAccounts().then(function (list) {
        if (!list.length) {
            renderEmptyState(
                '还没有 API 账号',
                '请先到 <a href="/admin">管理后台</a> 添加 API 中转站账号并配置模型，再回到这里测试。'
            );
            updateAcctTrigger();
            return;
        }
        var target = null;
        if (config.accountId) {
            target = list.find(function (a) { return a.id === config.accountId; }) || getDefaultAccount();
        } else {
            target = getDefaultAccount();
        }
        selectAccount(target.id);
    });
}

/* ================================================================
 *  账号选择器（单列账号列表，模型来自后台配置）
 * ================================================================ */
function updateAcctTrigger() {
    var acc = accounts.find(function (a) { return a.id === config.accountId; });
    atIcon.innerHTML = icon('server');
    atName.textContent = acc ? acc.name : '选择账号';
    atModel.textContent = config.model || (acc && acc.model ? String(acc.model).split(/[,，]/)[0] : '');
    atModel.style.display = atModel.textContent ? '' : 'none';
    atChev.innerHTML = icon('chevronDown');
}

function openAcctSelector() {
    if (acctPopOpen) return;
    acctPopOpen = true;
    closeParamPopover();
    var mask = document.createElement('div');
    mask.className = 'popover-mask';
    mask.id = 'acctMask';
    mask.addEventListener('click', closeAcctSelector);
    var pop = document.createElement('div');
    pop.className = 'popover acct-pop';

function closeAcctSelector() {
    if (!acctPopOpen) return;
    acctPopOpen = false;
    var mask = $('acctMask'); if (mask) mask.remove();
    var pop = $('acctPop'); if (pop) pop.remove();
}

function positionPopover(pop, anchor, gap) {
    var rect = anchor.getBoundingClientRect();
    var popW = pop.offsetWidth;
    var left = rect.left;
    if (left + popW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - popW - 8);
    if (left < 8) left = 8;
    var top = rect.bottom + gap;
    if (top + pop.offsetHeight > window.innerHeight - 8) {
        top = Math.max(8, rect.top - pop.offsetHeight - gap);
    }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
}

function updateParamBadge() {
    var n = PARAM_DEFS.filter(function (d) { return paramEnabled[d.key]; }).length;
    paramBadge.textContent = n;
    paramBadge.style.display = n ? '' : 'none';
}

function openParamPopover() {
    if (paramPopOpen) return;
    paramPopOpen = true;
    closeAcctSelector();
    var mask = document.createElement('div');
    mask.className = 'popover-mask';
    mask.id = 'paramMask';
    mask.addEventListener('click', closeParamPopover);
    var pop = document.createElement('div');
    pop.className = 'popover params-pop';
    pop.id = 'paramPop';

    var head = document.createElement('div');
    head.className = 'params-head';
    head.innerHTML = '<span class="params-title">参数设置</span>';
    pop.appendChild(head);
    var sub = document.createElement('div');
    sub.className = 'params-sub';
    sub.textContent = '只有启用的参数才会随请求发送。';
    pop.appendChild(sub);

    PARAM_DEFS.forEach(function (d) {
        var card = document.createElement('div');
        card.className = 'param-card' + (paramEnabled[d.key] ? '' : ' disabled');
        var headRow = document.createElement('div');
        headRow.className = 'param-card-head';
        headRow.innerHTML = '<span class="param-name">' + escHtml(d.label) + '</span>';

        desc.className = 'param-desc';
        desc.textContent = d.desc;

            var range = document.createElement('input');
            range.type = 'range';
            range.min = d.min; range.max = d.max; range.step = d.step;
            range.value = config[d.key];
            range.addEventListener('input', function () {
                config[d.key] = parseFloat(range.value);
                valueBadge.textContent = formatParamValue(d.key);
                saveConfigSoon();
            });
            var num = document.createElement('input');
            num.type = 'number';
            num.min = d.min; num.max = d.max; num.step = d.step;
            num.value = config[d.key];
            num.addEventListener('change', function () {
                var v = parseFloat(num.value);
                if (isNaN(v)) v = d.def;
                config[d.key] = v;
                range.value = v;
                valueBadge.textContent = formatParamValue(d.key);
                saveConfigSoon();
            });
            control.appendChild(range);
            control.appendChild(num);
        } else {
            var inp = document.createElement('input');
            inp.type = 'number';
            inp.min = d.min; inp.max = d.max; inp.step = d.step;
            inp.placeholder = '未设置';
            inp.value = (config[d.key] === null || config[d.key] === undefined) ? '' : config[d.key];
            inp.addEventListener('change', function () {
                var raw = inp.value.trim();
                if (raw === '') { config[d.key] = null; }
                else {
                    var v = parseInt(raw, 10);
                    if (isNaN(v)) v = d.def;
                    config[d.key] = v;
                }
                valueBadge.textContent = formatParamValue(d.key);
                saveConfigSoon();

        sliderEl.className = 'slider';
        sw.appendChild(swInput); sw.appendChild(sliderEl);
        swInput.addEventListener('change', function () {
            paramEnabled[d.key] = swInput.checked;

            updateParamBadge();
            saveParamsSoon();

        control.appendChild(sw);
        card.appendChild(control);

/* ================================================================
 *  消息渲染
 * ================================================================ */
function latestContent(m) {
    return m.versions[m.versions.length - 1].content;
}

function renderEmptyState(title, desc) {
    chatInner.innerHTML =
        '<div class="pg-empty">' +
        '<div class="pg-empty-icon">' + icon('zap', 26) + '</div>' +
        '<div class="pg-empty-title">' + escHtml(title) + '</div>' +
        '<div class="pg-empty-desc">' + desc + '</div>' +
        '</div>';
}

function renderMessages() {
    chatInner.innerHTML = '';
    if (!messages.length) {
        renderEmptyState('游乐场', '选择账号后即可开始测试对话，模型与参数会随请求发送。');
        renderPrompts();
        return;
    }
    messages.forEach(function (m) {
        chatInner.appendChild(buildMessageEl(m, m.key));
    });

function renderPrompts() {

        { icon: 'chart', title: '分析数据', desc: '分析一组数据并给出关键洞察', text: '请分析下面这组数据，给出趋势与关键洞察：\n\n2026-01: 1200\n2026-02: 1450\n2026-03: 1320\n2026-04: 1780\n2026-05: 2100\n2026-06: 2450' },
        { icon: 'fileText', title: '总结文本', desc: '把一段长文本提炼成要点', text: '请用要点形式总结以下文本的核心内容：\n\n[在这里粘贴需要总结的文本]' },
        { icon: 'code', title: '编写代码', desc: '用 Python 实现一个功能', text: '用 Python 写一个函数：输入一个整数列表，返回其中出现次数最多的元素及其出现次数。' },

function buildMessageEl(m, key) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (m.from === 'user' ? 'user' : 'ai');
    row.dataset.key = key;

    if (m.from === 'assistant') {
        if (m.reasoning && m.reasoning.content) {
            var rb = document.createElement('div');
            rb.className = 'reasoning-block';
            rb.dataset.reasoningRoot = key;
            var toggle = document.createElement('button');
            toggle.className = 'reasoning-toggle';
            toggle.innerHTML = '<span>' + icon('brain') + '</span><span>Thinking</span>';
            if (m.isReasoningStreaming) {
                var sp = document.createElement('span');
                sp.className = 'thinking-spinner';
                toggle.appendChild(sp);
            }
            var durSpan = document.createElement('span');
            durSpan.className = 'rt-dur';
            durSpan.textContent = m.reasoning.duration != null ? ' · ' + fmtDuration(m.reasoning.duration) : '';
            toggle.appendChild(durSpan);
            var rc = document.createElement('div');
            rc.className = 'reasoning-content';
            rc.textContent = m.reasoning.content;
            rb.appendChild(toggle);
            rb.appendChild(rc);
            var closed = false;
            toggle.addEventListener('click', function () {
                closed = !closed;
                rc.style.display = closed ? 'none' : '';
            });
            row.appendChild(rb);
        }

        var bubble = document.createElement('div');
        bubble.className = 'msg-bubble' + (m.status === 'error' ? ' error-bubble' : '');
        bubble.setAttribute('data-content-root', key);
        if (m.status === 'error') {
            bubble.innerHTML = '<div class="msg-error-title">⚠️ ' + escHtml(m.errorTitle || '请求失败') + '</div>';
        }
        var content = document.createElement('div');
        content.className = 'msg-bubble-content';
        content.innerHTML = formatMsgContent(latestContent(m));
        bubble.appendChild(content);
        row.appendChild(bubble);
    } else {
        var ub = document.createElement('div');
        ub.className = 'msg-bubble';
        ub.setAttribute('data-content-root', key);
        var ucontent = document.createElement('div');
        ucontent.className = 'msg-bubble-content';
        ucontent.innerHTML = formatMsgContent(latestContent(m));
        ub.appendChild(ucontent);
        row.appendChild(ub);
    }

    var foot = document.createElement('div');
    foot.className = 'msg-foot';
    var meta = document.createElement('span');
    meta.innerHTML = (m.createdAt ? fmtTime(m.createdAt) : '') +
        (m.durationMs != null ? ' · Response time: ' + fmtDuration(m.durationMs) : '');
    foot.appendChild(meta);

    var actions = document.createElement('div');
    actions.className = 'msg-actions';
    var canCopy = latestContent(m).trim().length > 0;
    if (canCopy) {
        actions.appendChild(actionBtn('copy', 'copy', '复制', key));
    }
    if (m.from === 'assistant') {
        if (m.status === 'error') {
            actions.appendChild(actionBtn('retry', 'refresh', '重试', key));
        } else if (canCopy) {
            actions.appendChild(actionBtn('regenerate', 'refresh', '重新生成', key));
        }
    }
    actions.appendChild(actionBtn('edit', 'pencil', '编辑', key));
    actions.appendChild(actionBtn('delete', 'trash', '删除', key, true));
    foot.appendChild(actions);
    row.appendChild(foot);
    return row;
}

function actionBtn(action, iconName, label, key, danger) {
    var b = document.createElement('button');
    b.className = 'icon-btn-sm' + (danger ? ' danger' : '');
    b.dataset.action = action;
    b.dataset.key = key;
    b.title = label;
    b.innerHTML = icon(iconName);
    return b;
}

function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
}

function updateStreamingDom(key, reasoningText, contentText, isReasoningStreaming) {
    var root = chatInner.querySelector('[data-key="' + key + '"]');
    if (!root) return;
    var rb = root.querySelector('[data-reasoning-root="' + key + '"]');
    var cr = root.querySelector('[data-content-root="' + key + '"] .msg-bubble-content');
    if (rb) {
        var rc = rb.querySelector('.reasoning-content');
        if (rc) rc.textContent = reasoningText;
        var toggle = rb.querySelector('.reasoning-toggle');
        var sp = toggle.querySelector('.thinking-spinner');
        if (isReasoningStreaming) {
            if (!sp) {
                var ns = document.createElement('span');
                ns.className = 'thinking-spinner';
                toggle.insertBefore(ns, toggle.lastChild);
            }
        } else if (sp) {
            sp.remove();
        }
    }
    if (cr) {
        cr.innerHTML = formatMsgContent(contentText) +
            (contentText.length || reasoningText ? '<span class="stream-cursor"></span>' : '');
    }
}

/* ================================================================
 *  发送 / 停止
 * ================================================================ */
function buildPayload() {
    var msgs = messages.map(function (m) {
        return { role: m.from, content: latestContent(m) };
    }).filter(function (m) { return m.content; });
    var payload = {
        account_id: config.accountId,
        model: config.model,
        messages: msgs,
        stream: true,
    };
    PARAM_DEFS.forEach(function (d) {
        if (paramEnabled[d.key] && config[d.key] !== null && config[d.key] !== undefined) {
            payload[d.key] = config[d.key];
        }
    });
    return payload;
}

function doSend(text) {
    var content = (text != null ? text : messageInput.value).trim();
    if (!content) return;
    if (streaming) return;
    if (!config.accountId || !accounts.length) { showToast('请先到管理后台添加账号'); return; }
    if (!config.model) { showToast('该账号未配置模型，请先在管理后台设置'); return; }

    var gen = ++generation;
    var t0 = Date.now();

    var userMsg = {
        key: uuid(),
        from: 'user',
        versions: [{ id: uuid(), content: content }],
        createdAt: new Date().toISOString(),
        status: 'complete',
        errorCode: null,
    };
    messages.push(userMsg);
    messageInput.value = '';
    autoResize();

    var assistantMsg = {
        key: uuid(),
        from: 'assistant',
        versions: [{ id: uuid(), content: '' }],
        createdAt: new Date().toISOString(),
        startedAt: new Date().toISOString(),
        status: 'streaming',
        errorCode: null,
        reasoning: { content: '', startedAt: null, completedAt: null, duration: null },
        isReasoningStreaming: false,
    };
    messages.push(assistantMsg);

    streaming = true;
    setStreamingUI(true);
    renderMessages();
    scrollToBottom();

    var pendingContent = '';
    var pendingReasoning = '';
    var isReasoningStreaming = false;
    var flushTimer = null;

    function flush() {
        if (gen !== generation) return;
        updateStreamingDom(assistantMsg.key, pendingReasoning, pendingContent, isReasoningStreaming);
        scrollToBottom();
    }

    var payload = buildPayload();
    var controller = new AbortController();
    abortController = controller;
    var timeoutId = setTimeout(function () { controller.abort(); }, 600 * 1000);

    fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
    })
        .then(function (resp) {
            if (!resp.ok) throw new Error('服务器返回 ' + resp.status);
            return resp.body.getReader();
        })
        .then(function (reader) {
            var decoder = new TextDecoder();
            var buffer = '';
            function pump() {
                return reader.read().then(function (result) {
                    if (result.done) { finishStream(gen, assistantMsg, t0, pendingContent, pendingReasoning); return; }
                    buffer += decoder.decode(result.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line || line.indexOf('data: ') !== 0) continue;
                        var dc = line.slice(6).trim();
                        if (dc === '[DONE]') { finishStream(gen, assistantMsg, t0, pendingContent, pendingReasoning); return; }
                        var parsed;
                        try { parsed = JSON.parse(dc); } catch (e) { continue; }
                        if (gen !== generation) return;
                        if (parsed.error) {
                            handleStreamError(gen, assistantMsg, parsed.error, pendingContent);
                            return;
                        }
                        var delta = (parsed.choices && parsed.choices[0] && parsed.choices[0].delta) || {};
                        if (delta.reasoning_content) {
                            pendingReasoning += delta.reasoning_content;
                            isReasoningStreaming = true;
                        } else if (delta.content) {
                            pendingContent += delta.content;
                            isReasoningStreaming = false;
                        }
                        if (!flushTimer) {
                            flushTimer = setTimeout(function () { flushTimer = null; flush(); }, 50);
                        }
                    }
                    return pump();
                });
            }
            return pump();
        })
        .catch(function (err) {
            if (gen !== generation) return;
            if (err.name === 'AbortError') {
                if (pendingContent || pendingReasoning) {
                    finishStream(gen, assistantMsg, t0, pendingContent, pendingReasoning, true);
                } else {
                    handleStreamError(gen, assistantMsg, { message: '已停止生成' }, '');
                }
            } else {
                handleStreamError(gen, assistantMsg, { message: err.message || '请求失败' }, pendingContent);
            }
        })
        .finally(function () {
            clearTimeout(timeoutId);
            if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
            if (gen === generation) {
                streaming = false;
                abortController = null;
                setStreamingUI(false);
            }
        });
}

function processThinkTags(content) {
    var reasoning = null, isStreaming = false;
    var idx = content.indexOf('<think>');
    if (idx >= 0) {
        var rest = content.slice(idx + 7);
        var end = rest.indexOf('</think>');
        if (end >= 0) {
            reasoning = rest.slice(0, end);
        } else {
            reasoning = rest;
            isStreaming = true;
        }
        return { reasoning: reasoning, content: content.slice(0, idx), isStreaming: isStreaming };
    }
    return { reasoning: null, content: content, isStreaming: false };
}

function finishStream(gen, msg, t0, pendingContent, pendingReasoning, stopped) {
    if (gen !== generation) return;
    var think = processThinkTags(pendingContent);
    if (think.reasoning && !pendingReasoning) {
        pendingReasoning = think.reasoning;
        pendingContent = think.content;
    }
    var content = pendingContent;
    if (content === '' && !pendingReasoning && !stopped) {
        msg.status = 'error';
        msg.errorCode = 'empty';
        msg.errorTitle = '未收到有效回复';
        msg.versions[msg.versions.length - 1].content = '⚠️ 上游未返回任何内容，请检查账号配置或模型是否可用。';
    } else {
        msg.status = 'complete';
        if (content === '') {
            content = '（已停止生成）';
        }
        msg.versions[msg.versions.length - 1].content = content;
    }
    msg.completedAt = new Date().toISOString();
    msg.durationMs = Date.now() - t0;
    msg.isContentComplete = true;
    msg.isReasoningStreaming = false;
    if (pendingReasoning) {
        msg.reasoning = {
            content: pendingReasoning,
            startedAt: msg.startedAt,
            completedAt: msg.completedAt,
            duration: Date.now() - t0,
        };
        msg.isReasoningComplete = true;
    } else {
        msg.reasoning = null;
    }
    renderMessages();
    saveMessagesSoon();
}

function handleStreamError(gen, msg, error, partialContent) {
    if (gen !== generation) return;
    var title = '请求失败';
    var detail = '';
    if (typeof error === 'string') detail = error;
    else if (error && error.message) detail = error.message;
    else if (error) detail = JSON.stringify(error);
    msg.status = 'error';
    msg.errorCode = 'api_error';
    msg.errorTitle = title;
    msg.completedAt = new Date().toISOString();
    msg.durationMs = Date.now() - Date.parse(msg.startedAt || msg.createdAt);
    msg.isContentComplete = true;
    msg.isReasoningStreaming = false;
    if (partialContent) {
        msg.versions.push({ id: uuid(), content: partialContent });
        msg.versions[msg.versions.length - 1].content += '\n\n> ⚠️ ' + detail;
    } else {
        msg.versions[msg.versions.length - 1].content = detail;
    }
    renderMessages();
    saveMessagesSoon();
}

function doStop() {
    if (!streaming) return;
    generation++;
    if (abortController) abortController.abort();
}

function setStreamingUI(isStreaming) {
    sendBtn.classList.toggle('stop', isStreaming);
    sendBtn.innerHTML = isStreaming ? icon('stop') : icon('send');
    sendBtn.title = isStreaming ? '停止生成' : '发送';
    messageInput.disabled = isStreaming;
}

/* ================================================================
 *  消息操作
 * ================================================================ */
function findMsg(key) {
    for (var i = 0; i < messages.length; i++) if (messages[i].key === key) return { msg: messages[i], index: i };
    return null;
}

function copyMessage(key) {
    var f = findMsg(key);
    if (!f) return;
    var text = latestContent(f.msg);
    if (!text.trim()) { showToast('没有可复制的内容'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { showToast('已复制'); }, function () { fallbackCopy(text); });
    } else {
        fallbackCopy(text);
    }
}
function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制'); } catch (e) { showToast('复制失败'); }
    ta.remove();
}

function regenerate(key) {
    if (streaming) { showToast('正在生成中'); return; }
    var f = findMsg(key);
    if (!f) return;
    var targetUser = null;
    for (var i = f.index - 1; i >= 0; i--) {
        if (messages[i].from === 'user') { targetUser = { msg: messages[i], index: i }; break; }
    }
    if (!targetUser) { showToast('没有可重新生成的消息'); return; }
    messages = messages.slice(0, targetUser.index + 1);
    renderMessages();
    saveMessagesSoon();
    doSend(latestContent(targetUser.msg));
}

function retryMessage(key) {
    var f = findMsg(key);
    if (!f) return;
    for (var i = f.index - 1; i >= 0; i--) {
        if (messages[i].from === 'user') {
            messages = messages.slice(0, i + 1);
            renderMessages();
            saveMessagesSoon();
            doSend(latestContent(messages[i]));
            return;
        }
    }
    showToast('没有可重试的消息');
}

function deleteMessage(key) {
    var f = findMsg(key);
    if (!f) return;
    messages.splice(f.index, 1);
    renderMessages();
    saveMessagesSoon();
}

function editMessage(key) {
    if (streaming) { showToast('正在生成中'); return; }
    var f = findMsg(key);
    if (!f) return;
    var msg = f.msg;
    var row = chatInner.querySelector('[data-key="' + key + '"]');
    if (!row) return;
    var bubble = row.querySelector('[data-content-root="' + key + '"]');
    if (!bubble) return;

    var editor = document.createElement('div');
    editor.className = 'msg-editor';
    var ta = document.createElement('textarea');
    ta.value = latestContent(msg);
    var actionsDiv = document.createElement('div');
    actionsDiv.className = 'msg-editor-actions';

    var btnSave = document.createElement('button');
    btnSave.className = 'btn btn-primary';
    btnSave.textContent = msg.from === 'user' ? '保存并重新发送' : '保存';
    var btnCancel = document.createElement('button');
    btnCancel.className = 'btn';
    btnCancel.textContent = '取消';

    actionsDiv.appendChild(btnSave);
    actionsDiv.appendChild(btnCancel);
    editor.appendChild(ta);
    editor.appendChild(actionsDiv);
    bubble.replaceWith(editor);

    function cancel() { renderMessages(); }
    function save() {
        var newContent = ta.value.trim();
        if (!newContent) { showToast('内容不能为空'); return; }
        msg.versions.push({ id: uuid(), content: newContent });
        msg.durationMs = null;
        if (msg.from === 'user') {
            var idx = messages.indexOf(msg);
            messages = messages.slice(0, idx + 1);
            renderMessages();
            saveMessagesSoon();
            doSend(newContent);
        } else {
            msg.status = 'complete';
            msg.errorCode = null;
            renderMessages();
            saveMessagesSoon();
        }
    }
    btnSave.addEventListener('click', save);
    btnCancel.addEventListener('click', cancel);
    ta.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
}

/* ================================================================
 *  输入框 / 清空 / 主题
 * ================================================================ */
function autoResize() {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
}

function confirmClear() {
    var mask = document.createElement('div');
    mask.className = 'confirm-mask';
    var box = document.createElement('div');
    box.className = 'confirm-box';
    box.innerHTML =
        '<div class="confirm-title">' + icon('trash') + ' 清空聊天</div>' +
        '<div class="confirm-desc">本浏览器中保存的所有游乐场消息将被删除，此操作无法撤销。账号与模型配置不会受到影响。</div>' +
        '<div class="confirm-actions">' +
        '<button class="btn" id="confirmNo">取消</button>' +
        '<button class="btn btn-danger" id="confirmYes">清空</button>' +
        '</div>';
    mask.appendChild(box);
    document.body.appendChild(mask);
    function close() { mask.remove(); }
    $('confirmNo').addEventListener('click', close);
    $('confirmYes').addEventListener('click', function () {
        messages = [];
        renderMessages();
        saveMessagesSoon();
        close();
        showToast('聊天已清空');
    });
    mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
}

function applyThemeIcon() {
    var cur = document.documentElement.getAttribute('data-theme');
    $('themeToggle').innerHTML = cur === 'dark' ? icon('sun') : icon('moon');
}
function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    applyThemeIcon();
}

/* ================================================================
 *  初始化
 * ================================================================ */
function init() {
    chatInner = $('chatInner');
    chatScroll = $('chatScroll');
    messageInput = $('messageInput');
    sendBtn = $('sendBtn');
    atName = $('atName');
    atModel = $('atModel');
    atIcon = $('atIcon');
    atChev = $('atChev');
    acctTrigger = $('acctTrigger');
    paramBtn = $('paramBtn');
    clearBtn = $('clearBtn');
    toastEl = $('toast');

    $('brandMark').innerHTML = icon('zap', 15);
    paramBtn.innerHTML = icon('sliders') + '<span class="badge" id="paramBadge" style="display:none;">0</span>';
    paramBadge = $('paramBadge');
    clearBtn.innerHTML = icon('trash');
    sendBtn.innerHTML = icon('send');

    var savedConfig = readStorage(STORAGE_KEYS.CONFIG, null);
    if (savedConfig && typeof savedConfig === 'object') {
        config = Object.assign(defaultConfig(), savedConfig);
        if (typeof config.stream !== 'boolean') config.stream = true;
    }
    paramEnabled = Object.assign(defaultParamEnabled(), readStorage(STORAGE_KEYS.PARAMS, {}));
    messages = sanitizeMessagesOnLoad(readStorage(STORAGE_KEYS.MESSAGES, []));

    updateParamBadge();
    updateAcctTrigger();
    applyThemeIcon();

    $('themeToggle').addEventListener('click', toggleTheme);
    acctTrigger.addEventListener('click', function () { openAcctSelector(); });
    paramBtn.addEventListener('click', function () { openParamPopover(); });
    clearBtn.addEventListener('click', function () { confirmClear(); });
    sendBtn.addEventListener('click', function () {
        if (streaming) doStop();
        else doSend();
    });
    messageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (streaming) return;
            doSend();
        }
    });
    messageInput.addEventListener('input', autoResize);
    chatInner.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var key = btn.dataset.key;
        switch (btn.dataset.action) {
            case 'copy': copyMessage(key); break;
            case 'regenerate': regenerate(key); break;
            case 'retry': retryMessage(key); break;
            case 'edit': editMessage(key); break;
            case 'delete': deleteMessage(key); break;
        }
    });
    window.addEventListener('resize', function () {
        if (acctPopOpen) positionPopover($('acctPop'), acctTrigger, 10);
        if (paramPopOpen) positionPopover($('paramPop'), paramBtn, 10);
    });

    if (!messages.length) renderEmptyState('游乐场', '选择账号后即可开始测试对话，模型与参数会随请求发送。');
    else renderMessages();

    initAccounts();
    messageInput.focus();
}

document.addEventListener('DOMContentLoaded', init);
</script>
