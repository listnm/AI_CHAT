<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground</title>
<style>
/* ============ new-api Playground Style ============ */
:root {
  --background: #ffffff;
  --foreground: #0a0a0a;
  --card: #ffffff;
  --muted: #f5f5f5;
  --muted-foreground: #737373;
  --border: #e5e5e5;
  --input: #e5e5e5;
  --primary: #171717;
  --primary-foreground: #fafafa;
  --destructive: #ef4444;
  --destructive-foreground: #fafafa;
  --ring: #a3a3a3;
  --radius: 0.75rem;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; overflow: hidden;
  background: var(--background); color: var(--foreground);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* 安全区域适配（iOS 刘海/底部横条） */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
::selection { background: rgba(0,0,0,.08); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ App Layout ============ */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ============ Chat Area ============ */
.chat-area { flex: 1; overflow-y: auto; min-height: 0; }
.chat-inner {
  width: 100%; max-width: 48rem; margin: 0 auto;
  padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
  min-height: 100%;
}

/* ============ Empty State ============ */
.empty-state {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: min(520px, calc(100svh - 18rem)); padding: 2rem 0.25rem;
}
.empty-card { width: 100%; max-width: 42rem; text-align: center; }
.empty-icon {
  width: 2.75rem; height: 2.75rem; border-radius: 0.75rem; margin: 0 auto 1.25rem;
  background: var(--muted); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted-foreground);
}
.empty-card h2 {
  font-size: 1.25rem; font-weight: 600; letter-spacing: -.025em;
  margin-bottom: 0.5rem; text-wrap: balance;
}
.empty-card p {
  color: var(--muted-foreground); font-size: 0.875rem; line-height: 1.5;
  max-width: 32rem; margin: 0 auto 1.25rem; text-wrap: balance;
}
.starter-grid { display: grid; gap: 0.5rem; grid-template-columns: 1fr 1fr; }
.starter-btn {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.625rem 0.75rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--background);
  color: var(--foreground); font-size: 0.875rem; cursor: pointer;
  transition: all .15s; text-align: left; min-height: 2.75rem;
  white-space: normal; line-height: 1.4;
}
.starter-btn:hover { background: var(--muted); border-color: #d4d4d4; }
.starter-btn svg { flex-shrink: 0; color: var(--muted-foreground); }

/* ============ Messages ============ */
.msg { display: flex; gap: 0.625rem; max-width: 100%; padding: 0.625rem 0; }
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 600;
}
.msg.user .msg-avatar { background: var(--primary); color: var(--primary-foreground); }
.msg.assistant .msg-avatar { background: var(--muted); color: var(--muted-foreground); border: 1px solid var(--border); }
.msg-body { min-width: 0; flex: 1; max-width: 85%; }
.msg-content {
  font-size: 0.875rem; line-height: 1.7; overflow-wrap: break-word; word-break: break-word;
}
.msg.user .msg-content { color: var(--foreground); }
.msg.assistant .msg-content { color: var(--foreground); }
.msg-actions {
  display: flex; gap: 0.25rem; margin-top: 0.375rem; opacity: 0;
  transition: opacity .15s;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-action {
  padding: 0.25rem 0.5rem; border-radius: 0.375rem; border: none; background: none;
  color: var(--muted-foreground); font-size: 0.75rem; cursor: pointer;
  transition: all .1s; display: inline-flex; align-items: center; gap: 0.25rem;
}
.msg-action:hover { background: var(--muted); color: var(--foreground); }
.msg-error {
  color: var(--destructive); font-size: 0.875rem; padding: 0.5rem 0.75rem;
  background: rgba(239,68,68,.06); border-radius: 0.5rem;
  border: 1px solid rgba(239,68,68,.15);
}
.cursor-blink {
  display: inline-block; width: 2px; height: 1em; background: var(--foreground);
  border-radius: 1px; margin-left: 1px; vertical-align: -1px;
  animation: blink .8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
.msg { animation: fadeIn .2s ease; }

/* ============ Markdown ============ */
.md p { margin: 0.25rem 0; }
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { margin: 0.75rem 0 0.25rem; font-weight: 600; color: var(--foreground); }
.md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.125rem; } .md h3 { font-size: 1rem; }
.md pre {
  background: var(--muted); border: 1px solid var(--border); border-radius: 0.5rem;
  padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; font-size: 0.8125rem;
}
.md pre code { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; color: var(--foreground); background: none; padding: 0; }
.md code {
  background: var(--muted); color: var(--foreground); border-radius: 0.25rem;
  padding: 0.125rem 0.375rem; font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  font-size: 0.8125rem; border: 1px solid var(--border);
}
.md ul, .md ol { margin: 0.25rem 0 0.25rem 1.25rem; }
.md li { margin: 0.125rem 0; }
.md blockquote {
  border-left: 3px solid var(--border); padding: 0.375rem 0.75rem;
  margin: 0.5rem 0; color: var(--muted-foreground);
}
.md a { color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; }
.md a:hover { opacity: .8; }
.md table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 0.375rem 0.625rem; text-align: left; font-size: 0.8125rem; }
.md th { background: var(--muted); font-weight: 600; }
.md-gap { height: 0.5rem; }

/* ============ Input Area ============ */
.input-area {
  flex-shrink: 0; padding: 0 0.25rem 1rem;
  padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
}
.input-area-inner { max-width: 48rem; margin: 0 auto; }
.input-box {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--background); overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
  box-shadow: 0 18px 60px -32px rgba(0,0,0,.12);
}
.input-box:focus-within {
  border-color: rgba(0,0,0,.15);
  box-shadow: 0 22px 70px -34px rgba(0,0,0,.15), 0 0 0 3px rgba(0,0,0,.03);
}
.input-textarea {
  width: 100%; min-height: 5rem; max-height: 12rem; padding: 1rem 1.25rem 0.5rem;
  border: none; background: none; color: var(--foreground); font-size: 0.875rem;
  font-family: inherit; line-height: 1.75; resize: none; outline: none;
}
@media (min-width: 768px) {
  .input-textarea { min-height: 6rem; font-size: 1rem; }
}
.input-textarea::placeholder { color: var(--muted-foreground); }
.input-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 0.75rem; border-top: 1px solid var(--border);
}
.input-tools { display: flex; align-items: center; gap: 0.125rem; }
.tool-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; border-radius: 0.5rem; border: none;
  background: none; color: var(--muted-foreground); cursor: pointer;
  transition: all .1s;
}
.tool-btn:hover { background: var(--muted); color: var(--foreground); }
.tool-btn:disabled { opacity: .4; cursor: not-allowed; }
.tool-btn.danger:hover { background: rgba(239,68,68,.08); color: var(--destructive); }
.send-btn {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.5rem 0.875rem; border-radius: 0.5rem; border: none;
  background: var(--primary); color: var(--primary-foreground);
  font-size: 0.8125rem; font-weight: 500; cursor: pointer;
  transition: all .15s; height: 2rem;
}
.send-btn:hover { background: #262626; }
.send-btn:disabled { background: var(--muted); color: var(--muted-foreground); cursor: not-allowed; }
.send-btn.stop { background: var(--destructive); color: var(--destructive-foreground); }
.send-btn.stop:hover { background: #dc2626; }

/* ============ Confirm Dialog ============ */
.dialog-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .15s ease;
}
.dialog-overlay[hidden] { display: none; }
.dialog {
  background: var(--background); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  width: min(28rem, 90vw); padding: 1.5rem; animation: fadeIn .15s ease;
}
.dialog h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
.dialog p { font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1.25rem; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
.dialog-btn {
  padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid var(--border);
  background: var(--background); color: var(--foreground); font-size: 0.875rem;
  font-weight: 500; cursor: pointer; transition: all .1s;
}
.dialog-btn:hover { background: var(--muted); }
.dialog-btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.dialog-btn.primary:hover { background: #262626; }
.dialog-btn.destructive { background: var(--destructive); color: var(--destructive-foreground); border-color: var(--destructive); }
.dialog-btn.destructive:hover { background: #dc2626; }

/* ============ Toast ============ */
.toast {
  position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(8px);
  background: var(--foreground); color: var(--background);
  padding: 0.625rem 1rem; border-radius: var(--radius);
  font-size: 0.875rem; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none; transition: all .2s ease;
  z-index: 99; max-width: 80vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ Scroll to Bottom ============ */
.scroll-btn {
  position: fixed; bottom: 8rem; left: 50%; transform: translateX(-50%);
  width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--border);
  background: var(--background); color: var(--muted-foreground);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--shadow); transition: all .15s;
  z-index: 10; opacity: 0; pointer-events: none;
}
.scroll-btn.show { opacity: 1; pointer-events: auto; }
.scroll-btn:hover { background: var(--muted); color: var(--foreground); }

/* ============ Mobile ============ */
@media (max-width: 640px) {
  .app { height: 100vh; height: 100dvh; }
  .chat-area { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .chat-inner { padding: 0.75rem; gap: 0.75rem; }
  .input-area {
    flex-shrink: 0;
    padding: 0 0.5rem 0.75rem;
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
  }
  .input-textarea { min-height: 3.5rem; max-height: 40vh; padding: 0.75rem 1rem 0.375rem; font-size: 16px; }
  .starter-grid { grid-template-columns: 1fr; }
  .msg-body { max-width: 90%; }
  .scroll-btn { bottom: 10rem; }
  .empty-state { min-height: min(400px, calc(100dvh - 14rem)); }
}
</style>
</head>
<body>

<div class="app">
  <!-- Chat Area -->
  <div class="chat-area" id="chat-area">
    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-card">
        <div class="empty-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </div>
        <h2>开始对话</h2>
        <p>直接输入消息，自动使用后台配置的模型进行回复</p>
        <div class="starter-grid">
          <button class="starter-btn" onclick="sendPrompt('分析一段销售数据，找出趋势并给出可视化建议')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            分析数据
          </button>
          <button class="starter-btn" onclick="sendPrompt('请帮我总结以下内容的核心要点：')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            总结文本
          </button>
          <button class="starter-btn" onclick="sendPrompt('用 Python 写一个快速排序算法，并解释时间复杂度')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            写代码
          </button>
          <button class="starter-btn" onclick="sendPrompt('给我一些关于提升工作效率的实用建议')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            获取建议
          </button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-inner" id="messages" style="display:none"></div>
  </div>

  <!-- Scroll to bottom button -->
  <button class="scroll-btn" id="scroll-btn" onclick="scrollToBottom()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-area-inner">
      <div class="input-box">
        <textarea class="input-textarea" id="input" placeholder="输入消息..." rows="1"></textarea>
        <div class="input-footer">
          <div class="input-tools">
            <button class="tool-btn danger" id="btn-clear" onclick="clearChat()" title="清空对话" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
          <button class="send-btn" id="send-btn" onclick="handleSend()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <span>发送</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="dialog-overlay" id="confirm-dialog" hidden>
  <div class="dialog">
    <h3>清空对话？</h3>
    <p>当前对话记录将被清除，此操作不可撤销。</p>
    <div class="dialog-actions">
      <button class="dialog-btn" onclick="closeConfirm()">取消</button>
      <button class="dialog-btn destructive" id="confirm-ok" onclick="confirmAction()">清空</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ State ============ */
let history = [];
let busy = false;
let streamEl = null;
let abortCtrl = null;
let confirmCb = null;

/* ============ Utils ============ */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show';
  setTimeout(()=>{ t.className = 'toast'; }, 2500);
}

/* ============ Scroll ============ */
function scrollToBottom() {
  $('chat-area').scrollTo({ top: $('chat-area').scrollHeight, behavior: 'smooth' });
}
$('chat-area').addEventListener('scroll', () => {
  const el = $('chat-area');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 100;
  $('scroll-btn').classList.toggle('show', !atBottom && history.length > 0);
});

/* ============ Markdown ============ */
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMd(src) {
  const lines = String(src).split('\n');
  let out = '', listBuf = [], inTable = false;
  const flushList = () => { if (listBuf.length) { out += '<ul>' + listBuf.join('') + '</ul>'; listBuf = []; } };
  const flushTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) { flushList(); flushTable(); const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; continue; }
    if (/^\s*[-*] /.test(line)) { flushTable(); listBuf.push('<li>' + inlineMd(line.replace(/^\s*[-*] /, '')) + '</li>'); i++; continue; }
    flushList();
    if (/^\|/.test(line)) {
      const cells = line.split('|').filter((_,idx,arr) => idx>0 && idx<arr.length-1).map(c => c.trim());
      if (cells.length && /^[-:\s|]+$/.test(line.replace(/\|/g,'').trim())) { i++; continue; }
      if (!inTable) { out += '<table><thead><tr>' + cells.map(c => '<th>'+inlineMd(c)+'</th>').join('') + '</tr></thead><tbody>'; inTable = true; }
      else { out += '<tr>' + cells.map(c => '<td>'+inlineMd(c)+'</td>').join('') + '</tr>'; }
      i++; continue;
    }
    flushTable();
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out += '<h'+(h[1].length)+'>'+inlineMd(h[2])+'</h'+(h[1].length)+'>'; i++; continue; }
    if (/^>\s?/.test(line)) { out += '<blockquote>'+inlineMd(line.replace(/^>\s?/,''))+'</blockquote>'; i++; continue; }
    if (!line.trim()) { out += '<div class="md-gap"></div>'; i++; continue; }
    out += '<p>'+inlineMd(line)+'</p>'; i++;
  }
  flushList(); flushTable(); return out;
}

/* ============ Chat ============ */
function sendPrompt(text) {
  $('input').value = text;
  handleSend();
}
function clearChat() {
  $('confirm-dialog').hidden = false;
}
function closeConfirm() { $('confirm-dialog').hidden = true; confirmCb = null; }
function confirmAction() {
  history = [];
  $('messages').innerHTML = '';
  $('messages').style.display = 'none';
  $('empty-state').style.display = '';
  $('btn-clear').disabled = true;
  closeConfirm();
  toast('对话已清空');
}

function appendMsg(role, content) {
  $('empty-state').style.display = 'none';
  $('messages').style.display = '';
  $('btn-clear').disabled = false;
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatarLabel = role === 'user' ? '你' : 'AI';
  const bubble = content ? renderMd(content) : '';
  if (role === 'user') {
    div.innerHTML = '<div class="msg-avatar">'+avatarLabel+'</div><div class="msg-body"><div class="msg-content">'+esc(content)+'</div></div>';
  } else {
    div.innerHTML = '<div class="msg-avatar">'+avatarLabel+'</div><div class="msg-body"><div class="msg-content md">'+bubble+'</div>'
      +'<div class="msg-actions">'
      +'<button class="msg-action" onclick="copyMsg(this)">复制</button>'
      +'<button class="msg-action" onclick="regenerate()">重新生成</button>'
      +'</div></div>';
  }
  $('messages').appendChild(div);
  scrollToBottom();
  return role === 'assistant' ? div.querySelector('.msg-content') : null;
}

function updateStream(text, done) {
  if (!streamEl) return;
  streamEl.innerHTML = renderMd(text) + (done ? '' : '<span class="cursor-blink"></span>');
  scrollToBottom();
}

function copyMsg(btn) {
  const content = btn.closest('.msg-body').querySelector('.msg-content');
  navigator.clipboard.writeText(content.textContent).then(() => toast('已复制'));
}

function regenerate() {
  if (busy || history.length < 2) return;
  history.pop();
  const msgs = $('messages').children;
  if (msgs.length) msgs[msgs.length - 1].remove();
  if (!history.length) {
    $('messages').innerHTML = '';
    $('messages').style.display = 'none';
    $('empty-state').style.display = '';
    $('btn-clear').disabled = true;
  }
  runStream(history.slice());
}

/* ============ Send / Stream ============ */
function handleSend() {
  if (busy) { abortStream(); return; }
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  autoResize();
  history.push({ role: 'user', content: text });
  appendMsg('user', text);
  streamEl = appendMsg('assistant', '');
  busy = true;
  setSendBtn(true);
  runStream(history.slice());
}

async function runStream(msgs) {
  if (!streamEl) { streamEl = appendMsg('assistant', ''); busy = true; setSendBtn(true); }
  let ctrl = null;
  try {
    ctrl = new AbortController();
    abortCtrl = ctrl;
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ station_id: '', model: '', messages: msgs }),
      signal: ctrl.signal,
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', errMsg = null, done = false;
    while (!done) {
      const { done: d, value } = await reader.read();
      if (d) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') { done = true; break; }
        let evt;
        try { evt = JSON.parse(payload); } catch(e) { continue; }
        if (evt.error) { errMsg = evt.error.message || '未知错误'; done = true; break; }
        const delta = evt.choices?.[0]?.delta?.content;
        if (delta) { full += delta; updateStream(full, false); }
      }
    }
    if (errMsg) {
      streamEl.innerHTML = '<div class="msg-error">⚠ '+esc(errMsg)+'</div>';
    } else {
      history.push({ role: 'assistant', content: full });
      updateStream(full, true);
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      streamEl.innerHTML = '<div class="msg-error">⚠ 请求失败，请检查后台中转站配置</div>';
    }
  }
  busy = false; setSendBtn(false); streamEl = null; abortCtrl = null;
}

function abortStream() { if (abortCtrl) abortCtrl.abort(); }

function setSendBtn(stopping) {
  const btn = $('send-btn');
  if (stopping) {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg><span>停止</span>';
    btn.className = 'send-btn stop';
  } else {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><span>发送</span>';
    btn.className = 'send-btn';
  }
}

/* ============ Textarea ============ */
function autoResize() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 192) + 'px';
}
$('input').addEventListener('input', autoResize);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); handleSend(); }
});
</script>
