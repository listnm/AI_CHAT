<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>账号池管理</title>
<script>
    // 尽早应用已保存的主题，避免闪烁
    (function() {
        try {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
    })();
</script>
<style>
:root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;
    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;
    --info:#0ea5e9;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --bg:#f8fafc;
    --card:#ffffff;
    --soft:#f3f4f6;
    --shadow:0 8px 30px rgba(15,23,42,.08);
    --radius:16px;
    --header-grad:linear-gradient(135deg,#6366f1,#8b5cf6);
    --input-bg:#ffffff;
    --focus-ring:0 0 0 3px rgba(99,102,241,.12);
    color-scheme:light;
}
/* ===== 深色模式 ===== */
[data-theme="dark"]{
    --primary:#2dd4a8;
    --primary-dark:#26b891;
    --success:#2dd4a8;
    --danger:#f87171;
    --warning:#fbbf24;
    --info:#38bdf8;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --border:#1e2d3d;
    --bg:#0a0f14;
    --card:#141d2a;
    --soft:#1a2435;
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --radius:16px;
    --header-grad:linear-gradient(135deg,#0f1620,#141d2a);
    --input-bg:#0f1620;
    --focus-ring:0 0 0 3px rgba(45,212,168,.15);
    color-scheme:dark;
}
*{
    box-sizing:border-box;
}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}
/* =========================
   Header
========================= */
.header{
    background:var(--header-grad);
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:50;
    transition:background .3s ease;
}
.header-inner{
    max-width:1280px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:800;
}
.title-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:rgba(255,255,255,.18);
    display:grid;
    place-items:center;
}
.header-actions{
    display:flex;
    gap:8px;
}
.header-btn{
    border:0;
    border-radius:9px;
    background:rgba(255,255,255,.15);
    color:#fff;
    padding:8px 12px;
    cursor:pointer;
}
/* =========================
   Container
========================= */
.container{
    max-width:1280px;
    margin:auto;
    padding:20px;
}
/* =========================
   Message
========================= */
.message{
    display:none;
    padding:11px 14px;
    border-radius:10px;
    margin-bottom:14px;
    font-size:13px;
    font-weight:600;
}
.message.show{
    display:block;
}
.message.success{
    background:rgba(16,185,129,.12);
    color:var(--success);
}
.message.error{
    background:rgba(239,68,68,.12);
    color:var(--danger);
}
.message.info{
    background:rgba(99,102,241,.12);
    color:var(--primary);
}
/* =========================
   Stats
========================= */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:18px;
}
.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    box-shadow:var(--shadow);
}
.stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}
.stat-value{
    font-size:26px;
    font-weight:800;
    margin-top:5px;
}
/* =========================
   Toolbar
========================= */
.toolbar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
}
.search{
    flex:1;
    min-width:220px;
}
.input,
.select,
.textarea{
    width:100%;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
}
.input:focus,
.select:focus,
.textarea:focus{
    border-color:var(--primary);
    box-shadow:var(--focus-ring);
}
/* =========================
   Buttons
========================= */
.btn{
    border:0;
    border-radius:10px;
    padding:9px 13px;
    min-height:38px;
    font-size:13px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
}
.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}
.btn-primary{
    background:var(--primary);
    color:#fff;
}
.btn-primary:hover{
    background:var(--primary-dark);
}
.btn-outline{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}
.btn-success{
    background:var(--success);
    color:#fff;
}
.btn-danger{
    background:var(--danger);
    color:#fff;
}
.btn-info{
    background:var(--info);
    color:#fff;
}
.btn-warning{
    background:var(--warning);
    color:#fff;
}
/* =========================
   Account Panel
========================= */
.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}
.panel-head{
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}
.panel-title{
    font-size:17px;
    font-weight:800;
}
/* =========================
   Table
========================= */
.table-wrap{
    overflow:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}
th,
td{
    text-align:left;
    padding:13px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
}
th{
    background:var(--soft);
    color:var(--muted);
    font-size:11px;
    font-weight:800;
}
td{
    font-size:13px;
}
.account-name{
    font-weight:800;
}
.meta{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    word-break:break-all;
}
/* =========================
   Badge
========================= */
.badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}
.badge-newapi{
    background:rgba(245,158,11,.13);
    color:var(--warning);
}
.badge-sub2api{
    background:rgba(14,165,233,.12);
    color:var(--info);
}
.badge-success{
    background:rgba(16,185,129,.13);
    color:var(--success);
}
.badge-muted{
    background:var(--soft);
    color:var(--muted);
}
/* =========================
   Group Selector
========================= */
.group-box{
    min-width:260px;
}
.group-selector{
    display:flex;
    align-items:center;
    gap:7px;
}
.group-selector .select{
    min-width:210px;
}
.group-current{
    margin-top:5px;
    font-size:10px;
    color:var(--muted);
}
.group-current strong{
    color:var(--primary);
}
.group-note{
    margin-top:3px;
    font-size:10px;
    color:var(--muted);
}
.group-count{
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
}
/* =========================
   Actions
========================= */
.actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.actions .btn{
    min-height:31px;
    padding:6px 9px;
    font-size:12px;
}
/* =========================
   Mobile Card
========================= */
.mobile-cards{
    display:none;
    padding:12px;
    gap:12px;
    flex-direction:column;
}
.mobile-card{
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    background:var(--card);
}
.mobile-card-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
    margin-bottom:12px;
}
.mobile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.mobile-field-label{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    margin-bottom:4px;
}
.mobile-field-value{
    font-size:13px;
    word-break:break-all;
}
.mobile-group{
    grid-column:1/-1;
    background:var(--soft);
    padding:11px;
    border-radius:11px;
}
.mobile-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:13px;
}
/* =========================
   Modal
========================= */
.modal-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:14px;
}
.modal-mask.show{
    display:flex;
}
.modal{
    width:min(900px,100%);
    max-height:90vh;
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
    display:flex;
    flex-direction:column;
}
.modal-header{
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.modal-title{
    font-weight:800;
    font-size:17px;
}
.modal-close{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:25px;
    cursor:pointer;
}
.modal-body{
    padding:18px;
    overflow:auto;
}
.modal-footer{
    padding:13px 18px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}
/* =========================
   Group Detail
========================= */
.group-info{
    background:var(--soft);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
}
.group-info-title{
    font-weight:800;
    margin-bottom:6px;
}
.group-info-note{
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
}
.group-detail{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:9px;
}
.group-detail-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.group-detail-name{
    font-weight:800;
}
.group-detail-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}
/* =========================
   Empty
========================= */
.empty{
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
}
/* =========================
   Responsive
========================= */
@media(max-width:850px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
    .table-wrap{
        display:none;
    }
    .mobile-cards{
        display:flex;
    }
    .container{
        padding:13px;
    }
    .header{
        padding:13px;
    }
}
@media(max-width:560px){
    .stats{
        gap:8px;
    }
    .stat{
        padding:12px;
    }
    .stat-value{
        font-size:21px;
    }
    .search{
        min-width:100%;
    }
    .mobile-grid{
        grid-template-columns:1fr 1fr;
    }
    .mobile-actions{
        grid-template-columns:1fr 1fr 1fr;
    }
}
/* =========================
   Polish（主题过渡 / 悬停反馈）
========================= */
body{
    transition:background .25s ease, color .25s ease;
}
.btn{
    transition:transform .12s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.btn:active:not(:disabled){
    transform:scale(.96);
}
.btn-primary:hover{
    box-shadow:0 4px 14px rgba(99,102,241,.35);
}
[data-theme="dark"] .btn-primary:hover{
    box-shadow:0 4px 14px rgba(45,212,168,.3);
}
.btn-outline:hover{
    border-color:var(--primary);
    color:var(--primary);
}
.header-btn{
    transition:background .18s ease, transform .12s ease;
}
.header-btn:hover{
    background:rgba(255,255,255,.26);
}
.stat{
    transition:transform .18s ease, box-shadow .18s ease, background .25s ease, border-color .25s ease;
}
.stat:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(15,23,42,.12);
}
[data-theme="dark"] .stat:hover{
    box-shadow:0 10px 28px rgba(0,0,0,.4);
}
.stat-value{
    transition:color .25s ease;
}
.stat-value[id="statBalance"]{
    color:var(--primary);
}
.panel,
.toolbar,
.mobile-card{
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.modal{
    transition:background .25s ease, border-color .25s ease;
}
</style>
</head>
<body>
<header class="header">
    <div class="header-inner">
    <div class="title">
        <div class="title-icon">🗂️</div>
        <div>账号池管理</div>
    </div>
    <div class="header-actions">
        <button class="header-btn" id="themeToggle" title="切换深浅模式" onclick="toggleTheme()">🌙</button>
        <button class="header-btn" onclick="backToAdmin()">🛠️ 后台管理</button>
    </div>
</div>
</header>
<main class="container">
<div id="pageMessage" class="message"></div>
<!-- 统计 -->
<section class="stats">
    <div class="stat">
        <div class="stat-label">账号总数</div>
        <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">总余额</div>
        <div class="stat-value" id="statBalance">¥0.00</div>
    </div>
    <div class="stat">
        <div class="stat-label">Sub2API</div>
        <div class="stat-value" id="statSub2API">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">NewAPI</div>
        <div class="stat-value" id="statNewAPI">0</div>
    </div>
</section>
<!-- 工具栏 -->
<section class="toolbar">
    <input
        id="searchInput"
        class="input search"
        placeholder="搜索名称、地址、用户名、当前分组…"
        oninput="renderAccounts()"
    >
    <select
        id="typeFilter"
        class="select"
        style="width:150px"
        onchange="renderAccounts()"
    >
        <option value="">全部类型</option>
        <option value="sub2api">Sub2API</option>
        <option value="newapi">NewAPI</option>
    </select>
    <button
        id="refreshButton"
        class="btn btn-outline"
        onclick="loadAccounts(true)"
    >
        🔄 刷新列表
    </button>
    <button
        id="refreshAllButton"
        class="btn btn-info"
        onclick="refreshAll()"
    >
        ⚡ 全部刷新
    </button>
    <button
        class="btn btn-primary"
        onclick="openAddAccount()"
    >
        ＋ 添加账号
    </button>
</section>
<!-- 账号列表 -->
<section class="panel">
    <div class="panel-head">
        <div class="panel-title">
            账号列表
        </div>
        <span
            id="listCount"
            class="badge badge-muted"
        >
            0 个
        </span>
    </div>
    <!-- PC -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>账号</th>
                    <th>类型</th>
                    <th>余额</th>
                    <th>当前分组</th>
                    <th>更新时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="accountTableBody"></tbody>
        </table>
    </div>
    <!-- Mobile -->
    <div
        id="mobileCards"
        class="mobile-cards"
    ></div>
</section>
</main>
<!-- Modal -->
<div
    id="modalMask"
    class="modal-mask"
    onclick="closeModalByBackdrop(event)"
>
<div class="modal">
    <div class="modal-header">
        <div
            id="modalTitle"
            class="modal-title"
        >
            窗口
        </div>
        <button
            class="modal-close"
            onclick="closeModal()"
        >
            ×
        </button>
    </div>
    <div
        id="modalBody"
        class="modal-body"
    ></div>
    <div
        id="modalFooter"
        class="modal-footer"
    ></div>
</div>
</div>
<script>
/* =========================================================
   状态
========================================================= */
let accounts = [];
let currentAccountId = null;
const busyActions = new Set();
/* =========================================================
   工具
========================================================= */
function escapeHtml(value){
    return String(value ?? '')
        .replace(/[&<>"']/g, function(char){
            return {
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#39;'
            }[char];
        });
}
function money(value){
    if(
        value === null ||
        value === undefined ||
        value === ''
    ){
        return '—';
    }
    const number = Number(value);
    if(!Number.isFinite(number)){
        return '—';
    }
    return '¥' + number.toFixed(2);
}
function formatTime(value){
    if(!value){
        return '—';
    }
    try{
        return new Date(value)
            .toLocaleString(
                'zh-CN',
                {
                    hour12:false
                }
            );
    }catch(error){
        return String(value);
    }
}
/* =========================================================
   消息
========================================================= */
function showMessage(
    text,
    type = 'success'
){
    const element =
        document.getElementById(
            'pageMessage'
        );
    element.textContent = text;
    element.className =
        'message show ' + type;
    clearTimeout(
        showMessage.timer
    );
    showMessage.timer =
        setTimeout(
            function(){
                element.className =
                    'message';
            },
            5000
        );
}
/* =========================================================
   API
========================================================= */
async function apiRequest(
    url,
    method = 'GET',
    body = undefined
){
    const options = {
        method,
        credentials:'same-origin',
        headers:{
            'Accept':'application/json'
        }
    };
    if(body !== undefined){
        options.headers[
            'Content-Type'
        ] = 'application/json';
        options.body =
            JSON.stringify(body);
    }
    const response =
        await fetch(
            url,
            options
        );
    let data = null;
    try{
        data =
            await response.json();
    }catch(error){}
    if(!response.ok){
        throw new Error(
            data?.message ||
            data?.error ||
            `HTTP ${response.status}`
        );
    }
    if(
        data &&
        data.ok === false
    ){
        throw new Error(
            data.message ||
            data.error ||
            '操作失败'
        );
    }
    return data || {};
}
/* =========================================================
   防止重复点击
========================================================= */
async function runButtonAction(
    key,
    button,
    callback
){
    if(
        busyActions.has(key)
    ){
        return;
    }
    busyActions.add(key);
    let oldText = '';
    if(button){
        oldText =
            button.innerHTML;
        button.disabled = true;
        button.innerHTML =
            '⏳ 处理中…';
    }
    try{
        return await callback();
    }finally{
        busyActions.delete(key);
        if(button){
            button.disabled = false;
            button.innerHTML =
                oldText;
        }
    }
}
/* =========================================================
   加载账号
========================================================= */
async function loadAccounts(
    showFeedback = false
){
    const button =
        document.getElementById(
            'refreshButton'
        );
    await runButtonAction(
        'load-accounts',
        button,
        async function(){
            try{
                if(showFeedback){
                    showMessage(
                        '正在刷新账号列表…',
                        'info'
                    );
                }
                const data =
                    await apiRequest(
                        '/api/pool/accounts'
                    );
                accounts =
                    data.accounts ||
                    data.items ||
                    [];
                updateStatistics();
                renderAccounts();
                if(showFeedback){
                    showMessage(
                        `账号列表已刷新，共 ${accounts.length} 个账号`
                    );
                }
            }catch(error){
                showMessage(
                    '读取账号池失败：' +
                    error.message,
                    'error'
                );
            }
        }
    );
}
/* =========================================================
   统计
========================================================= */
function updateStatistics(){
    document.getElementById(
        'statTotal'
    ).textContent =
        accounts.length;
    document.getElementById(
        'statSub2API'
    ).textContent =
        accounts.filter(
            account =>
                account.pool_type === 'sub2api'
        ).length;
    document.getElementById(
        'statNewAPI'
    ).textContent =
        accounts.filter(
            account =>
                account.pool_type === 'newapi'
        ).length;
    const totalBalance =
        accounts.reduce(
            function(total, account){
                return total +
                    (Number(account.balance) || 0);
            },
            0
        );
    document.getElementById(
        'statBalance'

/* =========================================================
   搜索
========================================================= */
function getFilteredAccounts(){
    const keyword =
        (
            document.getElementById(
                'searchInput'
            ).value || ''
        )
        .toLowerCase()
        .trim();
    const type =
        document.getElementById(
            'typeFilter'
        ).value;
    return accounts.filter(
        function(account){
            if(
                type &&
                account.pool_type !== type
            ){
                return false;
            }
            if(!keyword){
                return true;
            }
            const text = [
                account.name,
                account.base_url,
                account.username,
                account.remark,
                account.selected_group
            ]
            .map(value =>
                String(value || '')
                    .toLowerCase()
            )
            .join(' ');
            return text.includes(
                keyword
            );
        }
    );
}
/* =========================================================
   分组处理
========================================================= */
function normalizeGroups(
    groups
){
    const result = [];
    const map = new Map();
    function addGroup(group){
        if(!group){
            return;
        }
        const name =
            group.name ||
            group.group_name;
        if(!name){
            return;
        }
        const key =
            String(
                group.id ??
                name
            );
        if(
            !map.has(key)
        ){
            map.set(
                key,
                {
                    id:
                        group.id ??
                        name,
                    name:name,
                    description:
                        group.description || '',
                    rate_multiplier:
                        group.rate_multiplier
                }
            );
        }
    }
    function walk(group){
        if(!group){
            return;
        }
        if(
            !group.is_channel_group
        ){
            addGroup(group);
        }
        if(
            Array.isArray(
                group.sub_groups
            )
        ){
            group.sub_groups.forEach(
                walk
            );
        }
    }
    if(
        Array.isArray(groups)
    ){
        groups.forEach(
            walk
        );
    }
    return Array.from(
        map.values()
    );
}
/*
 * 这里非常关键：
 *
 * group_options 优先。
 *
 * 如果后端已经给了：
 *
 * account.group_options
 *
 * 就直接使用。
 *
 * 否则从 groups 兼容提取。
 */
function getGroupOptions(
    account
){
    if(
        Array.isArray(
            account.group_options
        ) &&
        account.group_options.length
    ){
        return account.group_options;
    }
    if(
        Array.isArray(
            account.all_group_options
        ) &&
        account.all_group_options.length
    ){
        return account.all_group_options;
    }
    return normalizeGroups(
        account.groups || []
    );
}

/* =========================================================
   切换账号池当前分组
========================================================= */
async function changeSelectedGroup(
    accountId,
    selectElement
){
    const groupName =
        selectElement.value;
    if(!groupName){
        return;
    }
    const account =
        accounts.find(
            item =>
                String(item.id) ===
                String(accountId)
        );
    const oldGroup =
        account
            ? account.selected_group
            : '';
    selectElement.disabled =
        true;
    showMessage(
        `正在切换到「${groupName}」…`,
        'info'
    );
    try{
        /*
         * 这里调用的是：
         *
         * /select-group
         *
         * 后端会保存账号池自己的 selected_group，并把当前使用的
         * API Key 远程移动到目标分组（new-api: PUT /api/token/），
         * 确保中转站那边同步生效。
         */
        const result =
            await apiRequest(
                `/api/pool/accounts/${encodeURIComponent(accountId)}/select-group`,
                'POST',
                {
                    group_name:
                        groupName
                }
            );
        if(account){
            account.selected_group =
                groupName;
        }
        renderAccounts();
        showMessage(
            result.message ||
            `✓ 已切换到「${groupName}」`,
            'success'
        );
    }catch(error){
        /*
         * 恢复旧选择
         */
        selectElement.value =
            oldGroup || '';
        showMessage(
            '分组切换失败：' +
            error.message,
            'error'
        );
    }finally{
        selectElement.disabled =
            false;
    }
}
/* =========================================================
   从弹窗切换分组
========================================================= */
async function switchGroupFromModal(
    accountId
){
    const select =
        document.getElementById(
            'modalGroupSelect'
        );
    if(!select){
        return;
    }
    const groupName =
        select.value;
    if(!groupName){
        showMessage(
            '请选择一个分组',
            'error'
        );
        return;
    }
    const account =
        accounts.find(
            item =>
                String(item.id) ===
                String(accountId)
        );
    const oldGroup =
        account
            ? account.selected_group
            : '';
    select.disabled = true;
    showMessage(
        `正在切换到「${groupName}」…`,
        'info'
    );
    try{
        const result =
            await apiRequest(
                `/api/pool/accounts/${encodeURIComponent(accountId)}/select-group`,
                'POST',
                {
                    group_name:
                        groupName
                }
            );
        if(account){
            account.selected_group =
                groupName;
        }
        renderAccounts();
        showMessage(
            result.message ||
            `✓ 已切换到「${groupName}」`,
            'success'
        );
        /*
         * 刷新弹窗内容，保持最新状态
         */
        await showGroupDetails(
            accountId
        );
    }catch(error){
        select.value =
            oldGroup || '';
        showMessage(
            '分组切换失败：' +
            error.message,
            'error'
        );
        select.disabled = false;
    }
}

async function deleteAccount(
    id
){
    const account =
        accounts.find(
            item =>
                String(item.id) ===
                String(id)
        );
    if(!account){
        return;
    }
    if(
        !confirm(
            `确定删除账号「${account.name}」吗？\n\n此操作不可恢复。`
        )
    ){
        return;
    }
    try{
        showMessage(
            '正在删除账号…',
            'info'
        );
        await apiRequest(
            `/api/pool/accounts/${encodeURIComponent(id)}`,
            'DELETE'
        );
        showMessage(
            '✓ 账号已删除',
            'success'
        );
        await loadAccounts(
            false
        );
    }catch(error){
        showMessage(
            '删除失败：' +
            error.message,
            'error'
        );
    }
}

/* =========================================================
Modal
========================================================= */

function openModal(
title,
body,
footer
){

document.getElementById(
    'modalTitle'
).innerHTML =
    title;
document.getElementById(
    'modalBody'
).innerHTML =
    body;
document.getElementById(
    'modalFooter'
).innerHTML =
    footer || '';
document.getElementById(
    'modalMask'
).classList.add(
    'show'
);

}

function closeModal(){

document.getElementById(
    'modalMask'
).classList.remove(
    'show'
);
currentAccountId =
    null;

}

function closeModalByBackdrop(
event
){

if(
    event.target.id ===
    'modalMask'
){
    closeModal();
}

}

/* =========================================================
主题
========================================================= */

function applyThemeIcon(){
    var dark =
        document.documentElement.getAttribute('data-theme') ===
        'dark';
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = dark ? '☀️' : '🌙';
        btn.title = dark ? '切换到浅色模式' : '切换到深色模式';
    }
}

function toggleTheme(){

var dark =
    document.documentElement.getAttribute('data-theme') ===
    'dark';
var next = dark ? 'light' : 'dark';
document.documentElement.setAttribute(
    'data-theme',
    next
);
try {
    localStorage.setItem('theme', next);
} catch (e) {}
applyThemeIcon();

}

document.addEventListener('DOMContentLoaded', applyThemeIcon);
