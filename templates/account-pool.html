<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>账号池管理 - Sub2API / NewAPI</title>
    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch(e) {}
        })();
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --info: #0ea5e9;
            --info-light: #f0f9ff;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --border-light: #f3f4f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --header-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --input-bg: #fafbfc;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            color-scheme: light;
        }

        /* ===== 深色模式 ===== */
        [data-theme="dark"] {
            --primary: #2dd4a8;
            --primary-hover: #26b891;
            --primary-light: rgba(45, 212, 168, 0.12);
            --success: #2dd4a8;
            --success-light: rgba(45, 212, 168, 0.12);
            --danger: #f87171;
            --danger-light: rgba(248, 113, 113, 0.12);
            --warning: #fbbf24;
            --warning-light: rgba(251, 191, 36, 0.12);
            --info: #38bdf8;
            --info-light: rgba(56, 189, 248, 0.12);
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e2d3d;
            --border-light: #1a2435;
            --bg: #0a0f14;
            --card: #141d2a;
            --header-grad: linear-gradient(135deg, #0f1620 0%, #141d2a 100%);
            --input-bg: #0f1620;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -4px rgba(0,0,0,0.3);
            color-scheme: dark;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ===== 顶部导航 ===== */
        .admin-header {
            background: var(--header-grad);
            padding: 20px 24px;
            color: white;
            border-bottom: 1px solid var(--border);
        }
        .admin-header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-title-icon {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .admin-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-nav a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .admin-nav a:hover { color: white; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            font-family: inherit;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        /* ===== 容器 ===== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title-icon {
            font-size: 20px;
        }

        /* ===== 统计概览卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .stat-value .unit {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-left: 4px;
        }
        .stat-icon {
            float: right;
            font-size: 32px;
            opacity: 0.35;
        }
        .stat-sub {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .stat-card.total { border-left: 4px solid var(--primary); }
        .stat-card.balance { border-left: 4px solid var(--success); }
        .stat-card.sub2api { border-left: 4px solid var(--info); }
        .stat-card.newapi { border-left: 4px solid var(--warning); }

        /* ===== 按钮 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
            line-height: 1.4;
            min-height: 36px;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover:not(:disabled) {
            background: #059669;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(239,68,68,0.3);
        }
        .btn-outline {
            background: var(--card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover:not(:disabled) {
            background: var(--border-light);
            color: var(--text);
        }
        .btn-info { background: var(--info); color: white; }
        .btn-info:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(14,165,233,0.3);
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 30px; }
        .btn-lg { padding: 12px 24px; font-size: 15px; min-height: 44px; }
        .btn-block { width: 100%; }

        /* ===== 输入框 ===== */
        .input, .select, .textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }
        .textarea { resize: vertical; min-height: 80px; }
        .input:focus, .select:focus, .textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .input::placeholder { color: var(--text-muted); }
        .input-mono {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
        }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-row .form-group { flex: 1; min-width: 160px; margin-bottom: 0; }

        /* ===== 标签/徽章 ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-sub2api { background: var(--info-light); color: var(--info); }
        .badge-newapi { background: var(--warning-light); color: var(--warning); }
        .badge-active { background: var(--success-light); color: var(--success); }
        .badge-inactive { background: var(--border-light); color: var(--text-muted); }
        .balance-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        .balance-badge.high { background: var(--success-light); color: var(--success); }
        .balance-badge.mid { background: var(--warning-light); color: var(--warning); }
        .balance-badge.low { background: var(--danger-light); color: var(--danger); }
        .balance-badge.none { background: var(--border-light); color: var(--text-muted); font-weight: 500; }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-box {
            position: relative;
            min-width: 220px;
        }
        .search-box input {
            padding-left: 36px;
        }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 0.6;
        }

        /* ===== 添加账号表单区域 ===== */
        .add-section {
            background: var(--border-light);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 24px;
        }
        .add-section.collapsed .add-form { display: none; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-toggle {
            font-size: 14px;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }
        .add-section.collapsed .section-toggle { transform: rotate(-90deg); }
        .type-tabs {
            display: inline-flex;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .type-tab {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: inherit;
        }
        .type-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        /* ===== 账号列表表格 ===== */
        .pool-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }
        .pool-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
        }
        .pool-table thead { background: var(--border-light); }
        .pool-table th {
            padding: 14px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        .pool-table td {
            padding: 14px 16px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-light);
        }
        .pool-table tbody tr { transition: background 0.2s; }
        .pool-table tbody tr:hover { background: var(--input-bg); }
        .pool-name {
            font-weight: 700;
            color: var(--text);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .pool-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pool-meta code {
            font-family: 'SF Mono', Monaco, monospace;
            background: var(--border-light);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .group-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 320px;
        }
        .group-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .group-chip.more {
            background: var(--border-light);
            color: var(--text-muted);
        }
        .updated-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* ===== 手机端卡片视图 ===== */
        .pool-cards {
            display: none;
            flex-direction: column;
            gap: 14px;
        }
        .pool-card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .pool-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }
        .pool-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-bottom: 14px;
        }
        .pool-card-field-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .pool-card-field-value {
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
        }
        .pool-card-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* ===== 消息提示 ===== */
        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        .msg-success { display: block; background: var(--success-light); color: #065f46; border: 1px solid #a7f3d0; }
        .msg-fail { display: block; background: var(--danger-light); color: #991b1b; border: 1px solid #fecaca; }
        .msg-info { display: block; background: var(--primary-light); color: #3730a3; border: 1px solid #c7d2fe; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state-text { font-size: 15px; margin-bottom: 8px; }
        .empty-state-sub { font-size: 12px; }

        /* ===== 分组详情弹窗 ===== */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: var(--card);
            border-radius: 18px;
            width: 100%;
            max-width: 820px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .modal-head {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .modal-close:hover { background: var(--border-light); color: var(--text); }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-foot {
            padding: 16px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .group-block {
            background: var(--border-light);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .group-block-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .group-block-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .group-block-count {
            background: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .token-item {
            background: var(--card);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 6px;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .token-item-info {
            flex: 1;
            min-width: 0;
        }
        .token-item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .token-item-meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .token-item-meta code {
            background: var(--border-light);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 10.5px;
        }
        .quota-bar {
            width: 120px;
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .quota-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            border-radius: 3px;
        }

        /* ===== 加载中样式 ===== */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .admin-header { padding: 16px; }
            .admin-header-inner { flex-direction: column; align-items: stretch; }
            .admin-nav { justify-content: space-between; }
            .card { padding: 16px; border-radius: 14px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 20px; }
            .form-row { flex-direction: column; gap: 12px; }
            .form-row .form-group { width: 100%; min-width: auto; }
            .pool-table-wrap { display: none; }
            .pool-cards { display: flex; }
            .pool-card-body { grid-template-columns: 1fr; }
            .pool-card-actions { grid-template-columns: repeat(2, 1fr); }
            .toolbar-right { margin-left: 0; width: 100%; }

</head>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">用户名 <span style="color:var(--danger)">*</span></label>
                            <input type="text" id="newUser" class="input" placeholder="admin / your@email.com">

        <!-- 账号列表 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><span class="card-title-icon">📋</span>账号列表</div>
                <div id="listMsg" class="msg" style="margin-bottom:0;"></div>
            </div>

            <div class="toolbar">
                <button class="btn btn-success" title="对所有账号依次执行：登录、查询余额、查询分组（并发执行，速度更快）" onclick="refreshAll(this)">
                    🔄 批量刷新全部
                </button>
                <div class="toolbar-right">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索名称 / URL / 用户名..." oninput="renderList()">
                    </div>
                </div>
            </div>

            <!-- 电脑端表格 -->
            <div class="pool-table-wrap">
                <table class="pool-table">
                    <thead>
                        <tr>
                            <th style="min-width:240px;">账号</th>
                            <th>余额</th>
                            <th style="min-width:260px;">密钥 / 渠道分组</th>
                            <th style="min-width:260px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="poolTbody">
                    </tbody>
                </table>
            </div>

            <!-- 手机端卡片 -->
            <div class="pool-cards" id="poolCards"></div>

            <div id="emptyState" class="empty-state" style="display:none;">
                <span class="empty-state-icon">📭</span>
                <p class="empty-state-text">暂无账号</p>
                <p class="empty-state-sub">请先在上方添加 Sub2API 或 NewAPI 账号</p>
            </div>
        </div>
    </div>

    <!-- 分组详情弹窗 -->
    <div class="modal-mask" id="groupsModal">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-title">
                    <span>🗂️</span>
                    <span id="modalTitle">分组详情</span>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
            <div class="modal-foot">
                <button class="btn btn-outline" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

<script>
/* ============================================================
 * 全局状态
 * ============================================================ */
const API = '/api/pool';
let state = { accounts: [], addType: 'sub2api' };

/* ============================================================
 * 主题切换
 * ============================================================ */
(function initTheme() {
    const btn = document.getElementById('themeToggle');
    function apply() {
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? '切换到浅色模式' : '切换到深色模式';
    }
    apply();
    btn.onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        apply();
    };
})();

/* ============================================================
 * 工具函数
 * ============================================================ */
function showMsg(id, text, type = 'info') {
    const el = document.getElementById(id);
    el.className = 'msg msg-' + type;
    el.textContent = text;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'msg'; }, 4000);
}

async function req(url, method = 'GET', body = null) {
    const opt = {
        method,
        headers: { 'Content-Type': 'application/json' },
    };
    if (body) opt.body = JSON.stringify(body);
    let r;
    try {
        r = await fetch(url, opt);
    } catch (e) {
        throw new Error('无法连接服务器，请检查网络或服务是否运行（' + e.message + '）');
    }
    const text = await r.text();
    // 尝试解析 JSON
    let data = null;
    let parseOk = false;
    try {
        data = JSON.parse(text);
        parseOk = true;
    } catch (e) {
        parseOk = false;
    }
    // HTTP 错误状态码，优先从 JSON 中提取 message
    if (!r.ok) {
        if (parseOk && data && data.message) {
            throw new Error(data.message);
        }
        if (r.status === 404) {
            throw new Error('接口不存在（404）——服务端可能未更新，请重启服务');
        }
        if (r.status === 401) {
            throw new Error('登录已过期，请重新登录管理员');
        }
        if (r.status >= 500) {
            // 尝试从 HTML 错误页里提取简短信息
            let extra = '';
            if (!parseOk && text) {
                const m = text.match(/<pre>([\s\S]*?)<\/pre>/);
                if (m) extra = '：' + m[1].replace(/<[^>]+>/g, '').trim().slice(0, 200);
                else if (text.length < 300) extra = '：' + text;
            }
            throw new Error('服务器内部错误（' + r.status + '）' + extra);
        }
        throw new Error('服务端返回了非 JSON 响应（HTTP ' + r.status + '）：' + text.slice(0, 120));
    }
    // 成功但返回了 JSON 错误（ok=false）
    if (parseOk && data && data.ok === false && data.message) {
        throw new Error(data.message);
    }
    return parseOk ? data : text;
}

function fmtTime(iso) {
    if (!iso) return '--';
    try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return iso; }
}

function balanceBadge(val) {
    if (val === null || val === undefined || isNaN(val)) {
        return '<span class="balance-badge none">-- 未查询</span>';
    }
    const cls = val > 10 ? 'high' : (val > 1 ? 'mid' : 'low');
    return `<span class="balance-badge ${cls}">💰 ${Number(val).toFixed(2)}</span>`;
}

function typeBadge(type) {
    if (type === 'sub2api') return '<span class="badge badge-sub2api">🔗 Sub2API</span>';
    if (type === 'newapi') return '<span class="badge badge-newapi">🔌 NewAPI</span>';
    return '';
}

function toggleAddSection() {
    document.getElementById('addSection').classList.toggle('collapsed');
}

function switchType(t) {
    state.addType = t;
    document.querySelectorAll('.type-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.type === t);
    });
}

/* ============================================================
 * 添加账号
 * ============================================================ */
async function addAccount() {
    const btn = document.getElementById('addBtn');
    const name = document.getElementById('newName').value.trim();
    const base = document.getElementById('newBase').value.trim();
    const user = document.getElementById('newUser').value.trim();
    const pass = document.getElementById('newPass').value;
    const remark = document.getElementById('newRemark').value.trim();

    if (!name) return showMsg('listMsg', '请填写名称', 'fail');
    if (!base) return showMsg('listMsg', '请填写 Base URL', 'fail');
    if (!user) return showMsg('listMsg', '请填写用户名', 'fail');
    if (!pass) return showMsg('listMsg', '请填写密码', 'fail');

    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> 添加中...';

    try {
        const r = await req(API + '/accounts', 'POST', {
            pool_type: state.addType, name, base_url: base,
            username: user, password: pass, remark,
        });
        if (r.ok) {
            showMsg('pageMsg', r.message, 'success');
            document.getElementById('newName').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('newRemark').value = '';
            await loadList();
        } else {
            showMsg('listMsg', r.message || '添加失败', 'fail');
        }
    } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        showMsg('listMsg', '请求异常：' + msg, 'fail');
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
}

/* ============================================================
 * 加载 & 渲染列表
 * ============================================================ */
async function loadList() {
    try {
        const r = await req(API + '/accounts');
        if (r.ok) {
            state.accounts = r.accounts || [];
            renderStats();
            renderList();
        }
    } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        showMsg('listMsg', '加载失败：' + msg, 'fail');
    }
}

function renderStats() {
    const list = state.accounts;
    document.getElementById('statTotal').innerHTML = `${list.length}<span class="unit">个</span>`;
    const active = list.filter(a => a.status === 'active').length;
    document.getElementById('statTotalSub').textContent = active ? `其中 ${active} 个启用中` : '点击上方添加';

    const balances = list.map(a => a.balance).filter(v => typeof v === 'number' && !isNaN(v));
    const totalBal = balances.reduce((s, v) => s + v, 0);
    if (balances.length) {
        document.getElementById('statBalance').innerHTML = `${totalBal.toFixed(2)}`;
        document.getElementById('statBalanceSub').textContent = `已查询 ${balances.length}/${list.length} 个账号`;
    } else {
        document.getElementById('statBalance').innerHTML = `--`;
        document.getElementById('statBalanceSub').textContent = '暂无余额数据';
    }

    const sub = list.filter(a => a.pool_type === 'sub2api');
    const subBal = sub.map(a => a.balance).filter(v => typeof v === 'number');
    document.getElementById('statSub').innerHTML = `${sub.length}<span class="unit">个</span>`;
    document.getElementById('statSubSub').textContent = subBal.length
        ? `余额合计 ${subBal.reduce((s,v)=>s+v,0).toFixed(2)}` : '点击「刷新」查询';

    const nw = list.filter(a => a.pool_type === 'newapi');
    const nwBal = nw.map(a => a.balance).filter(v => typeof v === 'number');
    document.getElementById('statNew').innerHTML = `${nw.length}<span class="unit">个</span>`;
    document.getElementById('statNewSub').textContent = nwBal.length
        ? `余额合计 ${nwBal.reduce((s,v)=>s+v,0).toFixed(2)}` : '点击「刷新」查询';
}

function filterAccounts() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return state.accounts;
    return state.accounts.filter(a =>
        (a.name || '').toLowerCase().includes(q) ||
        (a.base_url || '').toLowerCase().includes(q) ||
        (a.username || '').toLowerCase().includes(q) ||
        (a.remark || '').toLowerCase().includes(q)
    );
}

function renderList() {
    const list = filterAccounts();
    const empty = document.getElementById('emptyState');
    const tbody = document.getElementById('poolTbody');
    const cards = document.getElementById('poolCards');

    if (!state.accounts.length) {
        empty.style.display = 'block';
        tbody.innerHTML = '';
        cards.innerHTML = '';
        return;
    }
    empty.style.display = 'none';

    if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted);">没有匹配的账号</td></tr>`;
        cards.innerHTML = '';
        return;
    }

    // 表格
    tbody.innerHTML = list.map(a => {
        const groups = a.groups_summary || [];
        const more = (a.groups_count || 0) - groups.length;
        const chips = groups.map(g =>
            `<span class="group-chip">${g.name || '未命名'} · ${g.count || 0}</span>`
        ).join('');
        const moreChip = more > 0 ? `<span class="group-chip more">+${more} 更多</span>` : '';

        return `
        <tr>
            <td>
                <div class="pool-name">
                    ${typeBadge(a.pool_type)}
                    ${escapeHtml(a.name)}
                </div>
                <div class="pool-meta">
                    <code>${escapeHtml(a.username)}</code>
                    <code title="${escapeHtml(a.base_url)}">${escapeHtml(truncate(a.base_url, 38))}</code>
                    ${a.remark ? `<span>📝 ${escapeHtml(truncate(a.remark, 20))}</span>` : ''}
                </div>
            </td>
            <td>
                <div>${balanceBadge(a.balance)}</div>
                <div class="updated-time">${a.balance_updated_at ? '更新于 ' + fmtTime(a.balance_updated_at) : '尚未查询'}</div>
            </td>
            <td>
                <div class="group-chips">
                    ${chips || '<span style="font-size:12px;color:var(--text-muted);">暂无分组数据</span>'}
                    ${moreChip}
                </div>
                <div class="updated-time">
                    ${a.groups_count ? `${a.groups_count} 个分组` : ''}
                    ${a.groups_updated_at ? ' · 更新于 ' + fmtTime(a.groups_updated_at) : ''}
                </div>
            </td>
            <td>
                <div class="row-actions">
                    <button class="btn btn-success btn-sm" title="使用账号密码登录远程平台，获取Token" onclick="loginAccount('${a.id}', this)">🔐 Token</button>
                    <button class="btn btn-info btn-sm" title="查询剩余余额/额度" onclick="refreshBalance('${a.id}', this)">💰 余额</button>
                    <button class="btn btn-primary btn-sm" title="打开分组详情（自动拉取分组）" onclick="showGroups('${a.id}', this)">👁 分组详情</button>
                    <button class="btn btn-danger btn-sm" title="删除账号" onclick="deleteAccount('${a.id}')">🗑️</button>
                </div>
            </td>
        </tr>`;
    }).join('');

    // 卡片（手机）
    cards.innerHTML = list.map(a => {
        const groups = a.groups_summary || [];
        const chips = groups.slice(0, 3).map(g =>
            `<span class="group-chip">${g.name || '未命名'} · ${g.count || 0}</span>`
        ).join('');
        const selKey = a.selected_token_key || '';
        const hasSel = !!(a.selected_group && selKey);
        return `
        <div class="pool-card">
            <div class="pool-card-head">
                <div>
                    <div class="pool-name" style="margin-bottom:6px;">
                        ${typeBadge(a.pool_type)}
                        ${escapeHtml(a.name)}
                    </div>
                    <div class="pool-meta">
                        <code>${escapeHtml(a.username)}</code>
                        <code>${escapeHtml(truncate(a.base_url, 30))}</code>
                    </div>
                </div>
                ${balanceBadge(a.balance)}
            </div>
            <div class="pool-card-body">
                <div>
                    <div class="pool-card-field-label">余额更新</div>
                    <div class="pool-card-field-value">${a.balance_updated_at ? fmtTime(a.balance_updated_at) : '--'}</div>
                </div>
                <div>
                    <div class="pool-card-field-label">分组</div>
                    <div class="pool-card-field-value">${a.groups_count ? a.groups_count + ' 个' : '暂无数据'}</div>
                </div>
                <div style="grid-column: 1 / -1;">
                    <div class="pool-card-field-label">密钥 / 渠道分组</div>
                    <div class="group-chips" style="margin-top:4px;">
                        ${chips || '<span style="font-size:12px;color:var(--text-muted);">点击「分组详情」按钮查询</span>'}
                    </div>
                </div>
                ${_renderGroupPicker(a)}
                ${hasSel ? `
                <div style="grid-column: 1 / -1;background:linear-gradient(135deg, rgba(45,212,168,0.12), rgba(99,102,241,0.12));border:1px solid rgba(45,212,168,0.3);border-radius:10px;padding:12px 14px;margin-top:4px;">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                        <span style="font-size:13px;font-weight:600;color:var(--accent);">✨ 当前选用</span>
                        <span class="badge badge-sub2api" style="margin:0;">${escapeHtml(a.selected_group)}</span>
                        <span style="font-size:12px;color:var(--text-muted);">→</span>
                        <span style="font-size:13px;font-weight:600;">${escapeHtml(a.selected_token_name || '未命名密钥')}</span>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <code style="flex:1;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,0.04);padding:6px 10px;border-radius:6px;font-size:12px;" title="${escapeHtml(selKey)}">${escapeHtml(selKey.slice(0, 12))}…${escapeHtml(selKey.slice(-8))}</code>
                        <button class="btn btn-sm" style="padding:6px 12px;font-size:12px;background:var(--accent);color:#fff;border:none;cursor:pointer;" data-copy-text="${escapeHtml(selKey)}" onclick="handleCopy(this)">📋 复制Key</button>
                        <button class="btn btn-sm" style="padding:6px 10px;font-size:12px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-muted);" onclick="clearSelected('${a.id}')">✕ 清除</button>
                    </div>
                </div>` : `
                <div style="grid-column: 1 / -1;background:var(--bg-secondary);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin-top:4px;color:var(--text-muted);font-size:12px;">
                    💡 尚未选用分组密钥 → 可在上方下拉选择分组和密钥，或点击「👁 分组详情」查看全部再选择
                </div>`}
                ${a.remark ? `<div style="grid-column: 1 / -1;">
                    <div class="pool-card-field-label">备注</div>
                    <div class="pool-card-field-value">${escapeHtml(a.remark)}</div>
                </div>` : ''}
            </div>
            <div class="pool-card-actions">
                <button class="btn btn-success btn-sm" title="使用账号密码登录远程平台，获取 Token（后续查询余额/分组依赖此 Token）" onclick="loginAccount('${a.id}', this)">🔐 登录获取Token</button>
                <button class="btn btn-info btn-sm" title="查询当前账号的剩余余额 / 可用额度" onclick="refreshBalance('${a.id}', this)">💰 查询余额</button>
                <button class="btn btn-primary btn-sm" title="打开分组详情弹窗（自动登录并拉取分组，可查看/复制/选用密钥）" onclick="showGroups('${a.id}', this)">👁 分组详情</button>
                <button class="btn btn-danger btn-sm" title="从账号池中删除此账号（不会影响远程平台）" onclick="deleteAccount('${a.id}')">🗑️ 删除</button>
            </div>
        </div>`;
    }).join('');
}

/* ============================================================
 * 卡片级下拉选择器：选分组 → 选密钥 → 一键选用
 * ============================================================ */
function _renderGroupPicker(a) {
    const groups = (a.groups || []).filter(g => !g.is_channel_group && ((g.tokens || []).length > 0 || (g.sub_groups || []).length > 0));
    if (!groups.length) {
        return ''; // 没有缓存分组时不显示选择器
    }
    const accId = a.id;

    // Flat tokens list: walk sub_groups if any
    const allTokensByGroup = []; // [{groupName, tokens:[{...}]}]
    groups.forEach(g => {
        const gName = g.name || '未命名分组';
        if (g.sub_groups && g.sub_groups.length) {
            g.sub_groups.forEach(sg => {
                const sgName = `${gName} / ${sg.name || '子分组'}`;
                if ((sg.tokens || []).length) {
                    allTokensByGroup.push({ groupName: sgName, tokens: sg.tokens });
                }
            });
        } else if ((g.tokens || []).length) {
            allTokensByGroup.push({ groupName: gName, tokens: g.tokens });
        }
    });
    if (!allTokensByGroup.length) return '';

    const pickerUid = nextUid('pick');
    const groupSelectId = 'gsel_' + pickerUid;
    const tokenSelectId = 'tsel_' + pickerUid;
    const confirmBtnId = 'btn_' + pickerUid;

    // 缓存到全局状态，后续 onchange 用
    if (!state._pickerData) state._pickerData = {};
    state._pickerData[pickerUid] = allTokensByGroup;

    // 分组下拉
    const groupOptions = ['<option value="">— 选择分组（共' + allTokensByGroup.length + '）—</option>']
        .concat(allTokensByGroup.map((g, i) => {
            const sel = (a.selected_group && a.selected_group === g.groupName) ? ' selected' : '';
            return `<option value="${i}"${sel}>${escapeHtml(g.groupName)} · ${g.tokens.length} 条密钥</option>`;
        })).join('');

    // 初始化时填充密钥下拉
    let defaultGroupIdx = -1;
    if (a.selected_group) {
        defaultGroupIdx = allTokensByGroup.findIndex(g => g.groupName === a.selected_group);
    }
    if (defaultGroupIdx < 0) defaultGroupIdx = 0;
    const tokenList = allTokensByGroup[defaultGroupIdx] ? allTokensByGroup[defaultGroupIdx].tokens : [];
    const tokenOptions = ['<option value="">— 选择密钥 —</option>']
        .concat(tokenList.map((t, i) => {
            const name = t.name || t.title || `密钥 ${t.id || (i + 1)}`;
            const sel = (a.selected_token_id && String(a.selected_token_id) === String(t.id)) ? ' selected' : '';
            const remain = t.remaining_quota != null ? ` (剩余${Number(t.remaining_quota).toFixed(0)})` : '';
            return `<option value="${i}" data-token-id="${escapeHtml(String(t.id || ''))}" data-token-key="${escapeHtml(String(t.key || ''))}" data-token-name="${escapeHtml(String(name))}"${sel}>${escapeHtml(name)}${remain}</option>`;
        })).join('');

    return `
    <div style="grid-column: 1 / -1;padding:10px 12px;margin-top:4px;background:rgba(99,102,241,0.05);border:1px solid rgba(99,102,241,0.2);border-radius:10px;">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:600;">🎯 快速选用：选择分组 → 选择密钥 → 一键选用</div>
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end;">
            <select id="${groupSelectId}" data-picker-uid="${pickerUid}" data-acc-id="${escapeHtml(accId)}"
                onchange="onPickerGroupChange(this)"
                style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-primary);font-size:13px;cursor:pointer;">
                ${groupOptions}
            </select>
            <select id="${tokenSelectId}" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-primary);font-size:13px;cursor:pointer;">
                ${tokenOptions}
            </select>
            <button id="${confirmBtnId}" class="btn btn-primary btn-sm"
                data-group-select-id="${escapeHtml(groupSelectId)}"
                data-token-select-id="${escapeHtml(tokenSelectId)}"
                data-acc-id="${escapeHtml(accId)}"
                style="padding:8px 14px;font-size:13px;"
                onclick="onPickerConfirm(this)">✨ 选用</button>
        </div>
    </div>`;
}

// 分组下拉变化：同步刷新密钥下拉
function onPickerGroupChange(sel) {
    const uid = sel.getAttribute('data-picker-uid');
    const accId = sel.getAttribute('data-acc-id');
    const groupIdx = parseInt(sel.value, 10);
    const pickerData = (state._pickerData && state._pickerData[uid]) || [];
    const tokens = pickerData[groupIdx] ? pickerData[groupIdx].tokens : [];

    // 查找同一行里的 token select（按 id 前缀）
    const tokenSel = document.getElementById(sel.id.replace(/^gsel_/, 'tsel_'));
    if (!tokenSel) return;

    const acc = state.accounts.find(a => a.id === accId);
    const options = ['<option value="">— 选择密钥 —</option>']
        .concat(tokens.map((t, i) => {
            const name = t.name || t.title || `密钥 ${t.id || (i + 1)}`;
            const sel = (acc && acc.selected_token_id && String(acc.selected_token_id) === String(t.id)) ? ' selected' : '';
            const remain = t.remaining_quota != null ? ` (剩余${Number(t.remaining_quota).toFixed(0)})` : '';
            return `<option value="${i}" data-token-id="${escapeHtml(String(t.id || ''))}" data-token-key="${escapeHtml(String(t.key || ''))}" data-token-name="${escapeHtml(String(name))}"${sel}>${escapeHtml(name)}${remain}</option>`;
        })).join('');
    tokenSel.innerHTML = options;
}

// 点击「选用」按钮：从两个 select + dataset 里取值并调用 selectToken
function onPickerConfirm(btn) {
    const accId = btn.getAttribute('data-acc-id');
    const gSel = document.getElementById(btn.getAttribute('data-group-select-id'));
    const tSel = document.getElementById(btn.getAttribute('data-token-select-id'));
    if (!gSel || !tSel) return;

    // 分组名
    const gIdx = parseInt(gSel.value, 10);
    if (isNaN(gIdx) || gIdx < 0 || !gSel.selectedOptions || !gSel.selectedOptions[0]) {
        showMsg('listMsg', '❌ 请先选择分组', 'fail');
        return;
    }
    const uid = gSel.getAttribute('data-picker-uid');
    const all = (state._pickerData && state._pickerData[uid]) || [];
    const groupName = all[gIdx] ? all[gIdx].groupName : '';

    // 密钥
    if (!tSel.value || !tSel.selectedOptions || !tSel.selectedOptions[0]) {
        showMsg('listMsg', '❌ 请选择该分组下要使用的密钥', 'fail');
        return;
    }
    const opt = tSel.selectedOptions[0];
    const tokenId = opt.getAttribute('data-token-id') || '';
    const tokenKey = opt.getAttribute('data-token-key') || '';
    const tokenName = opt.getAttribute('data-token-name') || '';
    if (!tokenKey) {
        showMsg('listMsg', '❌ 此密钥缺少完整的 key 字段，请改用分组详情里复制', 'fail');
        return;
    }
    selectToken(accId, groupName, { id: tokenId, key: tokenKey, name: tokenName });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}
function truncate(s, n) {
    if (!s) return '';
    s = String(s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ============================================================
 * 复制到剪贴板
 * ============================================================ */
async function copyText(text, hintId) {
    let ok = false;
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            ok = true;
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
        }
    } catch { ok = false; }
    if (hintId) {
        const el = document.getElementById(hintId);
        if (el) {
            const orig = el.textContent;
            el.textContent = ok ? '已复制 ✓' : '复制失败';
            el.style.color = ok ? 'var(--success)' : 'var(--danger)';
            setTimeout(() => {
                el.textContent = orig;
                el.style.color = '';
            }, 1500);
        }
    }
    return ok;
}

/* ============================================================
 * 选用 / 清除 分组密钥
 * ============================================================ */
async function selectToken(accId, groupName, token) {
    const id = token.id || '';
    const name = token.name || token.title || `密钥 ${String(id).slice(0, 8) || ''}`;
    const key = token.key || token.token || '';
    if (!key) {
        showMsg('listMsg', '❌ 无法选用此密钥：完整 key 字段为空', 'fail');
        return;
    }
    try {
        const r = await req(`${API}/accounts/${accId}/select-token`, 'POST', {
            group_name: groupName,
            token_id: id,
            token_name: name,
            token_key: key,
        });
        showMsg(r.ok ? 'pageMsg' : 'listMsg', (r.ok ? '✅ ' : '❌ ') + (r.message || '操作完成'), r.ok ? 'success' : 'fail');
        if (r.ok) {
            // 更新内存状态
            const acc = state.accounts.find(a => a.id === accId);
            if (acc) {
                acc.selected_group = groupName;
                acc.selected_token_id = id;
                acc.selected_token_name = name;
                acc.selected_token_key = key;
            }
            renderList();
            // 弹窗内刷新选中标记
            refreshModalSelection(accId);
        }
    } catch (e) {
        showMsg('listMsg', '❌ 选用失败：' + (e.message || e), 'fail');
    }
}

async function clearSelected(accId) {
    if (!confirm('确定清除当前账号的选用密钥吗？')) return;
    try {
        const r = await req(`${API}/accounts/${accId}/clear-selection`, 'POST');
        showMsg(r.ok ? 'pageMsg' : 'listMsg', (r.ok ? '✅ ' : '❌ ') + (r.message || '操作完成'), r.ok ? 'success' : 'fail');
        if (r.ok) {
            const acc = state.accounts.find(a => a.id === accId);
            if (acc) {
                acc.selected_group = null;
                acc.selected_token_id = null;
                acc.selected_token_name = null;
                acc.selected_token_key = null;
            }
            renderList();
            refreshModalSelection(accId);
        }
    } catch (e) {
        showMsg('listMsg', '❌ 清除失败：' + (e.message || e), 'fail');
    }
}

function handleSelectToken(btn) {
    const accId = btn.getAttribute('data-acc-id') || '';

function refreshModalSelection(accId) {
    // 弹窗存在时，刷新里面的选中标记
    const modal = document.getElementById('groupsModal');
    if (!modal || !modal.classList.contains('show')) return;
    const acc = state.accounts.find(a => a.id === accId);
    if (!acc) return;
    const selId = acc.selected_token_id;
    const selKey = acc.selected_token_key;
    document.querySelectorAll('.token-item').forEach(el => {
        el.style.borderLeft = el.style.borderRight = '';
        el.style.background = '';
    });
    // 为当前选中的 token 加高亮 + 更换按钮文案
    document.querySelectorAll('[data-token-select]').forEach(btn => {
        const data = btn.dataset;
        const same = (selId && data.tokenId && data.tokenId === selId)
            || (selKey && data.tokenKey && data.tokenKey === selKey);
        if (same) {
            btn.textContent = '✅ 已选用';
            btn.style.background = 'var(--success)';
            const ti = btn.closest('.token-item');
            if (ti) {
                ti.style.borderLeft = '3px solid var(--success)';
                ti.style.background = 'linear-gradient(90deg, rgba(34,197,94,0.08), transparent 50%)';
            }
        } else {
            btn.textContent = '✨ 选用此Key';
            btn.style.background = 'var(--primary)';
        }
    });
}

/* ============================================================
 * 分组详情弹窗
 * ============================================================ */
async function showGroups(id, opts) {
    const acc = state.accounts.find(a => a.id === id);
    if (!acc) return;

    // 兼容旧调用方式：第二个参数可能是按钮元素，也可能是 {force:true, btn:xxx}
    let btn = null;
    let force = true; // 默认强制刷新，保证移动分组后立刻拿到最新
    if (opts && (typeof opts === 'object') && !(opts instanceof Element || (opts.nodeType && opts.nodeType === 1))) {
        btn = opts.btn || null;
        if (opts.force === false) force = false;
    } else if (opts) {
        btn = opts;
    }

    // 按钮加载状态
    let origBtn = '';
    if (btn) {
        origBtn = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;"></span> 加载中';
    }

    document.getElementById('modalTitle').textContent = `${acc.name} - 密钥/渠道分组详情`;
    const body = document.getElementById('modalBody');
    body.innerHTML = `
        <div style="text-align:center;padding:30px;color:var(--text-muted);">
            <span class="spinner" style="border-color:var(--primary-light);border-top-color:var(--primary);width:28px;height:28px;"></span>
            <p style="margin-top:12px;font-size:13px;">正在自动登录并拉取分组数据…</p>
            <p style="margin-top:4px;font-size:11px;color:var(--text-muted);">首次加载需登录远程平台，请稍候</p>
        </div>`;
    document.getElementById('groupsModal').classList.add('show');

    try {
        const r = await req(`${API}/accounts/${id}/groups?force=${force ? 1 : 0}`, 'GET');
        if (!r.ok) throw new Error(r.message || '查询失败');
        const groups = r.groups || [];
        // 保存分组选项列表（用于"切换分组"下拉）
        // 优先用响应顶层的 group_options（已从后端聚合好，带倍率），其次从第一个有 all_group_options 的块里取
        if (!state._groupOpts) state._groupOpts = {};
        let gopts = r.group_options;
        if (!(gopts && gopts.length)) {
            for (const g of groups) {
                if (g && g.all_group_options && g.all_group_options.length) {
                    gopts = g.all_group_options;
                    break;
                }
            }
        }
        if (gopts && gopts.length) {
            state._groupOpts[id] = gopts;
        }
        if (!groups.length) {
            body.innerHTML = `
                <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
                    <span style="font-size:40px;display:block;margin-bottom:12px;">📭</span>
                    <p style="font-size:14px;">暂无分组数据</p>
                    <p style="font-size:12px;margin-top:4px;">该账号下可能还没有创建密钥</p>
                </div>`;
            return;
        }
        const updatedStr = r.groups_updated_at ? fmtTime(r.groups_updated_at) : '';
        const header = `
            <div style="padding:10px 14px;margin-bottom:14px;background:var(--bg-secondary);border-radius:10px;border:1px solid var(--border-light);font-size:12px;line-height:1.8;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-weight:600;">📡 已从远程拉取 ${groups.length} 个分组</span>
                    ${updatedStr ? `<span style="color:var(--text-muted);font-size:11px;">更新于 ${updatedStr}</span>` : ''}
                </div>
                <div>• 点击每条密钥右侧的 <b>「📋 复制Key」</b> 直接复制完整密钥到剪贴板</div>
                <div>• 在密钥行左侧的 <b>「切分组」下拉框</b> 里直接选目标分组就会立刻把该密钥移动过去，和对方网站操作一致</div>
            </div>`;
        body.innerHTML = header + groups.map(g => renderGroupBlock(g, !!g.is_channel_group, id)).join('');
        setTimeout(() => refreshModalSelection(id), 30);
    } catch (e) {
        body.innerHTML = `
            <div style="text-align:center;padding:30px;">
                <p style="color:var(--danger);font-size:14px;">❌ 加载失败：${e.message || e}</p>
                <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="showGroups('${id}', this)">🔄 重试</button>
            </div>`;
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = origBtn;
        }
    }
}

let _uidCounter = 0;
function nextUid(prefix) {
    _uidCounter += 1;
    return prefix + '_' + _uidCounter + '_' + Date.now().toString(36);
}

/* 格式化倍率文本：返回类似「0.07x」「1x 高峰(18:00-22:00)=2x」这种 */
function formatRateLabel(g) {
    if (!g) return '';
    const parts = [];
    const rm = Number(g.rate_multiplier);
    if (!Number.isNaN(rm) && rm > 0) {
        // 去掉末尾多余 0：0.07 -> "0.07"，1.0 -> "1"
        parts.push(Number.isInteger(rm) ? `${rm}x` : `${parseFloat(rm.toPrecision(6))}x`);
    }
    // 高峰倍率（如果启用且有值且和常规倍率不一样）
    if (g.peak_rate_enabled) {
        const pm = Number(g.peak_rate_multiplier);
        if (!Number.isNaN(pm) && pm > 0 && pm !== rm) {
            const pLabel = Number.isInteger(pm) ? `${pm}x` : `${parseFloat(pm.toPrecision(6))}x`;
            const range = (g.peak_start && g.peak_end) ? `(${String(g.peak_start).slice(0,5)}-${String(g.peak_end).slice(0,5)})` : '';
            parts.push(`高峰${range}=${pLabel}`);
        }
    }
    if (!parts.length) return '';
    return parts.join(' · ');
}

function renderGroupBlock(g, isChannel, accId) {
    // 分组标题旁的倍率徽章（仅非渠道、有倍率时显示）
    let rateBadge = '';
    if (!isChannel) {
        const label = formatRateLabel(g);
        if (label) {
            rateBadge = `<span class="badge badge-newapi" style="margin-left:6px;background:rgba(45,212,168,.12);color:var(--accent);border:1px solid rgba(45,212,168,.25);">${escapeHtml(label)}</span>`;
        }
        // platform 小徽章也顺手挂上
        if (g.platform) {
            rateBadge += `<span class="badge badge-newapi" style="margin-left:5px;background:transparent;color:var(--text-muted);border:1px dashed var(--border);">${escapeHtml(String(g.platform))}</span>`;
        }
    }

    const items = isChannel ? (g.channels || []) : (g.tokens || []);
    let inner = '';
    const subGroups = (g.sub_groups || []);
    // 子分组
    for (const sg of subGroups) {
        const isCh = isChannel || !!sg.is_channel_group || ((sg.channels && sg.channels.length) && !(sg.tokens && sg.tokens.length));
        const sgItems = (isCh ? (sg.channels || []) : (sg.tokens || []));
        const sgRateBadge = (!isCh && formatRateLabel(sg)) ?
            `<span class="badge badge-newapi" style="margin-left:6px;background:rgba(45,212,168,.12);color:var(--accent);border:1px solid rgba(45,212,168,.25);">${escapeHtml(formatRateLabel(sg))}</span>` : '';
        inner += `
        <div class="group-block" style="margin-left:12px;border-left:2px dashed var(--border);border-radius:6px 14px 14px 6px;">
            <div class="group-block-head">
                <div class="group-block-title">
                    ${isCh ? '📡' : '🔑'}
                    ${escapeHtml(sg.name || '未命名子分组')}
                    ${sgRateBadge}
                </div>
                <span class="group-block-count">${sg.count || sgItems.length || 0}</span>
            </div>
            ${(sgItems || []).slice(0, 20).map(it => renderItemRow(it, isCh, accId, sg.name || g.name || '')).join('')}
        </div>`;
    }
    // 本分组直接挂的条目
    inner += (items || []).slice(0, 20).map(it => renderItemRow(it, isChannel, accId, g.name || '')).join('');
    if ((items || []).length > 50) {
        inner += `<div style="text-align:center;padding:8px;color:var(--text-muted);font-size:12px;">仅显示前 50 条，共 ${items.length} 条</div>`;
    }

    return `
    <div class="group-block">
        <div class="group-block-head">
            <div class="group-block-title">
                ${isChannel ? '📡' : '🔑'}
                ${escapeHtml(g.name || '未命名分组')}
                ${rateBadge}
                ${isChannel ? '<span class="badge badge-sub2api" style="margin-left:6px;">渠道</span>' : '<span class="badge badge-newapi" style="margin-left:6px;">密钥</span>'}
            </div>
            <span class="group-block-count">${g.count || (items || []).length || 0}</span>
        </div>
        ${inner || '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">此分组下暂无条目</div>'}
    </div>`;
}

function renderItemRow(it, isChannel, accId, groupName) {
    const name = it.name || it.title || (isChannel ? `渠道 ${it.id || ''}` : `令牌 ${it.id || ''}`);
    let metas = [];
    if (it.type) metas.push(`<span>类型：<code>${escapeHtml(String(it.type))}</code></span>`);
    if (it.model) metas.push(`<span>模型：<code>${escapeHtml(truncate(String(it.model), 30))}</code></span>`);
    if (it.base_url) metas.push(`<span>上游：<code>${escapeHtml(truncate(String(it.base_url), 28))}</code></span>`);
    if (it.key_preview) metas.push(`<span>Key：<code>${escapeHtml(it.key_preview)}</code></span>`);
    if (it.status !== undefined && it.status !== null && it.status !== 'active' && it.status !== true) {
        metas.push(`<span style="color:var(--danger);">状态：${escapeHtml(String(it.status))}</span>`);
    }
    if (it.expired_at) {
        metas.push(`<span>过期：<code>${escapeHtml(truncate(String(it.expired_at), 16))}</code></span>`);
    }

    // 配额条（仅密钥用）
    let quotaBar = '';
    if (!isChannel) {
        const used = Number(it.used_quota) || 0;
        const remain = Number(it.remaining_quota) || 0;
        const total = used + remain;
        if (total > 0) {
            const pct = Math.min(100, Math.max(0, (remain / total) * 100));
            quotaBar = `
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:160px;">
                    <div class="quota-bar"><div class="quota-bar-fill" style="width:${pct}%;"></div></div>
                    <span style="font-size:10px;color:var(--text-muted);">剩余 ${remain.toFixed(0)} / 总量 ${total.toFixed(0)}</span>
                </div>`;
        }
    }

    // 操作按钮：如果有完整 key，提供复制、选用功能，以及"切换该key分组"的下拉
    let actions = '';
    let groupSwitcher = '';
    if (!isChannel && it.key) {
        // ====== 切换分组下拉（核心新功能）======
        const opts = (state._groupOpts && state._groupOpts[accId]) || null;
        if (opts && opts.length) {
            const curGid = it._group_id; // 可能是 number / string
            // 用字符串比较，确保数字ID也能命中
            const curGidStr = curGid == null ? '' : String(curGid);
            const sgUid = nextUid('sg');
            const gOptions = ['<option value="">— 切分组（含倍率） —</option>']
                .concat(opts.map(o => {
                    const oidStr = o.id == null ? '' : String(o.id);
                    const sel = (curGidStr !== '' && oidStr === curGidStr) ? ' selected' : '';
                    const rate = formatRateLabel(o);
                    const plat = o.platform ? `  [${String(o.platform)}]` : '';
                    const display = rate
                        ? `${String(o.name || o.id || '未命名分组')}  · ${rate}${plat}`
                        : `${String(o.name || o.id || '未命名分组')}${plat}`;
                    return `<option value="${escapeHtml(oidStr || o.name || '')}" data-gname="${escapeHtml(String(o.name || ''))}"${sel}>${escapeHtml(display)}</option>`;
                })).join('');
            groupSwitcher = `
            <div style="flex-shrink:0;margin-left:6px;">
                <select id="${sgUid}"
                    data-acc-id="${escapeHtml(accId)}"
                    data-key-id="${escapeHtml(String(it.id || ''))}"
                    data-key-name="${escapeHtml(String(name))}"
                    data-cur-group="${escapeHtml(curGidStr)}"
                    title="把该密钥移动到另一个分组（直接调用远程 PUT /api/v1/keys/{id}）"
                    onchange="handleMoveGroup(this)"
                    style="padding:5px 8px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text-primary);font-size:12px;cursor:pointer;min-width:240px;max-width:360px;">
                    ${gOptions}
                </select>
            </div>`;
        }

        const copyUid = nextUid('cp');
        actions = `
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:10px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-sm" style="padding:4px 10px;font-size:12px;background:transparent;border:1px solid var(--border);cursor:pointer;"
                    data-copy-text="${escapeHtml(String(it.key))}"
                    data-copy-hint="${escapeHtml(copyUid)}"
                    onclick="handleCopy(this)">📋 复制Key</button>
            <span id="${copyUid}" style="font-size:11px;color:var(--text-muted);min-width:60px;text-align:center;">复制</span>
        </div>`;
    } else if (isChannel && it.base_url) {
        const copyUid = nextUid('cp');
        actions = `
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:10px;">
            <button class="btn btn-sm" style="padding:4px 10px;font-size:12px;background:transparent;border:1px solid var(--border);cursor:pointer;"
                    data-copy-text="${escapeHtml(String(it.base_url))}"
                    data-copy-hint="${escapeHtml(copyUid)}"
                    onclick="handleCopy(this)">📋 复制地址</button>
            <span id="${copyUid}" style="font-size:11px;color:var(--text-muted);min-width:60px;text-align:center;">复制</span>
        </div>`;
    }

    return `
    <div class="token-item">
        <div class="token-item-info">
            <div class="token-item-name">${escapeHtml(String(name))}</div>
            <div class="token-item-meta">${metas.join('') || (it.id ? `<code>ID: ${escapeHtml(String(it.id))}</code>` : '')}</div>
        </div>
        ${quotaBar}
        ${groupSwitcher}
        ${actions}
    </div>`;
}

/* ============================================================
 * 单个密钥 → 切换所属分组（直接调用远程修改）
 * ============================================================ */
async function handleMoveGroup(sel) {
    const accId = sel.getAttribute('data-acc-id') || '';
    const keyId = sel.getAttribute('data-key-id') || '';
    const curGid = sel.getAttribute('data-cur-group') || '';
    const keyName = sel.getAttribute('data-key-name') || '';
    if (!accId || !keyId) {
        showMsg('listMsg', '❌ 参数缺失：账号或密钥ID为空', 'fail');
        sel.value = curGid || '';
        return;
    }
    // 选择了默认空值 → 还原，不操作
    if (!sel.value) {
        sel.value = curGid || '';
        return;
    }
    const opt = sel.selectedOptions && sel.selectedOptions[0];
    const targetName = opt ? (opt.getAttribute('data-gname') || opt.textContent || '') : '';
    const targetId = sel.value;
    // 选了和当前相同的分组：还原提示一下，也不需要发请求
    if (curGid !== '' && String(targetId) === String(curGid)) {
        showMsg('listMsg', '💬 当前已经是该分组', 'info');
        return;
    }

    sel.disabled = true;
    const origColor = sel.style.background;
    sel.style.background = 'var(--bg-secondary)';
    sel.style.cursor = 'progress';
    sel.title = `正在移动密钥 → ${targetName || targetId} …`;
    try {
        showMsg('pageMsg', `⏳ 正在移动密钥「${keyName || keyId}」到「${targetName || targetId}」…`, 'info');
        const r = await req(`${API}/accounts/${accId}/keys/${encodeURIComponent(keyId)}/move-group`, 'POST', {
            target_group_id: targetId,
            target_group_name: targetName || '',
        });
        if (!r.ok) throw new Error(r.message || '操作失败');
        showMsg('pageMsg', '✅ 移动成功，已立即同步远程：' + (r.message || ''), 'success');
        // 强制刷新整个弹窗（force=true → 后端再拉一次远程 + 更新缓存），
        // 确保那条密钥立刻显示在新分组下面，旧分组里消失
        await showGroups(accId, {force: true});
    } catch (e) {
        showMsg('listMsg', '❌ 切换分组失败：' + (e.message || e), 'fail');
        // 还原选择，让用户能重新选或重试
        sel.value = curGid || '';
    } finally {
        sel.disabled = false;
        sel.style.background = origColor || '';
        sel.style.cursor = 'pointer';
        sel.title = '把该密钥移动到另一个分组（直接调用远程 PUT /api/v1/keys/{id}）';
    }
}

function closeModal() {
    document.getElementById('groupsModal').classList.remove('show');
}
document.getElementById('groupsModal').addEventListener('click', (e) => {
    if (e.target.id === 'groupsModal') closeModal();
});

/* ============================================================
 * 启动
 * ============================================================ */
loadList();
</script>
